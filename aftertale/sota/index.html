<!doctype html>
<html lang="ja">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>誰が為のセレナーデ（ソウタ編 試遊版）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
  [hidden] { display: none !important; }
  body { margin: 0; }
  :root {
    --ground: #15121c;
    --panel: #1f1a28;
    --panel2: #2a2334;
    --line: #3b3248;
    --ink: #ece6d6;
    --muted: #a69cb2;
    --akane: #e3875c;
    --gold: #d8b26a;
    --blue: #4f8ad8;
    --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--hand); font-size: 16px; }
  button { font: inherit; color: inherit; }
  button:focus-visible, .hs:focus-visible { outline: 2px solid var(--akane); outline-offset: 2px; }

  #app { height: 100%; max-width: 760px; margin: 0 auto; padding: 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .clock { display: flex; align-items: baseline; gap: 12px; }
  #clock { font-family: var(--serif); font-weight: 800; font-size: 22px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .bells { display: flex; gap: 5px; align-items: center; }
  .bells i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--akane); display: block; }
  .bells i.on { background: var(--akane); }
  .bells-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .bar-actions { display: flex; gap: 6px; margin-left: auto; justify-content: flex-end; }   /* 時計の下に折り返したときも右詰め */
  .bar-actions button { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .bar-actions button:hover { border-color: var(--akane); }
  .bar-actions button:disabled { opacity: .35; cursor: default; }
  .menu-wrap { position: relative; }
  .menu-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 170px; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .bar-actions .menu-panel button { text-align: left; border-color: transparent; padding: 8px 10px; }
  .bar-actions .menu-panel button:hover { border-color: var(--akane); }
  .menu-panel .vol { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; font-size: 13px; }
  .menu-panel .vol input { width: 110px; accent-color: var(--akane); }
  /* 文字の速さ：4つのボタンから1つを選ぶ */
  .speed { display: flex; flex-direction: column; gap: 5px; padding: 6px 10px; font-size: 13px; }
  .seg { display: flex; gap: 4px; }
  .seg button, .bar-actions .menu-panel .seg button { flex: 1; text-align: center; padding: 5px 6px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"], .bar-actions .menu-panel .seg button[aria-pressed="true"] { border-color: var(--akane); background: #3a2a2e; }
  .settings { display: flex; flex-direction: column; }
  .settings .set-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .settings .set-row:first-child { padding-top: 4px; }
  .settings .set-label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .settings .vol { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .settings .vol input { flex: 1; max-width: 240px; accent-color: var(--akane); }
  .title-redo { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(31, 26, 40, .6); }
  .title-redo .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .btn-sub { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; text-align: left; font-size: 13px; color: var(--ink); cursor: pointer; }
  .btn-sub:hover { border-color: var(--akane); }
  .btn-sub .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

  .scene-wrap { flex: 0 0 auto; min-height: 160px; display: flex; align-items: flex-start; justify-content: center; }
  .scene { position: relative; width: 100%; max-width: calc(58vh * 1.5); aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: #1c1620; }
  .scene img { position: absolute; display: block; max-width: none; }
  .stage { position: absolute; inset: 0; }
  .cutin { position: absolute; inset: 4%; z-index: 1; opacity: 0; transform: translateX(6%) rotate(.6deg); transition: opacity .35s ease, transform .35s ease; pointer-events: none; background: #1c1620; border: 3px solid #efe6d6; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); overflow: hidden; }
  .cutin.show { opacity: 1; transform: none; }
  .cutin img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
  .cutin .clock-hands { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 屋上の手帳をなぞる：拾って開いた手帳の絵（protag_notebook_front）で、右ページの名前のところへ寄る（中心 930,560・2.6倍。生徒手帳は手のひらにのる大きさなので、強めに寄る） */
  .cutin.nbz { pointer-events: auto; }
  .nbz-in { position: absolute; inset: 0; transform-origin: 60.55% 54.69%; transform: translate(-10.55%, -4.69%) scale(2.6); transition: transform 1.4s cubic-bezier(.3, .6, .2, 1); }
  .nbz-in.far { transform: none; transition: none; }
  .cutin .nbz-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .nbz-row { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .nbz-row::after { content: ""; position: absolute; left: 0; top: 18%; bottom: 14%; width: 0; border-radius: 999px; background: linear-gradient(90deg, rgba(255, 226, 170, 0), rgba(255, 226, 170, .2) 12%, rgba(255, 226, 170, .2) 88%, rgba(255, 226, 170, 0)); mix-blend-mode: screen;   /* なぞった後も字が読めるくらいの、うすい光 */ transition: width .9s ease; }
  .nbz-row.traced::after { width: 100%; }
  /* なぞり終えた名前：光らせず、少しだけ暗く沈ませる（まだなぞれる名前の、明滅する光と見分けるため） */
  .nbz-row.done::before { content: ""; position: absolute; inset: 14% -2% 10%; border-radius: 999px; background: rgba(30, 14, 24, .3); mix-blend-mode: multiply; }
  .nbz-row:not(.traced):not(.done):not(.blank):not(:disabled)::before { content: ""; position: absolute; inset: 20% 0 16%; border-radius: 999px; background: rgba(255, 238, 200, .16); mix-blend-mode: screen; opacity: 0; animation: nbzHint 2.8s ease-in-out infinite; }
  @keyframes nbzHint { 50% { opacity: 1; } }
  .nbz-row:focus-visible { outline: 1px solid rgba(255, 238, 200, .8); outline-offset: 0; }
  .nbz-row:disabled { cursor: default; }
  .nbz-cap { position: absolute; left: 0; right: 0; bottom: 6px; margin: 0; text-align: center; font-size: 12px; letter-spacing: .12em; color: #f4ecdd; text-shadow: 0 1px 4px rgba(0, 0, 0, .9); pointer-events: none; transition: opacity .3s; }
  .nbz-cap.gone { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .nbz-in { transition: none; } .nbz-row::after { transition: none; } .nbz-row::before { animation: none; } }
  .scene.cut .hs, .scene.story .hs { visibility: hidden; }
  .get-item { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(12, 9, 16, .55); opacity: 0; transition: opacity .25s ease; cursor: pointer; }
  .get-item.show { opacity: 1; }
  .get-in { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: scale(.85); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
  .get-item.show .get-in { transform: none; }
  .get-in img { position: static; max-width: 70%; height: auto; width: auto; max-height: min(30vh, calc((min(100vw, 760px) - 32px) / 3.4)); min-height: 0; filter: drop-shadow(0 8px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(255, 226, 180, .35)); }
  .get-label { margin: 0; font-size: 12px; letter-spacing: .3em; color: var(--gold); }
  .get-name { margin: 0; font-family: var(--serif); font-weight: 800; font-size: clamp(16px, 2.6vw, 22px); color: #f4ecdd; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .scene .bg { inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .5s ease, opacity .7s ease; }
  .scene.talk .bg, .scene.talk .sit { filter: brightness(.55) saturate(.8); }
  .scene .bg-clock { position: absolute; pointer-events: none; }
  .sit { position: absolute; width: auto; transition: filter .5s ease; pointer-events: none; }
  .sit.gone { display: none; }
  .scene .sit-front { pointer-events: none; }
  .scene .chime-cg { inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; pointer-events: none; z-index: 2; }
  .scene.cg .chime-cg { opacity: 1; }
  .scene.cg .hs { visibility: hidden; }
  .leftover { position: absolute; background: #efe8da; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .portrait { right: 1%; bottom: 0; height: 97%; width: auto; opacity: 0; transform: translateX(12px); transition: opacity .4s ease, transform .4s ease; pointer-events: none; }
  .portrait.show { opacity: 1; transform: none; }
  /* 涙のきらめき（2026-11-13 作者の指示：スマホでは涙が見えづらいので、ときどき光らせる）。涙のある表情の絵だけ、涙の形の白い光（img/<絵>_glint.webp）を重ねる */
  .glint { display: none; }
  @media (pointer: coarse), (max-width: 820px) {
    .glint { display: block; opacity: 0; transition: none; }
    /* 2026-11-14 作者の指示：全体の点滅ではなく、光が涙の筋にそって上から下へ少しずつ流れる。
       光の帯（--gy の高さ・--gw の幅）だけを見せるマスクを、下の JS（glintFlow）が涙のある高さの範囲で動かす */
    .glint.show { transform: none; opacity: .95;
      -webkit-mask-image: linear-gradient(to bottom, transparent calc(var(--gy, -30%) - var(--gw, 4%)), #000 var(--gy, -30%), transparent calc(var(--gy, -30%) + var(--gw, 4%)));
              mask-image: linear-gradient(to bottom, transparent calc(var(--gy, -30%) - var(--gw, 4%)), #000 var(--gy, -30%), transparent calc(var(--gy, -30%) + var(--gw, 4%))); }
  }
  @media (prefers-reduced-motion: reduce) { .glint.show { -webkit-mask-image: none; mask-image: none; opacity: .5; } }
  /* 章の子とは別に、その場にいる子（第五章のミオ）。左寄りに立つ。far は少し離れた所（二回り小さく、奥に） */
  .guest { position: absolute; left: 4%; bottom: -7%; height: 100%; width: auto; opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 3; }   /* 大きさ・位置は動かさない（出るときにズームして見えないように） */
  .guest.show { opacity: 1; }
  .guest.mid { height: 80%; bottom: 6%; left: 9%; }
  .guest.distant { height: 19.7%; top: 37.3%; bottom: auto; left: 42.2%; }   /* 2026-11-10：廊下の先に立つ全身の絵（mio_f_*）。足もとの奥行きでの扉（約2m）・天井の高さから身長（約155cm）を計算した大きさ */
  .guest.small { height: 134.5%; top: 14%; bottom: auto; left: 9%; }   /* 2026-11-10：一回り小さい全身の絵（mio_f_*、700×1960）。大きい版の0.8倍で、脚は画面の下で切れる */
  .guest.far { height: 70%; bottom: -3%; left: 14%; filter: brightness(.9); }
  .scene.talk .guest.show { filter: none; }
  .hs { position: absolute; background: transparent; border: 1px dashed transparent; border-radius: 4px; padding: 0; cursor: pointer; }
  .hs::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff4de; box-shadow: 0 0 8px 2px rgba(255, 220, 170, .7); opacity: .55; animation: glint 2.8s ease-in-out infinite; }
  .hs span { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(15, 12, 20, .78); color: var(--ink); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .hs span { pointer-events: none; }  /* 名札は押せない（隣の探索ポイントに重なっても、タップを横取りしない） */
  /* ホバーの枠と名札は、マウスのときだけ（タッチではタップ後に表示が残り、隣と重なって見えるため） */
  @media (hover: hover) {
    .hs:hover { border-color: rgba(236, 230, 214, .7); background: rgba(255, 240, 220, .07); }
    .hs:hover span { opacity: 1; }
  }
  .hs:focus-visible { border-color: rgba(236, 230, 214, .7); background: rgba(255, 240, 220, .07); outline: none; }
  .hs:focus-visible span { opacity: 1; }
  .hs:focus:not(:focus-visible) { outline: none; }
  /* タッチでは、小さな探索ポイントでも指で押しやすいよう、見た目はそのままで判定を少し広げる */
  @media (pointer: coarse) { .hs::before { content: ""; position: absolute; inset: -5px; } }
  .scene.talk .hs { visibility: hidden; }
  @keyframes glint { 50% { opacity: .15; transform: scale(.7); } }
  @keyframes hsGlint { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .hs { animation: none !important; } }

  .inv { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
  .inv .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-right: 4px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--akane); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .chip img { height: 20px; width: auto; display: block; }
  .chip.act { border-color: var(--akane); color: var(--akane); }
  .chip.blue { border-color: var(--blue); }


  .msg { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 18px; min-height: 124px; max-height: 46vh; overflow-y: auto; box-sizing: border-box; cursor: pointer; }
  .speaker { font-family: var(--serif); font-weight: 800; color: var(--akane); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px; }
  .text { line-height: 1.85; white-space: pre-wrap; }
  .text.narr { color: #d9d2c4; }
  .more { position: absolute; right: 14px; bottom: 6px; font-size: 11px; color: var(--akane); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .msg.lifted { z-index: 6; box-shadow: 0 -8px 18px rgba(40, 30, 20, .22); }
  .choice { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; line-height: 1.6; cursor: pointer; }
  .choice:hover { border-color: var(--akane); }
  .choice.burnt { opacity: .55; }
  .choices .choice.picked { color: #8a6f8f; }
  .choices .choice.picked:hover { color: var(--blue); }
  .choices.roof .choice.picked { color: #8d88a3; }
  .choices.roof .choice { color: #4a5a72; letter-spacing: .02em; }
  .choices.roof .choice::before { content: "…"; }
  .choices.roof .choice:hover::before { content: "…"; font-size: inherit; top: 9px; }
  .choice .sting { display: block; font-size: .85em; color: var(--muted); margin-top: 2px; }

  .overlay { position: fixed; inset: 0; background: rgba(12, 10, 16, .9); display: grid; place-items: center; padding: 16px; overflow-y: auto; z-index: 10; }
  .ov-card > * { flex-shrink: 0; }
  .ov-card { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .ov-card h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; margin: 0; text-wrap: balance; }
  .ov-card p { margin: 0; line-height: 1.85; }
  .ov-card .alb-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ov-card .alb-pair figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ov-card .alb-pair img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border: 3px solid #fbf7ee; box-shadow: 0 0 0 1px #b5a689; box-sizing: border-box; }
  .ov-card .alb-pair figure.locked .thumb-empty { aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); color: var(--muted); }
  .ov-card .alb-pair figcaption { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  @media (max-width: 480px) { .ov-card .alb-pair { grid-template-columns: 1fr; } }
  .ov-card .howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; line-height: 1.7; }
  .ov-card .howto b { font-family: var(--serif); }
  .ov-card h3 { font-family: var(--serif); font-size: 16px; margin: 6px 0 0; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--akane); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 18px; cursor: pointer; }
  .btn:hover { border-color: var(--akane); }
  .btn.primary { background: var(--akane); border-color: var(--akane); color: #1a1218; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .sketch { width: 100%; max-width: 360px; align-self: center; display: block; }
  .painting { position: relative; width: 100%; max-width: 420px; align-self: center; border: 8px solid #e9e3d6; box-sizing: border-box; background: #999; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .painting::before { content: ''; display: block; padding-top: 66.667%; }
  .painting img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .painting .grey { filter: grayscale(.92) brightness(.82) contrast(.9); transition: opacity 3.6s ease; }
  .painting .grey.off { opacity: 0; }
  .painting .tears { position: absolute; inset: 0; width: 100%; height: 100%; }
  .painting .sign { position: absolute; right: 8px; bottom: 5px; font-size: 12px; color: #f7f2e8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .flip { position: relative; margin-bottom: 36px; width: 100%; max-width: 420px; align-self: center; }
  .flip::before { content: ''; display: block; padding-top: 66.667%; }
  .flip-in { position: absolute; inset: 0; transition: transform .22s ease-in; }
  .flip.turn .flip-in { transform: scaleX(0); }
  .flip .face { position: absolute; inset: 0; }
  .flip .face.back, .flip.on .face:not(.back) { display: none; }
  .flip.on .face.back { display: block; }
  .flip .face img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #flipBtn { align-self: center; }
  .zoom-btn { position: absolute; right: 0; bottom: -40px; width: 30px; height: 30px; padding: 5px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: rgba(20, 16, 26, .65); color: #f4ecdd; cursor: pointer; z-index: 2; }
  .zoom-btn:hover { background: rgba(20, 16, 26, .85); }
  .zoom-btn svg { width: 100%; height: 100%; display: block; }
  .sign-zoom { position: absolute; right: 6px; bottom: 6px; width: 58%; z-index: 3; cursor: zoom-out; border: 2px solid #efe6d6; box-shadow: 0 6px 16px rgba(0,0,0,.55); }
  .sign-zoom img, .flip .face .sign-zoom img { width: 100%; height: auto; object-fit: contain; display: block; box-shadow: none; }
  .sketch { border-radius: 4px; }
  .cg { width: 100%; display: block; border-radius: 4px; }
  .quote { font-family: var(--serif); font-size: 17px; border-left: 2px solid var(--akane); padding-left: 12px; }

  .dial { display: flex; gap: 14px; justify-content: center; }
  .poem { font-family: var(--serif); font-size: 17px; line-height: 2.1; background: #f1ebdf; color: #2a2327; padding: 14px 18px; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .poem .t { font-size: 13px; color: #6b5f58; margin-bottom: 4px; }
  .poem .gr { font-size: min(15px, 3.9vw); line-height: 1; display: flex; flex-direction: row-reverse; border-top: 1px solid #cdbca5; border-right: 1px solid #cdbca5; width: max-content; margin: 8px auto; }
  .poem .gr .pc { display: flex; flex-direction: column; }
  .poem .gr span { position: relative; width: 1.6em; height: 1.42em; display: flex; align-items: center; justify-content: center; border-left: 1px solid #cdbca5; border-bottom: 1px solid #cdbca5; }
  .poem .gr i { font-style: normal; writing-mode: vertical-rl; }
  .poem.p-draft .gr i { opacity: .1; filter: blur(1.7px); }

  /* ===== 見た目の方針：暗い画面に橙の印、という「生成物らしい」配色をやめ、夕方の教室に置かれた紙のノートにする =====
     ・地は生成りの紙。字は鉛筆とボールペンの色。押せるものは青（ボールペン）、印は朱（判子）だけ
     ・角丸・光る縁・ガラス風の板はなし。区切りは罫線と下線だけ
     ・場面の絵はノートに貼った写真。文章の欄はノートの罫線の上 */
  :root {
    --ground: #e7dcc6; --panel: #f4eddd; --panel2: #e9dfca; --line: #c3b296; --ink: #2a2420; --muted: #78695a;
    --akane: #b8402a; --gold: #8f6d22; --blue: #2d4f8a; color-scheme: light;
  }
  body { background: var(--ground); color: var(--ink); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .16; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 .6 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
  .bar-actions button, .menu-panel, .seg button, .bar-actions .menu-panel .seg button, .title-redo, .btn-sub, .scene, .hs, .chip, .msg, .choice, .ov-card, .btn, .cg, .btn-reset, .btn-tab, .shelf-bar, .btn-quiet, .slot, .shelf .slot, .album .slot { border-radius: 0; }
  /* 上の欄 */
  #clock { color: var(--ink); }
  .bells i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--akane); transform: rotate(-8deg); }
  .bells i.on { background: var(--akane); box-shadow: none; }
  .bar-actions button { border: 0; border-bottom: 1px solid var(--line); padding: 5px 6px; letter-spacing: .06em; background: none; color: var(--blue); }
  .bar-actions button:hover { border-bottom-color: var(--blue); border-bottom-width: 2px; padding-bottom: 4px; }
  .bar-actions button:disabled { opacity: .35; color: var(--muted); border-bottom-color: transparent; }
  .menu-panel { border: 1px solid var(--line); box-shadow: 2px 4px 0 rgba(60, 45, 30, .18); background: var(--panel); padding: 8px; }
  .bar-actions .menu-panel button { border: 0; border-bottom: 1px dashed transparent; color: var(--ink); }
  .bar-actions .menu-panel button:hover { border-bottom-color: var(--blue); border-bottom-width: 1px; padding-bottom: 8px; }
  .seg button, .bar-actions .menu-panel .seg button { background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); }
  .seg button[aria-pressed="true"], .bar-actions .menu-panel .seg button[aria-pressed="true"] { background: none; border-bottom: 2px solid var(--blue); color: var(--blue); }
  .menu-panel .vol input, .settings .vol input { accent-color: var(--blue); }
  /* 場面の絵：ノートに貼った写真（白い縁と、少しの影） */
  .scene { border: 4px solid #fbf7ee; background: #cfc3ab; box-shadow: 0 0 0 1px #b5a689, 2px 5px 0 rgba(60, 45, 30, .18); }
  .hs::after { width: 6px; height: 6px; margin: -3px 0 0 -3px; box-shadow: 0 0 4px 1px rgba(255, 220, 170, .5); }
  .hs span { border-radius: 0; background: rgba(250, 245, 234, .94); color: var(--ink); border-bottom: 1px solid var(--blue); padding: 1px 6px; }
  /* タッチ（スマホ）では、ホバーで枠を確かめられないので、押せる範囲の全体を枠で見せる。
     明るい背景でも暗い背景でも見えるよう、白い点線の外側に細い影の線を重ねる */
  @media (pointer: coarse) {
    .hs { border: 1.5px dashed rgba(255, 250, 238, .92); background: rgba(255, 244, 226, .10); border-radius: 6px;
          box-shadow: 0 0 0 1px rgba(40, 28, 20, .45), inset 0 0 0 1px rgba(40, 28, 20, .30); }
    /* 印も名札も出さず、枠だけで見せる（名札を出すと、調べる場所が多い部屋で枠と名札が入りまじって見づらいため） */
    .hs::after { display: none; }
    /* 枠は、白い点と同じ間隔（2.8秒）でゆっくり明滅させる。消えきらないよう一番薄いときも少し残す */
    .hs { animation: hsGlint 2.8s ease-in-out infinite; }
  }
  /* 持ち物：ノートに貼ったメモ */
  .inv .label { color: var(--muted); }
  .chip { border: 0; background: var(--panel2); border-bottom: 1px solid var(--line); padding: 4px 10px; color: var(--ink); }
  .chip:hover { border-bottom-color: var(--blue); background: #e3d7bd; }
  .chip.act { color: var(--blue); border-bottom-color: var(--blue); }
  /* 文章の欄：ノートの1ページ。罫線の上に字が乗り、左に綴じの線 */
  .msg { background: var(--panel) repeating-linear-gradient(to bottom, transparent 0, transparent 28.6px, rgba(45, 79, 138, .16) 28.6px, rgba(45, 79, 138, .16) 29.6px); background-position: 0 11px;
         border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 18px 20px 24px; box-shadow: 2px 5px 0 rgba(60, 45, 30, .12); }
  .msg::before { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 1px; background: rgba(184, 64, 42, .45); }
  .text.narr { color: #3a322b; }
  .speaker { letter-spacing: .14em; color: var(--akane); }
  .speaker::before { content: "─ "; color: rgba(184, 64, 42, .55); font-weight: 400; }
  .more { bottom: 8px; right: 16px; color: var(--akane); }
  /* 選択肢：ノートの行。重ねるとボールペンで線を引いたように */
  .choice { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 10px 9px 26px; position: relative; color: var(--ink); }
  .choice::before { content: "・"; position: absolute; left: 8px; top: 9px; color: var(--muted); }
  .choice:hover { border-bottom: 2px solid var(--blue); padding-bottom: 8px; color: var(--blue); }
  .choice:hover::before { content: "▶"; color: var(--blue); font-size: 11px; top: 12px; }
  .choices { gap: 2px; margin-top: 10px; margin-left: -24px; padding-left: 24px; margin-right: -18px; padding-right: 18px; background: var(--panel); }   /* 選択肢の部分は罫線を消し、選択肢の下線だけにする（線が重なって見づらいので） */
  /* 重ねて出す画面：机の上に置いた紙 */
  .overlay { background: rgba(58, 46, 34, .55); }
  .ov-card { background: var(--panel); border: 1px solid var(--line); padding: 24px 22px; box-shadow: 3px 6px 0 rgba(60, 45, 30, .2); color: var(--ink); }
  .ov-card h2 { letter-spacing: .06em; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .eyebrow { letter-spacing: .2em; color: var(--akane); }
  .note { color: var(--muted); }
  .btn { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; letter-spacing: .06em; color: var(--ink); }
  .btn:hover { border-bottom-color: var(--blue); color: var(--blue); }
  .btn.primary { background: none; color: var(--blue); border-bottom: 2px solid var(--blue); font-weight: 600; }
  .btn.primary:hover { background: rgba(45, 79, 138, .07); }
  .btn-sub { border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); }
  .btn-sub:hover { border-bottom-color: var(--blue); color: var(--blue); }
  .title-redo { border: 0; border-left: 1px solid var(--line); background: none; padding-left: 14px; }
  .btn-reset { border: 0; border-bottom: 1px solid var(--akane); padding: 6px 4px; background: none; color: var(--akane); }
  .btn-reset:hover { background: none; color: var(--akane); border-bottom-width: 2px; }
  .btn-tab { border: 0; border-bottom: 1px solid var(--line); padding: 3px 8px; color: var(--muted); }
  .btn-tab.on { border-bottom: 2px solid var(--gold); color: var(--ink); }
  .btn-quiet { color: var(--muted); }
  .slot { background: #efe7d6; }
  .shelf-bar { height: 4px; background: #e2d7c1; border-bottom: 1px solid var(--line); }
  .shelf-bar i { background: #8d8273; }
  .settings .set-row { border-bottom: 1px dashed var(--line); }
  .log-who { color: var(--akane); }
  .log-t { color: var(--ink); }
  button:focus-visible, .btn:focus-visible, .choice:focus-visible { outline: 0; box-shadow: 0 2px 0 0 var(--blue); }
  .ov-card .btn.primary:focus:not(:hover) { box-shadow: none; }
  /* タイトル：タップするまでは絵を全部見せる。題は左下に、写真に貼った白いラベルで。タップしたら左から紙がかぶさってメニュー */
  .title-screen { background: var(--title-img) center / cover no-repeat, var(--ground); padding-left: max(16px, 6vw); transition: background .5s ease; }
  .title-screen.menu { background: linear-gradient(90deg, rgba(244, 237, 221, .97) 0%, rgba(244, 237, 221, .93) 40%, rgba(244, 237, 221, .3) 78%, rgba(244, 237, 221, 0) 100%), var(--title-img) center / cover no-repeat, var(--ground); }
  .title-screen:not(.menu) .vtitle { position: fixed; left: 6vw; bottom: 24vh; writing-mode: horizontal-tb; font-size: clamp(20px, 3.6vw, 30px); letter-spacing: .16em; line-height: 1.3;
    background: rgba(250, 245, 234, .92); color: var(--ink); padding: 10px 18px; border-bottom: 2px solid var(--akane); box-shadow: 2px 4px 0 rgba(0, 0, 0, .25); transform: rotate(-1.2deg); }
  .title-screen:not(.menu) .vtitle span { color: var(--akane); }
  .title-screen.menu .vtitle { color: var(--ink); }
  .title-screen.menu .vtitle span { color: var(--akane); }
  .title-card { background: none; border: 0; box-shadow: none; padding: 0; }
  .tap-hint { color: var(--ink); letter-spacing: .3em; text-shadow: none; background: rgba(250, 245, 234, .85); width: max-content; margin: 0 auto; padding: 4px 14px; bottom: 10vh; }
  .title-side .btn { color: var(--ink); }
  .title-side .btn.primary { color: var(--blue); }
  .title-side .note { color: var(--muted); }

  /* ===== 紙の見た目：残っていた暗い板（セーブ・棚・実績・曲目・謎解き）も紙に =====
     一覧の行は、薄い紙を重ねた札。選べる行は重ねると青い線。印は朱・金 */
  .save-slot, .pair-side, .ach-row, .slot, .ost-row { background: #efe7d6; border: 1px solid var(--line); border-left: 3px solid var(--line); color: var(--ink); }
  .save-slot .info { color: var(--ink); }
  .save-slot .no, .save-slot .when, .slot .who, .ost-row .no, .ost-row .desc, .ost-row .st, .ach-row .cond, .ach-row .when, .ach-row .ach-mark { color: var(--muted); }
  .save-slot .btn { border-bottom: 1px solid var(--blue); color: var(--blue); }
  .save-slot .btn:hover { border-bottom-width: 2px; padding-bottom: 6px; }
  .save-slot .btn:disabled { opacity: .3; color: var(--muted); border-bottom-color: var(--line); }
  button.pair-side:hover, .album .slot.got:hover, .ost-row:hover { border-left-color: var(--blue); background: #ebe2cd; }
  .pair-side.saved, .album .slot.saved, .shelf .slot.got.saved { border-left-color: var(--gold); box-shadow: none; }
  .shelf .slot.got { border-left-color: var(--blue); box-shadow: none; }
  .slot .thumb-empty, .pair-side .thumb-empty { color: #b3a68d; background: repeating-linear-gradient(135deg, #e6dcc7 0 6px, #ded3bb 6px 12px); border-radius: 0; }
  .slot .thumb { border-radius: 0; border: 2px solid #fbf7ee; box-sizing: border-box; }
  .slot .tag { background: var(--blue); color: #fbf7ee; border-radius: 0; }
  .slot.saved .tag { background: var(--gold); }
  @keyframes shelfGlow { 50% { box-shadow: 0 0 0 2px rgba(45, 79, 138, .35); } }
  @keyframes shelfGlowGold { 50% { box-shadow: 0 0 0 2px rgba(143, 109, 34, .45); } }
  .shelf-bar { border-radius: 0; }
  .shelf-bar i { background: var(--blue); }
  .ost-row.on { background: #e8dec6; border-left-color: var(--akane); border-color: var(--line); border-left-color: var(--akane); }
  .ost-row.on .st { color: var(--akane); }
  .ost-row:hover { border-color: var(--line); border-left-color: var(--blue); }
  .ost-row.locked:hover { border-left-color: var(--line); background: #efe7d6; }
  .ost-row.bonus { border-style: solid; border-left-color: var(--gold); }
  .ost-row .ttl small { border-radius: 0; }
  .ach-row.on .ach-mark { color: var(--akane); }
  .ach-row.x { border-color: var(--line); border-left-color: var(--gold); box-shadow: none; background: #ebe2cd; }
  .ach-row.x .ttl, .ach-row .x-msg, .ach-note, .ach-x-note { color: var(--gold); }
  .wheel output { background: #fbf7ee; border: 1px solid var(--line); border-radius: 0; color: var(--ink); }
  .fboard { background: #efe7d6; border-radius: 0; }
  .cutin, .scene { background-color: #cfc3ab; }
  .btn.primary { color: var(--blue); }
  .poem { border-radius: 0; box-shadow: 2px 5px 0 rgba(60, 45, 30, .18); }
  /* 章の終わり・朝の結末（dawn）：絵の上に透けた板を置かず、紙を一枚敷く */
  .overlay.dawn { background: linear-gradient(180deg, rgba(244, 237, 221, .96), rgba(231, 220, 198, .96)); }
  .dawn .ov-card { background: var(--panel); border-color: var(--line); color: var(--ink); }
  .dawn .ov-card p { color: var(--ink); }
  .dawn .ov-card .recall-text p { color: #4a3f36; }
  .dawn .eyebrow { color: var(--akane); }
  .dawn .note { color: var(--muted); border-color: var(--line); }
  .dawn .btn { background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); }
  .dawn .btn.primary { background: none; border-bottom: 2px solid var(--blue); color: var(--blue); }

  /* ===== エンドロール（NORMAL以上の結末で、結末の名前を出す前に流す） ===== */
  .endroll { position: fixed; inset: 0; z-index: 40; background: #0b0a10; color: #e9e2d6; overflow: hidden; animation: rollfade 1.6s ease both; }
  .endroll.out { opacity: 0; transition: opacity 1.4s ease; }
  @keyframes rollfade { from { opacity: 0; } to { opacity: 1; } }
  .roll-bg { position: absolute; inset: 0; }
  .roll-bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2.6s ease; filter: brightness(.5) saturate(.85); }
  .roll-bg img.on { opacity: 1; animation: rollzoom 14s ease-out both; }
  @keyframes rollzoom { from { transform: scale(1); } to { transform: scale(1.06); } }
  .roll-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 10, 16, .88) 0%, rgba(11, 10, 16, .42) 28%, rgba(11, 10, 16, .42) 72%, rgba(11, 10, 16, .92) 100%); }
  .roll-wrap { position: absolute; inset: 0; overflow: hidden; }
  .roll-in { position: absolute; left: 0; right: 0; top: 100%; text-align: center; font-family: var(--serif); letter-spacing: .12em; line-height: 2; padding: 0 16px; text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
  .roll-in.go { animation: rollup var(--roll-d, 70s) linear both; }
  @keyframes rollup { from { transform: translateY(0); } to { transform: translateY(calc(-100% - 100vh)); } }
  .roll-in section { margin: 38px 0; }
  .roll-in h3 { font-size: 12.5px; font-weight: 400; letter-spacing: .32em; color: #b9ad99; margin: 0 0 6px; }
  .roll-in p { margin: 0; font-size: 17px; }
  .roll-in .sub { font-size: 12.5px; color: #b9ad99; letter-spacing: .2em; }
  .roll-title { font-size: 30px; letter-spacing: .22em; margin: 0 0 56px; }
  .roll-title.end { margin: 110px 0 0; }
  .roll-thanks { margin: 70px 0 0; font-size: 15.5px; color: #d6ccba; }
  .roll-in .roll-care { margin: 90px auto 0; max-width: 34em; font-size: 12px; line-height: 2; letter-spacing: .06em; color: #a89f8f; }
  .roll-in .roll-care.last { margin-top: 26px; font-size: 13px; color: #c9bfae; }
  .roll-in .ph { display: inline-block; }
  .roll-ff { position: absolute; right: 118px; bottom: 18px; background: none; border: 0; border-bottom: 1px solid #8f887c; color: #b9ad99; font: inherit; font-size: 13px; letter-spacing: .2em; padding: 6px 4px; cursor: pointer; animation: rise .8s ease both; }
  .roll-ff[aria-pressed="true"] { color: #e9e2d6; border-bottom-color: #e9e2d6; }
  .roll-skip { position: absolute; right: 18px; bottom: 18px; background: none; border: 0; border-bottom: 1px solid #8f887c; color: #b9ad99; font: inherit; font-size: 13px; letter-spacing: .2em; padding: 6px 4px; cursor: pointer; animation: rise .8s ease both; }
  /* 結末の名前：板に小さく出すのをやめ、白い紙の真ん中に、題名のように */
  .overlay.endcard .ov-card { background: none; border: 0; box-shadow: none; text-align: center; max-width: 640px; gap: 18px; }
  .endcard .end-ttl { padding: 14px 0 22px; border-bottom: 1px solid rgba(42, 36, 32, .3); margin-bottom: 4px; }
  .endcard .end-kind { font-family: var(--serif); font-size: 13px; letter-spacing: .5em; color: var(--akane); margin: 0 0 16px; animation: rise 1.2s ease both; }
  .endcard .end-name { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 6vw, 46px); letter-spacing: .18em; line-height: 1.4; margin: 0; color: var(--ink); animation: nameIn 2.4s cubic-bezier(.2, .7, .2, 1) both .5s; }
  @keyframes nameIn { from { opacity: 0; filter: blur(10px); letter-spacing: .6em; } to { opacity: 1; filter: blur(0); letter-spacing: .18em; } }
  .endcard .note, .endcard .ach-note, .endcard .ach-x-note { animation: rise 1s ease both 2.4s; }
  .endcard .row { justify-content: center; animation: rise 1s ease both 3.2s; }
  @media (prefers-reduced-motion: reduce) { .endcard .end-name, .endcard .end-kind, .endcard .note, .endcard .row, .roll-bg img.on { animation: none; } }
  /* BAD END の画面：結末の名前を題名のように大きく。本文はふつう、やり直し方の案内・ボタンは控えめに（2026-11-11 作者の指摘：全部同じ大きさで、ボタンに目が行く） */
  .badcard .bad-head { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .badcard .bad-kind { font-size: .78em; letter-spacing: .4em; color: var(--akane); margin: 0 0 6px; }
  .badcard .bad-name { font-family: var(--serif); font-weight: 600; font-size: 1.9em; letter-spacing: .14em; line-height: 1.4; margin: 0; padding: 0; border: 0; color: var(--ink); }
  .badcard .note { font-size: .95em; }
  .badcard .note.bad-howto, .badcard .ach-note { font-size: .82em; }
  .badcard .note.bad-care { font-size: .8em; opacity: .85; }   /* 相談先は一言だけ、目立たせない */
  .badcard .row .btn { font-size: .88em; padding: 7px 12px; }
  .kb.locked { pointer-events: none; }
  .kb.locked .wk, .kb.locked .bk { cursor: default; }
  .name-in { font: inherit; font-family: var(--hand); font-size: 20px; letter-spacing: .1em; width: 100%; box-sizing: border-box; padding: 10px 6px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); outline: 0; }
  .name-in:focus { border-bottom: 2px solid var(--blue); padding-bottom: 9px; }
  /* スマホの画面：暗い画面をやめ、明るい画面に（紙の地で読めるように） */
  .phone { background: #f4f3ef; border: 1px solid #c9c2b4; color: #222; }
  .phone-head { color: #7a7368; border-bottom-color: #ddd6c8; }
  .phone-bar { background: rgba(0, 0, 0, .08); }
  .phone-thumb { background: rgba(0, 0, 0, .28); }
  .bub.them p { background: #fff; color: #222; border: 1px solid #e3ddd0; }
  .bub.me p { background: #7cc47f; color: #10301a; }
  .bub span { color: #8a8378; }
  /* タイトルを出している間は、裏のゲーム画面（上の欄など）を隠す。スマホで引っぱったときに裏が見えないように */
  html { overscroll-behavior: none; }
  body:has(.overlay.title-screen:not([hidden])) #app { visibility: hidden; }
  /* 屋上の演出の層は、紙目の層（z 50）より前に。慰め・正論の言葉の層は地を濃くして、紙の色と混ざらないように */
  .roof-fx { z-index: 60; }
  .roof-fx.late { background: rgba(0, 0, 0, .84); }
  .lw { color: #e8e1d5; font-size: 15px; }
  .lw.sei { color: #a9bccf; }
  .lw.neg { color: #d9605f; }
  .lw.nag { color: #ece4d6; }
  /* タイトルの雨の差分：屋上で雨が降っている途中で中断したとき。絵を暗く青く沈めて、斜めの雨の筋を流す */
  .title-screen.rainy::after { content: ""; position: fixed; inset: -30% 0 0 0; pointer-events: none; z-index: 0; opacity: .28;
    background-image: repeating-linear-gradient(104deg, transparent 0 16px, rgba(220, 230, 245, .35) 16px 17px, transparent 17px 34px),
                      repeating-linear-gradient(102deg, transparent 0 11px, rgba(200, 215, 235, .22) 11px 12px, transparent 12px 27px);
    background-size: 100% 80px, 100% 52px; animation: titleRain .55s linear infinite; }
  @keyframes titleRain { to { background-position: -22px 80px, -14px 52px; } }
  .title-screen.rainy .ov-card, .title-screen.rainy .vtitle, .title-screen.rainy .tap-hint { position: relative; z-index: 1; }
  .title-screen.rainy:not(.menu) .vtitle { position: fixed; }
  @media (prefers-reduced-motion: reduce) { .title-screen.rainy::after { animation: none; } }
  /* 雨のタイトルでメニューを開いたら、暗さと雨の筋は絵の側（右）だけに。紙の側は読めるように */
  .title-screen.rainy.menu::after { -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 38%, #000 72%); mask-image: linear-gradient(90deg, transparent 0%, transparent 38%, #000 72%); }
  /* タイトルのメニュー：絵の上でも読めるよう、メニューの列の後ろに紙を一枚敷く（夕方の暗い絵・スマホの幅でも） */
  .title-screen.menu .title-side { background: rgba(246, 240, 226, .94); padding: 16px 18px; box-shadow: 2px 4px 0 rgba(60, 45, 30, .18); border: 1px solid rgba(195, 178, 150, .6); }
  .title-screen.menu .title-side .note, .title-screen.menu .title-side .btn .sub { color: #5e5246; }
  .another-text { display: flex; flex-direction: column; gap: 10px; line-height: 1.95; }
  .another-text p { margin: 0; }
  /* 放課後を思い返す：章の一覧 */
  .recall-list { display: flex; flex-direction: column; gap: 2px; }
  .recall-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .recall-row:hover { color: var(--blue); border-bottom-color: var(--blue); }
  .recall-row.off { color: var(--muted); cursor: default; }
  .recall-row .rc-res { font-size: 13px; color: var(--muted); }
  .slot .not-yet { display: block; font-size: 11px; color: var(--akane); margin-top: 2px; }
  /* 読んでいる間、枠の大きさを変えない（絵のあるページも、文の長さが違うページも同じ大きさ。長いときは文だけ動かせる） */
  .overlay.another-read .ov-card { max-width: 640px; height: min(88vh, 780px); }
  .overlay.another-read .ov-card > * { flex-shrink: 0; }
  .overlay.another-read .another-text { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .overlay.another-read .cg { max-height: 30vh; object-fit: cover; }

  /* ---------- 後日談の追加分 ---------- */
  .scene { max-width: calc(58vh * 1.5); }
  #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
  .scene .bg { transition: opacity .7s ease, filter .5s ease; }
  /* ソウタ：左寄り。立っている絵は本編と同じ（高さ97%・下端ぞろえ）、座っている絵は画面の高さの25%下げる */
  /* 動きは入れない。出るとき・消えるときにフェードするだけ（ポーズの切り替えはその場で入れ替える） */
  .sota-fig { position: absolute; left: 4%; bottom: 0; height: 97%; aspect-ratio: 2 / 3; opacity: 0;
              transition: opacity .4s ease; pointer-events: none; z-index: 2; }
  .sota-fig.show { opacity: 1; }
  .sota-fig.seated {   /* 2026-11-23：本編の座り絵の .sit（会話中に暗くする指定）とぶつかるので名前を分けた */
    bottom: -25%; }

<script>
(() => {

  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 設定（文字の速さ・BGMの音量）だけを覚えておく。本編のセーブとは別
  const PKEY = 'houkago-aftertale-sota-v1';
  let P = {}; try { P = JSON.parse(localStorage.getItem(PKEY) || '{}'); } catch (e) {}
  P.heard = P.heard || {};
  const saveP = () => { try { localStorage.setItem(PKEY, JSON.stringify({ textSpeed: P.textSpeed, bgmVol: P.bgmVol })); } catch (e) {} };
  const replay = null;
  let R = null;

  /* ---------- sound ---------- */
  let actx = null;
  const PIANO_VOL = 0.65;  // チャイムと聞こえ方をそろえる
  // 音量（0〜1）。音のオン・オフの代わりにバーで調整する
  P.sound = true;
  if (P.bgmVol === undefined) P.bgmVol = 0.7;
  if (P.seVol === undefined) P.seVol = 0.8;
  // 効果音（チャイム・ピアノ・足音など）はBGMより大きく聞こえるので、全体を0.6倍に抑える（バーの位置はそのまま）
  const SE_TRIM = 0.6;
  const seMul = () => P.seVol / 0.8 * SE_TRIM;
  // 音を作る前から、スマホの消音スイッチ（マナーモード）に従う設定にしておく
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
  const audio = () => {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    if (actx.state !== 'running') { try { actx.resume(); } catch (e) {} }
    return actx;
  };
  // 音の出口：全体を持ち上げ、割れないように圧縮してから鳴らす
  let master = null;
  const MASTER_GAIN = 1.9;
  function out() {
    const a = audio();
    if (!master) {
      const comp = a.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
      master = a.createGain(); master.gain.value = MASTER_GAIN;
      master.connect(comp); comp.connect(a.destination);
    }
    return master;
  }
  // スマホは「タップを離した瞬間」などでないと音を出せないので、最初の操作で音の準備をしておく
  let audioReady = false;
  function unlockAudio() {
    if (!P.sound) return;
    // スマホの消音スイッチ（マナーモード）に従う。'ambient' はマナーモード中は鳴らず、他のアプリの音楽も止めない
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
    try {
      const a = audio();
      if (!audioReady) {
        const b = a.createBuffer(1, 1, 22050), src = a.createBufferSource();
        src.buffer = b; src.connect(a.destination); src.start(0);
        audioReady = true;
      }
    } catch (e) {}
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
  // 鍵盤を開いている間、無音を流して音の出口を起こしておく（最初の音が遅れないように）
  function keepAudioAwake() {
    if (!P.sound) return () => {};
    try {
      const a = audio(), o = a.createOscillator(), g = a.createGain();
      g.gain.value = 0.00001; o.connect(g).connect(a.destination); o.start();
      return () => { try { o.stop(); } catch (e) {} };
    } catch (e) { return () => {}; }
  }
  function bell() {
    if (!P.sound || replay) return;
    try {
      const a = audio();
      // 学校のチャイム（1オクターブ上げて、スマホでも聞こえるように倍音を足す）
      const notes = [329.63, 261.63, 293.66, 196.0, 196.0, 293.66, 329.63, 261.63].map(f => f * 2);
      notes.forEach((f, i) => {
        const t = a.currentTime + i * 0.55;
        [[1, 0.3 * seMul()], [2, 0.12 * seMul()], [3, 0.05 * seMul()]].forEach(([m, v]) => {
          const o = a.createOscillator(), g = a.createGain();
          o.type = 'sine'; o.frequency.value = f * m;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.4 / Math.sqrt(m));
          o.connect(g).connect(out()); o.start(t); o.stop(t + 1.5);
        });
      });
    } catch (e) {}
  }
  // ピアノらしい減衰音
  function pianoNote(freq, gain = 0.2, delay = 0) {
    if (!P.sound) return;
    try {
      const a = audio(), t = a.currentTime + delay;
      gain *= PIANO_VOL * seMul();
      if (gain <= 0) return;
      [[1, 'triangle', 1], [2, 'sine', 0.5], [3, 'sine', 0.18], [4, 'sine', 0.08]].forEach(([m, type, v]) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.value = freq * m;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain * v, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 1.8 / Math.sqrt(m));
        o.connect(g).connect(out()); o.start(t); o.stop(t + 1.9);
      });
    } catch (e) {}
  }
  /* ---------- BGM：その場で音を組み立てて鳴らす ---------- */
  let bgmName = null, bgmGain = null, bgmTimer = null, bgmNext = 0, bgmStep = 0;
  let bgmPaused = false;  // 別のアプリに切り替えて、曲を止めている間 true
  const bgmLevel = () => 0.8 * P.bgmVol;
  const nf = n => 440 * Math.pow(2, (n - 69) / 12);  // MIDI番号→周波数
  // 1音：立ち上がり attack、持続、release で消える。lp＝こもらせる周波数、vib＝ビブラート
  // 雑音（息・弦の擦れ・鍵の音に使う）
  let noiseBuf = null;
  function getNoise() {
    const a = audio();
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return noiseBuf;
  }
  // 長い雑音（約7秒）：1秒の雑音をくり返すと、帯域を絞った音で規則的に何かを打つように聞こえるので、雨にはこちらを使う
  let longNoiseBuf = null;
  function getLongNoise() {
    const a = audio();
    if (!longNoiseBuf) { longNoiseBuf = a.createBuffer(1, Math.round(a.sampleRate * 7.3), a.sampleRate); const d = longNoiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return longNoiseBuf;
  }
  // 残響：BGMだけを、広い教室で鳴っているように響かせる
  let revIn = null, revOut = null, revBuf = null;
  function reverb() {
    const a = audio();
    if (!revIn) {
      if (!revBuf || revBuf.sampleRate !== a.sampleRate) {
        const len = Math.floor(a.sampleRate * 2.6); revBuf = a.createBuffer(2, len, a.sampleRate);
        for (let c = 0; c < 2; c++) { const d = revBuf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
      }
      const cv = a.createConvolver(); cv.buffer = revBuf;
      const wet = a.createGain(); wet.gain.value = 0.42;
      revIn = a.createGain(); revIn.connect(cv); cv.connect(wet); wet.connect(out()); revOut = wet;
    }
    return revIn;
  }
  // 1音：立ち上がり attack、持続、release で消える。lp＝こもらせる周波数、vib＝ビブラート（vibDelay 秒かけて深くなる）、det＝重ねる音のずれ（セント）
  function voice(freq, t, dur, vol, { type = 'sine', attack = 0.02, release = null, lp = 0, q = 0.5, vib = 0, vibRate = 5, vibDelay = 0, det = null, glide = 0 } = {}) {
    if (vol <= 0 || !bgmGain) return;
    const a = audio(), g = a.createGain();
    let dest = g;
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; f.Q.value = q; f.connect(g); dest = f; }
    const oscs = (det || [0]).map(d => { const o = a.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = d; o.connect(dest); return o; });
    // glide：半音 glide 個ぶん下からずり上がって目的の音に入る（弦楽器の、すすり泣くようなポルタメント）
    if (glide) oscs.forEach(o => { o.frequency.setValueAtTime(freq * Math.pow(2, -glide / 12), t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.16); });
    if (vib) {
      const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = vibRate;
      lg.gain.setValueAtTime(vibDelay ? 0 : freq * vib, t); if (vibDelay) lg.gain.linearRampToValueAtTime(freq * vib, t + vibDelay);
      l.connect(lg); oscs.forEach(o => lg.connect(o.frequency)); l.start(t); l.stop(t + dur + 0.1);
    }
    const v = vol / Math.sqrt(oscs.length);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + attack);
    if (release) { g.gain.linearRampToValueAtTime(v * 0.85, Math.max(t + attack + 0.01, t + dur - release)); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
    else g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    g.connect(bgmGain); oscs.forEach(o => { o.start(t); o.stop(t + dur + 0.05); });
  }
  // 息の音（管楽器の吹き始め）
  function breath(t, dur, vol, center) {
    if (vol <= 0 || !bgmGain) return;
    const a = audio(), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = getNoise(); s.loop = true; f.type = 'bandpass'; f.frequency.value = Math.min(center, 9000); f.Q.value = 1.4;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.04); g.gain.linearRampToValueAtTime(vol * 0.2, t + 0.22); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(bgmGain); s.start(t); s.stop(t + dur + 0.05);
  }
  const tone = (freq, t, dur, vol, type = 'sine', attack = 0.02) => voice(freq, t, dur, vol, { type, attack });
  const pad = (notes, t, dur, vol) => notes.forEach(n => { tone(nf(n), t, dur, vol, 'sine', dur * 0.3); tone(nf(n) * 1.003, t, dur, vol * 0.5, 'triangle', dur * 0.3); });
  const pluck = (n, t, vol, dur = 2.4) => { tone(nf(n), t, dur, vol, 'triangle', 0.01); tone(nf(n) * 2, t, dur * 0.6, vol * 0.35, 'sine', 0.01); };
  // 楽器
  // 弦楽器：少しずつずらした3本の弦を重ね、弓で弾くように立ち上げ、後からビブラートをかける
  const bowed = (n, t, dur, vol, lp, vibRate) => {
    const at = Math.min(0.35, dur * 0.3), rl = Math.min(0.7, dur * 0.4);
    voice(nf(n), t, dur, vol, { type: 'sawtooth', attack: at, release: rl, lp, det: [-7, 0, 6], vib: 0.0045, vibRate, vibDelay: 0.35 });
    voice(nf(n), t, dur, vol * 0.35, { type: 'triangle', attack: at, release: rl });
  };
  const violin = (n, t, dur, vol) => bowed(n, t, dur, vol, 2600, 5.8);
  const viola = (n, t, dur, vol) => bowed(n, t, dur, vol, 1600, 5.4);
  const cello = (n, t, dur, vol) => bowed(n, t, dur, vol, 1000, 5);
  const contrabass = (n, t, dur, vol) => bowed(n, t, dur, vol, 480, 4.4);
  // 歌うチェロ（『胸の奥の声』の主旋律）：高い音ほど明るく鳴らし、深いビブラートと、弓をふくらませる長い立ち上がり。
  // cry＝下からすべりこむポルタメント（泣く・叫ぶ）。C2 から C6 まで、チェロの全音域で使う
  const celloSing = (n, t, dur, vol, cry = 0) => {
    const at = Math.min(0.55, dur * 0.4), rl = Math.min(0.8, dur * 0.4), lp = Math.min(4200, nf(n) * 7 + 500);
    const v = vol * (n >= 72 ? 0.8 : 1);
    voice(nf(n), t, dur, v, { type: 'sawtooth', attack: at, release: rl, lp, q: 0.8, det: [-6, 0, 5], vib: n >= 69 ? 0.0075 : 0.006, vibRate: 5.3, vibDelay: 0.22, glide: cry });
    voice(nf(n), t, dur, v * 0.4, { type: 'triangle', attack: at, release: rl, glide: cry });
    if (cry) air(t, Math.min(dur, 0.6), v * 0.25, nf(n) * 3);
  };
  // 扉を叩く音：分厚い木の扉を、こぶしで「ドン」。低く重い胴鳴りと、扉板のこもった響き（スマホでも聞こえる高さを少し混ぜる）
  // se=false：曲の一部（閉ざされた扉の曲）として、曲の出力で鳴らす
  // se=true：効果音として、曲とは別の出力で鳴らす（曲が止まっていても鳴る。音量は効果音の設定に従い、初期設定では前と同じ大きさ）
  function knock(t, vol, se = false) {
    const a = audio();
    let dst = bgmGain;
    if (se) { dst = a.createGain(); dst.gain.value = 0.7 * P.seVol; dst.connect(out()); dst.connect(reverb()); setTimeout(() => { try { dst.disconnect(); } catch (e) {} }, 4000); }
    if (!dst) return;
    [[62, 0.45, 'sine', 1], [96, 0.38, 'sine', 0.8], [140, 0.25, 'triangle', 0.45]].forEach(([f, d, type, k]) => {
      const o = a.createOscillator(), g = a.createGain(); o.type = type;
      o.frequency.setValueAtTime(f * 1.25, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04); o.frequency.exponentialRampToValueAtTime(f * 0.8, t + d);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * k, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0005, t + d);
      o.connect(g).connect(dst); o.start(t); o.stop(t + d + 0.02);
    });
    [[230, 1.1, 1.6, 0.18], [520, 1.6, 0.7, 0.07]].forEach(([fc, qv, k, d]) => {
      const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
      s.buffer = getNoise(); fl.type = 'bandpass'; fl.frequency.value = fc; fl.Q.value = qv;
      g.gain.setValueAtTime(vol * k, t); g.gain.exponentialRampToValueAtTime(0.0005, t + d);
      s.connect(fl).connect(g).connect(dst); s.start(t); s.stop(t + d + 0.02);
    });
  }
  const flute = (n, t, dur, vol) => {
    voice(nf(n), t, dur, vol, { attack: 0.08, release: Math.min(0.35, dur * 0.4), vib: 0.006, vibRate: 5.2, vibDelay: 0.3 });
    voice(nf(n) * 2, t, dur, vol * 0.1, { type: 'triangle', attack: 0.08, release: Math.min(0.3, dur * 0.4), lp: 3200 });
    breath(t, Math.min(dur, 0.5), vol * 0.45, nf(n) * 2);
  };
  // アルトリコーダー：まっすぐで素朴な音。ビブラートはごく浅く
  const recorder = (n, t, dur, vol) => {
    voice(nf(n), t, dur, vol, { attack: 0.035, release: Math.min(0.25, dur * 0.3), vib: 0.0025, vibRate: 4.5, vibDelay: 0.5 });
    voice(nf(n) * 2, t, dur, vol * 0.06, { attack: 0.035, release: Math.min(0.25, dur * 0.3) });
    voice(nf(n) * 3, t, dur, vol * 0.035, { attack: 0.035, release: Math.min(0.25, dur * 0.3) });

  // ソウタを出す：show('tense') のように表情名、または show('bow') のように顔つきの絵（お辞儀・正座）
  const AFTER_GLINT = new Set(['f4', 'f5', 'f8', 's_seiza_up']);   // 涙の光の絵がある顔パーツ・絵（11/14 Q302 で作った）
  function show(name) {
    const f = FACE[name], pose = f ? f[0] : name, face = f ? f[1] : null;
    const p = POSE[pose];
    figBase.src = `img/${p.img}.webp`;
    figFace.hidden = !face; if (face) figFace.src = `img/${face}.webp`;
    // 涙のきらめき（スマホのみ。本編と同じ）：涙のある顔・絵には、涙の形の光の絵（img/<名前>_glint.webp）を重ねてときどき光らせる
    const gn = [face, p.img].find(n => n && AFTER_GLINT.has(n)), gl = $('#sotaGlint');
    if (gn) { const u = `img/${gn}_glint.webp`; if (gl.getAttribute('src') !== u) gl.src = u; }
    gl.classList.toggle('show', !!gn);
    fig.classList.toggle('seated', p.sit);
    fig.classList.remove('out'); fig.classList.add('show');
    cur = { pose, face };
  }
  const S = name => () => show(name);
  // 床に頭をつける：立ち絵をフェードで消す（画面の外へ出たことにする）
  const frameOut = () => () => new Promise(r => { fig.classList.add('out'); setTimeout(r, reduce ? 0 : 600); });
  const hide = () => () => { fig.classList.remove('show'); cur = null; };
  const music = (n, f) => () => bgm(n, f);
  const bgSet = (src, fade = true) => () => new Promise(r => {
    const im = $('#bgImg');
    if (!fade || reduce) { im.src = `img/${src}.webp`; setSceneLabel(src); r(); return; }
    im.style.opacity = 0;
    setTimeout(() => { im.src = `img/${src}.webp`; setSceneLabel(src); im.decode().catch(() => {}).then(() => { im.style.opacity = 1; setTimeout(r, 700); }); }, 700);
  });
  const SCENE_LABEL = { sota_living_night: 'ソウタの家のリビング（夜）', sota_hall_night: 'ソウタの部屋の前の廊下（深夜）' };
  const setSceneLabel = src => { const l = SCENE_LABEL[src]; if (l) $('#scene').setAttribute('aria-label', l); };
  const pause = ms => () => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  // 夜が更ける：場面・文章の欄・時計をゆっくり暗くし、暗いまま少し置いて時計を進め、次の場面をゆっくり明るくする（約7秒）
  const passTo = (src, time) => () => new Promise(r => {
    const im = $('#bgImg'), msg = $('#msg'), ck = $('#clock');
    if (reduce) { im.src = `img/${src}.webp`; ck.textContent = time; setSceneLabel(src); r(); return; }
    const els = [im, msg, ck];
    im.style.transition = 'opacity 2s ease'; msg.style.transition = ck.style.transition = 'opacity 1.4s ease';
    els.forEach(el => el.style.opacity = 0);
    setTimeout(() => {
      im.src = `img/${src}.webp`; ck.textContent = time; setSceneLabel(src);
      setTimeout(() => {
        ck.style.opacity = 1;
        im.decode().catch(() => {}).then(() => {
          im.style.opacity = 1;
          setTimeout(() => {
            msg.style.opacity = 1;
            setTimeout(() => { els.forEach(el => el.style.transition = ''); msg.style.opacity = ck.style.opacity = ''; r(); }, 1400);
          }, 2000);
        });
      }, 1600);
    }, 2000);
  });

  // 廊下の場面：『ほどけたとき』のオルゴール版。同じ和音と旋律を、オルゴールだけで少しゆっくり。
  // 旋律は1オクターブ上で最初から鳴らし、伴奏は和音を8分で分散させる。2周目は旋律に3度下の音をそっと重ねる
  BGM.unravelBox = (t, i) => {
    const bar = i % 8, cyc = (i >> 3) % 2, q = 0.95, e = q / 2, d = q * 4;
    const ch = [[48, 55, 64], [45, 52, 60], [41, 48, 57], [43, 50, 59], [40, 48, 55], [41, 48, 57], [43, 50, 59], [48, 55, 64]][bar];
    orgel(ch[0], t, 0.02, 4.2);
    [0, 1, 2, 1, 0, 1, 2, 1].forEach((k, j) => orgel(ch[k] + 12, t + j * e, 0.016, 2.6));
    const mel = [[[76, 2], [79, 1], [76, 1]], [[76, 1], [72, 1], [69, 2]], [[72, 1], [76, 1], [77, 2]], [[74, 3], [71, 1]],
                 [[72, 2], [76, 1], [79, 1]], [[81, 2], [79, 1], [77, 1]], [[76, 1], [74, 1], [71, 1], [74, 1]], [[72, 4]]][bar];
    seq(mel, t, q, (n, x) => orgel(n + 12, x, 0.045, 3.6));
    if (cyc) seq(mel, t, q, (n, x) => orgel(n + 8 + (n % 12 === 4 || n % 12 === 9 || n % 12 === 11 ? 1 : 0), x + 0.02, 0.016, 3));
    return d;
  };

  const SO = 'ソウタ', FA = 'ソウタの父', MO = 'ソウタの母';
  const STORY = [
    music('tension', 2),
    '終業式を終えた日の夜。ソウタは落ち着かない様子でリビングに座っていた。',
    'しばらくして、父の足音が聞こえた。ソウタの手に汗がにじんだ。',
    '父が一息ついたところで、声をかけた。',
    S('plead'),
    [SO, '父さん。……話したいことがあるんだ'],
    S('bow'),
    '父が振り向くと、ソウタはすぐに頭を下げた。',
    [SO, 'お願いします。俺に、ピアノを続けさせてください'],
    '家の中が静まり返った。',
    '皿洗いをしていた母も、思わず手を止めていた。',
    '父は長く息を吐いた。……だが、それ以上は何も言わなかった。',
    S('plead'),
    [SO, '勉強は、もちろん優先します。両立すると約束します'],
    [FA, '……本当だろうな？'],
    'その声は低く、重みがあった。ソウタの背筋にビリビリした感覚が走った。',
    [SO, '次の定期テスト、必ず結果を出します。そのためなら、次のテスト期間が終わるまでピアノが弾けなくても構いません'],
    '父は少しも動かなかった。こんな状況でなければ、地蔵か何かと見間違えてしまうほどに。',
    'ーーその視線が、ソウタを突き刺している点を除けば。',
    S('down'),
    'ソウタの膝が震えだした。',
    [SO, '(けどここで退いたら、二度とピアノが弾けなくなる……そんな気がする)', 'think'],
    'ソウタはふと、昨日の音楽室での出来事を思い出した。言葉を選びながら、慎重に口を開いた。',
    music('core', 2.2),
    S('tense'),
    [SO, 'ハルを失って、このままピアノも失うんだって自棄になって……それでようやく分かったんだ。俺にとって、あいつやピアノがどんな存在だったか'],
    [SO, '物心ついた頃から、ずっと傍にあるのが当たり前だった。これからも、それが一生続くと思ってた'],
    'ソウタの声が震えだした。……父の眉が微かに動いたのを、母だけが見ていた。',
    S('tremble'),
    [SO, 'でも、間違ってたんだ。初めから、当たり前なんて何一つなかった。ピアノにも、ハルにも……出会えたこと自体、奇跡だったんだって'],
    [SO, '俺にとっては……全てだったんだ。あいつが、ピアノが、俺を知らない世界に連れて来てくれた。これからだって、どこまでも……っ'],
    'ソウタは何かを堪えるように奥歯を噛み締めた。両手を強く握り締め、指先が真っ白になっていた。',
    [SO, '(昨日、ハルのパートを弾いてくれた……あいつのおかげで、俺は本当の気持ちに気づけた。だからこそ、今度は手放さない)', 'think'],
    [SO, '父さん……。俺は、ピアノを続けたい。俺自身のためにも、ハルのことを忘れないためにも'],
    // 「どうか」まで出たところ（「……」に入るとき）で、ソウタがフェードで消える
    [SO, 'どうか……この通りです。お願いします', '', { at: '……', fn: () => fig.classList.add('out') }],
    music(null),
    '今度は深々と、床に頭をつけた。ソウタの口から、抑えきれない声が漏れていた。',
    [MO, '……お父さん'],
    '母が静かに父の返事を促した。その目は、「もういいでしょう」と訴えているようだった。',
    [FA, '……お前の気持ちは分かった。顔を上げなさい'],
    S('crySit'), music('musicbox', 2),
    'ソウタがゆっくり頭を上げた。まっすぐ父を見つめるが、その顔はぐしゃぐしゃになっていた。',
    [FA, 'ピアノの解約は、取り下げるよう頼んでおく。確約はできないが'],
    [FA, '次の定期テストまでピアノを控えるなんてことも、しなくていい。ピアノ教室も、学校で弾くのも、お前の自由だ'],
    [SO, '……父さん……'],
    [FA, 'ただし'],
    [SO, '……っ'],
    [FA, '次の定期テストまでの話だ。そこでまた赤点を取ったら、今度こそピアノを返却する。受験が終わるまで、学校で弾くのも禁止だ'],
    [FA, '……次は、取り消さないからな'],
    'そう言い残し、父は寝室に向かっていった。',
    [SO, '父さん……ありがとう'],
    'リビングのドアが閉まる。',
    S('relief'),
    'ソウタは全身の力が抜けたようにへたり込んだ。',
    '母はそんなソウタを見つめ、それからドアの向こうを見やった。',
    [MO, '……お父さん、口ではああ言ってるけど、自分から電話してたのよ？ピアノの返却を取消できないかって'],
    S('surprise'),
    [SO, '……え？'],
    '母は肩を竦めた。',
    music('unravel', 2.5),
    [MO, 'お父さんに一昨日『最近ソウタの顔色が悪い』って話したの。そうしたら、『実はさっきレンタル業者に連絡したところだ。手続きのシステムがややこしくて、まだ交渉が必要だが』……って'],
    [MO, 'ピアノを解約するって言ったのは、そろそろ勉強に本腰入れてほしかったからよ。ソウタにとって大事な時期を、無駄にしてほしくなかったの'],
    [MO, '……お母さんの言葉じゃ信じられないなら、今度お父さんの口から聞いてみたらいいわ'],
    [SO, '……それ、は'],
    S('seiza'),
    'ソウタは何か言いかけたが、口ごもるように俯いた。',
    [MO, '……ほんと、親子そっくりで困っちゃうわ。そんなところも愛おしいのだけれど'],
    '母は眉尻を下げて微笑んだ。いつの間にか、目も赤くなっていた。',
    S('crySit'),
    [SO, '……俺、は……っ'],
    hide(),
    'ソウタの口から、堰を切ったように本音がこぼれた。父のこと、ハルのこと、楽譜の裏のこと……次から次へと。',
    '母は何も言わずに抱きしめ、頷きながら耳を傾けていた。',
    () => { $('#clock').textContent = '23:00'; },
    'そうして、およそ1時間後。ようやく気持ちが落ち着いたのか、ソウタの話が止まった。',
    [MO, '今日はもう遅いから、明日にしましょう。……もし眠れなくても、身体だけでも休めておいた方がいいわ'],
    hide(), music('unravelBox', 3), passTo('sota_hall_night', '0:00'),
    'その晩、息子の様子を見にきた母は、部屋のドア越しに微かに寝息を聞いた。',
    [MO, 'やっとお父さんと話ができて、身体の力が抜けたのかしら。……少しでも、眠れていそうで良かったわ'],
    '母はもう一度ドアの向こうに耳を澄ませてから、静かにその場を離れた。窓の外はまだ暗いままだ。',
  ];

  /* ---------- 文章の表示（本編の message engine と同じ見せ方：名前・「」・文字送り・▼） ---------- */
  const spk = $('#speaker'), txt = $('#text'), more = $('#more');
  let advance = null;
  const SPEEDS = [['instant', '一括', 0], ['fast', '早い', 16], ['normal', '普通', 32], ['slow', '遅い', 55]];
  if (!SPEEDS.some(([k]) => k === P.textSpeed)) P.textSpeed = 'normal';
  const charMs = () => (SPEEDS.find(([k]) => k === P.textSpeed) || SPEEDS[2])[2];
  const LOG = [];
  function line(l) {
    return new Promise(res => {
      const [who, t, kind, cue] = Array.isArray(l) ? l : ['', l];
      spk.textContent = who; spk.hidden = !who;
      txt.classList.toggle('narr', !who);
      // 話している間は背景を少し暗くする（本編と同じ）。心の声（ソウタの括弧書き）は「」を付けない
      $('#scene').classList.toggle('talk', !!who);
      const full = who && kind !== 'think' ? `「${t}」` : t;
      LOG.push({ who, t: full });
      more.hidden = true;
      // 台本の「ーー」は、ひと続きの長い線で見せる（文字送りでは1文字として進める）
      const parts = splitDash(full);
      // cue：文字送りが cue.at の文字に来たときに cue.fn() を呼ぶ（立ち絵を消すなど。一括表示・飛ばしたときは全文を出したときに呼ぶ）
      let cued = !cue; const cueAt = cue ? full.indexOf(cue.at) : -1;
      const fire = () => { if (!cued) { cued = true; cue.fn(); } };
      let i = 0, done = false, timer = null;
      const finish = () => { clearInterval(timer); txt.innerHTML = joinDash(parts, parts.length); done = true; more.hidden = false; fire(); };
      advance = () => { if (!done) { finish(); return; } advance = null; more.hidden = true; res(); };
      if (reduce || !charMs()) finish();
      else { txt.textContent = ''; timer = setInterval(() => { i++; txt.innerHTML = joinDash(parts, i); if (cue && i >= cueAt) fire(); if (i >= parts.length) finish(); }, charMs()); }
    });
  }
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const splitDash = t => t.split(/(ー{2,}|―{2,})/).flatMap((x, k) => k % 2 ? [{ dash: x.length }] : [...x]);
  const joinDash = (parts, n) => parts.slice(0, n).map(x => typeof x === 'string' ? esc(x) : `<span class="dash" style="width:${x.dash}em" aria-label="ー"></span>`).join('');
  async function say(lines) {
    for (const l of lines) { if (typeof l === 'function') await l(); else await line(l); }
  }
  // 文章送りは画面のどこを押しても進む（上のボタンと開いている画面は除く）
  document.addEventListener('click', e => {
    if (!advance || e.target.closest('.bar-actions, .ov')) return;
    e.preventDefault(); advance();
  }, true);
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && advance && !(document.activeElement && document.activeElement.closest('button'))) { e.preventDefault(); advance(); }
  });

  /* ---------- メニュー・ログ ---------- */
  const panel = $('#menuPanel'), openBtn = $('#btnOpenMenu');
  openBtn.onclick = e => { e.stopPropagation(); panel.hidden = !panel.hidden; openBtn.setAttribute('aria-expanded', String(!panel.hidden)); };
  document.addEventListener('click', e => { if (!panel.hidden && !e.target.closest('.menu-wrap')) { panel.hidden = true; openBtn.setAttribute('aria-expanded', 'false'); } });
  const seg = $('#spdMenu');
  seg.innerHTML = SPEEDS.map(([k, label]) => `<button type="button" data-sp="${k}" aria-pressed="${P.textSpeed === k}">${label}</button>`).join('');
  seg.onclick = e => { const b = e.target.closest('[data-sp]'); if (!b) return; P.textSpeed = b.dataset.sp; saveP(); seg.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); };
  const vol = $('#volBgm'); vol.value = Math.round(P.bgmVol * 100);
  vol.oninput = () => { P.bgmVol = vol.value / 100; saveP(); if (bgmGain && actx) bgmGain.gain.setTargetAtTime(bgmLevel(), actx.currentTime, 0.1); };
  $('#btnRestart').onclick = () => { location.reload(); };
  const ov = $('#ov');
  $('#btnLog').onclick = e => {
    e.stopPropagation();
    $('#ovBody').innerHTML = LOG.map(x => `<p class="log-line">${x.who ? `<b>${x.who}</b>` : ''}${joinDash(splitDash(x.t), 1e9)}</p>`).join('') || '<p>まだ何もない。</p>';
    ov.hidden = false; $('#ovBody').scrollTop = 1e9;
  };
  $('#ovClose').onclick = e => { e.stopPropagation(); ov.hidden = true; };

  /* 2026-11-23：通信が不安定で絵の読み込みに失敗したときは、少し待って取り寄せ直す（最大3回）。初回アクセスで立ち絵が出ない不具合への対策 */
  document.addEventListener('error', e => {
    const im = e.target; if (!(im instanceof HTMLImageElement)) return;
    const src = im.getAttribute('src'); if (!src) return;
    const n = +(im.dataset.retry || 0); if (n >= 3) return;
    im.dataset.retry = n + 1;
    setTimeout(() => { if (im.getAttribute('src') === src) im.src = src.split('?')[0] + '?r=' + (n + 1); }, 800 * (n + 1));
  }, true);
  document.addEventListener('load', e => { const im = e.target; if (im instanceof HTMLImageElement) delete im.dataset.retry; }, true);
  /* ---------- はじめる ---------- */
  // スマホは、画面に触れた操作の中でないと音を鳴らせないので、最初のタップで始める
  const startCard = $('#start');
  // 画像を先に読み込んでおく（切り替えの瞬間に前の絵が残らないように）
  ['s_stand', 's_upright', 's_fists', 's_bow', 's_slump', 's_seiza', 's_seiza_up', 'f1', 'f2', 'f3', 'f4', 'f5', 'f6', 'f7', 'f8', 's_seiza_up_blank', 'sota_hall_night']
    .forEach(n => { const im = new Image(); im.src = `img/${n}.webp`; });
  startCard.onclick = async e => {
    e.stopPropagation();
    try { unlockAudio(); } catch (err) {}
    startCard.hidden = true;
    await say(STORY);
    // 終わり：最後の文を読んだあと、画面と文章をゆっくり暗くし、曲も長く消えていく。少し間をおいて「おわり」
    const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
    $('#scene').classList.remove('talk');
    $('#scene').classList.add('fin'); $('#msg').classList.add('fin'); $('#clock').classList.add('fin');
    try { if (bgmGain && actx) { const t0 = actx.currentTime; bgmGain.gain.cancelScheduledValues(t0); bgmGain.gain.setValueAtTime(bgmGain.gain.value, t0); bgmGain.gain.linearRampToValueAtTime(0, t0 + 6); } } catch (err) {}
    await wait(6500);
    bgm(null);
    spk.hidden = true; txt.classList.add('narr'); txt.textContent = '― おわり ―'; more.hidden = true;
    $('#msg').classList.remove('fin');
    await wait(1800);
    const end = $('#endCard'); end.hidden = false; void end.offsetWidth; end.classList.add('show');
  };
  $('#endAgain').onclick = e => { e.stopPropagation(); location.reload(); };

})();
</script>
