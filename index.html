<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放課後のわすれもの</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=Yomogi&family=Zen+Kurenaido&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
  [hidden] { display: none !important; }
  body { margin: 0; }
  :root {
    --ground: #15121c;
    --panel: #1f1a28;
    --panel2: #2a2334;
    --line: #3b3248;
    --ink: #ece6d6;
    --muted: #a69cb2;
    --akane: #e3875c;
    --gold: #d8b26a;
    --blue: #4f8ad8;
    --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--hand); font-size: 16px; }
  button { font: inherit; color: inherit; }
  button:focus-visible, .hs:focus-visible { outline: 2px solid var(--akane); outline-offset: 2px; }

  #app { height: 100%; max-width: 760px; margin: 0 auto; padding: 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .clock { display: flex; align-items: baseline; gap: 12px; }
  #clock { font-family: var(--serif); font-weight: 800; font-size: 22px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .bells { display: flex; gap: 5px; align-items: center; }
  .bells i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--akane); display: block; }
  .bells i.on { background: var(--akane); }
  .bells-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .bar-actions { display: flex; gap: 6px; margin-left: auto; justify-content: flex-end; }   /* 時計の下に折り返したときも右詰め */
  .bar-actions button { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .bar-actions button:hover { border-color: var(--akane); }
  .bar-actions button:disabled { opacity: .35; cursor: default; }
  .menu-wrap { position: relative; }
  .menu-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 170px; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .bar-actions .menu-panel button { text-align: left; border-color: transparent; padding: 8px 10px; }
  .bar-actions .menu-panel button:hover { border-color: var(--akane); }
  .menu-panel .vol { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; font-size: 13px; }
  .menu-panel .vol input { width: 110px; accent-color: var(--akane); }
  /* 文字の速さ：4つのボタンから1つを選ぶ */
  .speed { display: flex; flex-direction: column; gap: 5px; padding: 6px 10px; font-size: 13px; }
  .seg { display: flex; gap: 4px; }
  .seg button, .bar-actions .menu-panel .seg button { flex: 1; text-align: center; padding: 5px 6px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"], .bar-actions .menu-panel .seg button[aria-pressed="true"] { border-color: var(--akane); background: #3a2a2e; }
  .settings { display: flex; flex-direction: column; }
  .settings .set-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .settings .set-row:first-child { padding-top: 4px; }
  .settings .set-label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .settings .vol { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .settings .vol input { flex: 1; max-width: 240px; accent-color: var(--akane); }
  .title-redo { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(31, 26, 40, .6); }
  .title-redo .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .btn-sub { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; text-align: left; font-size: 13px; color: var(--ink); cursor: pointer; }
  .btn-sub:hover { border-color: var(--akane); }
  .btn-sub .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

  .scene-wrap { flex: 0 0 auto; min-height: 160px; display: flex; align-items: flex-start; justify-content: center; }
  .scene { position: relative; width: 100%; max-width: calc(58vh * 1.5); aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: #1c1620; }
  .scene img { position: absolute; display: block; max-width: none; }
  .stage { position: absolute; inset: 0; }
  .cutin { position: absolute; inset: 4%; z-index: 1; opacity: 0; transform: translateX(6%) rotate(.6deg); transition: opacity .35s ease, transform .35s ease; pointer-events: none; background: #1c1620; border: 3px solid #efe6d6; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); overflow: hidden; }
  .cutin.show { opacity: 1; transform: none; }
  .cutin img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
  .cutin .clock-hands { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene.cut .hs, .scene.story .hs { visibility: hidden; }
  .get-item { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(12, 9, 16, .55); opacity: 0; transition: opacity .25s ease; cursor: pointer; }
  .get-item.show { opacity: 1; }
  .get-in { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: scale(.85); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
  .get-item.show .get-in { transform: none; }
  .get-in img { position: static; max-width: 70%; height: auto; width: auto; max-height: min(30vh, calc((min(100vw, 760px) - 32px) / 3.4)); min-height: 0; filter: drop-shadow(0 8px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(255, 226, 180, .35)); }
  .get-label { margin: 0; font-size: 12px; letter-spacing: .3em; color: var(--gold); }
  .get-name { margin: 0; font-family: var(--serif); font-weight: 800; font-size: clamp(16px, 2.6vw, 22px); color: #f4ecdd; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .scene .bg { inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .5s ease, opacity .7s ease; }
  .scene.talk .bg, .scene.talk .sit { filter: brightness(.55) saturate(.8); }
  .scene .bg-clock { position: absolute; pointer-events: none; }
  .sit { position: absolute; width: auto; transition: filter .5s ease; pointer-events: none; }
  .sit.gone { display: none; }
  .scene .chime-cg { inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; pointer-events: none; z-index: 2; }
  .scene.cg .chime-cg { opacity: 1; }
  .scene.cg .hs { visibility: hidden; }
  .leftover { position: absolute; background: #efe8da; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .portrait { right: 1%; bottom: 0; height: 97%; width: auto; opacity: 0; transform: translateX(12px); transition: opacity .4s ease, transform .4s ease; pointer-events: none; }
  .portrait.show { opacity: 1; transform: none; }
  /* 章の子とは別に、その場にいる子（第五章のミオ）。左寄りに立つ。far は少し離れた所（二回り小さく、奥に） */
  .guest { position: absolute; left: 4%; bottom: -7%; height: 100%; width: auto; opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 3; }   /* 大きさ・位置は動かさない（出るときにズームして見えないように） */
  .guest.show { opacity: 1; }
  .guest.mid { height: 80%; bottom: 6%; left: 9%; }
  .guest.far { height: 70%; bottom: -3%; left: 14%; filter: brightness(.9); }
  .scene.talk .guest.show { filter: none; }
  .hs { position: absolute; background: transparent; border: 1px dashed transparent; border-radius: 4px; padding: 0; cursor: pointer; }
  .hs::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff4de; box-shadow: 0 0 8px 2px rgba(255, 220, 170, .7); opacity: .55; animation: glint 2.8s ease-in-out infinite; }
  .hs span { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(15, 12, 20, .78); color: var(--ink); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .hs span { pointer-events: none; }  /* 名札は押せない（隣の探索ポイントに重なっても、タップを横取りしない） */
  /* ホバーの枠と名札は、マウスのときだけ（タッチではタップ後に表示が残り、隣と重なって見えるため） */
  @media (hover: hover) {
    .hs:hover { border-color: rgba(236, 230, 214, .7); background: rgba(255, 240, 220, .07); }
    .hs:hover span { opacity: 1; }
  }
  .hs:focus-visible { border-color: rgba(236, 230, 214, .7); background: rgba(255, 240, 220, .07); outline: none; }
  .hs:focus-visible span { opacity: 1; }
  .hs:focus:not(:focus-visible) { outline: none; }
  /* タッチでは、小さな探索ポイントでも指で押しやすいよう、見た目はそのままで判定を少し広げる */
  @media (pointer: coarse) { .hs::before { content: ""; position: absolute; inset: -5px; } }
  .scene.talk .hs { visibility: hidden; }
  @keyframes glint { 50% { opacity: .15; transform: scale(.7); } }
  @keyframes hsGlint { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .hs { animation: none !important; } }

  .inv { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
  .inv .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-right: 4px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--akane); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .chip img { height: 20px; width: auto; display: block; }
  .chip.act { border-color: var(--akane); color: var(--akane); }
  .chip.blue { border-color: var(--blue); }


  .msg { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 18px; min-height: 124px; max-height: 46vh; overflow-y: auto; box-sizing: border-box; cursor: pointer; }
  .speaker { font-family: var(--serif); font-weight: 800; color: var(--akane); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px; }
  .text { line-height: 1.85; white-space: pre-wrap; }
  .text.narr { color: #d9d2c4; }
  .more { position: absolute; right: 14px; bottom: 6px; font-size: 11px; color: var(--akane); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .msg.lifted { z-index: 6; box-shadow: 0 -8px 18px rgba(40, 30, 20, .22); }
  .choice { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; line-height: 1.6; cursor: pointer; }
  .choice:hover { border-color: var(--akane); }

  .overlay { position: fixed; inset: 0; background: rgba(12, 10, 16, .9); display: grid; place-items: center; padding: 16px; overflow-y: auto; z-index: 10; }
  .ov-card > * { flex-shrink: 0; }
  .ov-card { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .ov-card h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; margin: 0; text-wrap: balance; }
  .ov-card p { margin: 0; line-height: 1.85; }
  .ov-card .alb-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ov-card .alb-pair figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ov-card .alb-pair img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border: 3px solid #fbf7ee; box-shadow: 0 0 0 1px #b5a689; box-sizing: border-box; }
  .ov-card .alb-pair figure.locked .thumb-empty { aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); color: var(--muted); }
  .ov-card .alb-pair figcaption { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  @media (max-width: 480px) { .ov-card .alb-pair { grid-template-columns: 1fr; } }
  .ov-card .howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; line-height: 1.7; }
  .ov-card .howto b { font-family: var(--serif); }
  .ov-card h3 { font-family: var(--serif); font-size: 16px; margin: 6px 0 0; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--akane); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 18px; cursor: pointer; }
  .btn:hover { border-color: var(--akane); }
  .btn.primary { background: var(--akane); border-color: var(--akane); color: #1a1218; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .sketch { width: 100%; max-width: 360px; align-self: center; display: block; }
  .painting { position: relative; width: 100%; max-width: 420px; align-self: center; border: 8px solid #e9e3d6; box-sizing: border-box; background: #999; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .painting::before { content: ''; display: block; padding-top: 66.667%; }
  .painting img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .painting .grey { filter: grayscale(.92) brightness(.82) contrast(.9); transition: opacity 3.6s ease; }
  .painting .grey.off { opacity: 0; }
  .painting .tears { position: absolute; inset: 0; width: 100%; height: 100%; }
  .painting .sign { position: absolute; right: 8px; bottom: 5px; font-size: 12px; color: #f7f2e8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .flip { position: relative; margin-bottom: 36px; width: 100%; max-width: 420px; align-self: center; }
  .flip::before { content: ''; display: block; padding-top: 66.667%; }
  .flip-in { position: absolute; inset: 0; transition: transform .22s ease-in; }
  .flip.turn .flip-in { transform: scaleX(0); }
  .flip .face { position: absolute; inset: 0; }
  .flip .face.back, .flip.on .face:not(.back) { display: none; }
  .flip.on .face.back { display: block; }
  .flip .face img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #flipBtn { align-self: center; }
  .zoom-btn { position: absolute; right: 0; bottom: -40px; width: 30px; height: 30px; padding: 5px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: rgba(20, 16, 26, .65); color: #f4ecdd; cursor: pointer; z-index: 2; }
  .zoom-btn:hover { background: rgba(20, 16, 26, .85); }
  .zoom-btn svg { width: 100%; height: 100%; display: block; }
  .sign-zoom { position: absolute; right: 6px; bottom: 6px; width: 58%; z-index: 3; cursor: zoom-out; border: 2px solid #efe6d6; box-shadow: 0 6px 16px rgba(0,0,0,.55); }
  .sign-zoom img, .flip .face .sign-zoom img { width: 100%; height: auto; object-fit: contain; display: block; box-shadow: none; }
  .sketch { border-radius: 4px; }
  .cg { width: 100%; display: block; border-radius: 4px; }
  .quote { font-family: var(--serif); font-size: 17px; border-left: 2px solid var(--akane); padding-left: 12px; }

  .dial { display: flex; gap: 14px; justify-content: center; }
  .poem { font-family: var(--serif); font-size: 17px; line-height: 2.1; background: #f1ebdf; color: #2a2327; padding: 14px 18px; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .poem .t { font-size: 13px; color: #6b5f58; margin-bottom: 4px; }
  .poem .gr { font-size: min(15px, 3.9vw); line-height: 1; display: flex; flex-direction: row-reverse; border-top: 1px solid #cdbca5; border-right: 1px solid #cdbca5; width: max-content; margin: 8px auto; }
  .poem .gr .pc { display: flex; flex-direction: column; }
  .poem .gr span { position: relative; width: 1.6em; height: 1.42em; display: flex; align-items: center; justify-content: center; border-left: 1px solid #cdbca5; border-bottom: 1px solid #cdbca5; }
  .poem .gr i { font-style: normal; writing-mode: vertical-rl; }
  .poem.p-draft .gr i { opacity: .1; filter: blur(1.7px); }
  .poem .gr span.m::after { content: ''; position: absolute; inset: 1px; border: 1.6px solid #b8423c; border-radius: 50%; }
  .poem.p-overlay .gr span:not(.m) i { opacity: .35; }
  .poem.p-overlay .gr span.m i { font-weight: 700; color: #8f2f2a; }
  .poem.p-draft { background: #e9e4da; transform: rotate(-.6deg); }
  /* 重ね合わせ：下に紹介文、上に字のない下書き（半透明の紙と赤い丸）。合うと丸の中の字が濃く見える */
  .row[hidden] { display: none; }
  .ov-inv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ov-inv .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .ov-inv .chip { display: inline-flex; align-items: center; gap: 6px; }
  .ov-inv .chip img { height: 20px; width: auto; }
  .ov-inv .chip.on { border-color: var(--akane); }
  .align-wrap { position: relative; overflow: hidden; border-radius: 3px; touch-action: manipulation; }
  .align-wrap .align-base { padding: 10px 14px; }
  .align-top { position: absolute; left: 0; top: 0; pointer-events: none; transition: transform .12s ease-out; }
  .align-top .gr { font-size: min(15px, 3.9vw); line-height: 1; display: flex; flex-direction: row-reverse; border-top: 1px solid rgba(160, 120, 100, .7); border-right: 1px solid rgba(160, 120, 100, .7); width: max-content; background: rgba(240, 236, 228, .5); box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
  .align-top .gr .pc { display: flex; flex-direction: column; }
  .align-top .gr span { position: relative; width: 1.6em; height: 1.42em; border-left: 1px solid rgba(160, 120, 100, .7); border-bottom: 1px solid rgba(160, 120, 100, .7); }
  .align-top .gr span.m::after { content: ''; position: absolute; inset: 1px; border: 1.6px solid #b8423c; border-radius: 50%; }
  .align-wrap.ok .align-top .gr { background: rgba(240, 236, 228, .18); }
  .align-wrap.ok .align-base span.mk i { font-weight: 700; color: #8f2f2a; }
  .align-wrap.ok .align-base span:not(.mk) i { opacity: .45; }
  .align-pad { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* 保健室：方向錠・視力検査表・来室カード・当番表 */
  .dl-show { display: flex; justify-content: center; gap: 8px; min-height: 40px; margin: 6px 0 10px; font-size: 26px; color: var(--gold); }
  .dl-show span { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .dl-pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center; margin-bottom: 10px; }
  .dl-pad button { font-size: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: #3a3446; color: #f3ead8; touch-action: manipulation; }
  .dl-pad .knob { border-radius: 50%; background: #6b6478; pointer-events: none; }
  .eye-chart { background: #fbfaf6; border-radius: 4px; padding: 10px 8px 6px; color: #222; }
  .eye-chart svg { display: block; width: 100%; height: auto; }
  .card-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fbf8f0; color: #2a2a2a; }
  .card-table th, .card-table td { border: 1px solid #b9b2a2; padding: 2px 4px; text-align: center; }
  #scene.room-dark #portrait, #scene.room-dark #sitFig, #scene.room-dark #guestFig { filter: url(#fRoomDark); }
  #scene.room-dark #sitFig.pretoned { filter: none; }
  .card-scroll { max-height: 46vh; overflow-y: auto; border-radius: 4px; scrollbar-width: none; }
  .card-scroll::-webkit-scrollbar { display: none; }
  .sc-wrap { position: relative; padding-right: 12px; }
  .sc-track { position: absolute; top: 0; right: 2px; bottom: 0; width: 5px; border-radius: 3px; background: rgba(255,255,255,.14); pointer-events: none; }
  .sc-thumb { position: absolute; left: 0; width: 100%; border-radius: 3px; background: rgba(232,220,198,.75); }
  .roster-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fbf8f0; color: #2a2a2a; margin-bottom: 8px; }
  .roster-table th, .roster-table td { border: 1px solid #b9b2a2; padding: 4px 6px; }
  .roster-table s { color: #8a8478; }
  .rs-wrap { max-height: 52vh; overflow: auto; margin-bottom: 6px; }
  .roster-cal { width: 100%; border-collapse: collapse; table-layout: fixed; background: #fbf8f0; color: #2a2a2a; font-size: 11px; }
  .roster-cal th { border: 1px solid #b9b2a2; padding: 2px; font-weight: 600; }
  .roster-cal td { border: 1px solid #b9b2a2; padding: 0; vertical-align: top; }
  .roster-cal b { display: block; font-size: 11px; color: #555; }
  .roster-cal span { display: block; line-height: 1.3; word-break: break-all; }

  .rw.final { left: 0; right: 0; top: 40%; text-align: center; letter-spacing: .16em; font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: clamp(22px, 4.2vw, 34px); color: #8a1a1c;
              text-shadow: 0 0 22px rgba(120, 0, 0, .9), 0 0 3px #000, 0 2px 0 #1a0608; animation: finalin 2.6s cubic-bezier(.2, .7, .2, 1) both, tremble .14s steps(2) infinite 2.6s; }
  .rw.final.gone { opacity: 1; animation: finalout 2.6s ease-in forwards; }
  @keyframes finalin { from { opacity: 0; filter: blur(14px); transform: scale(1.4); letter-spacing: .6em; } 55% { opacity: 1; filter: blur(0); } to { opacity: 1; transform: none; letter-spacing: .16em; } }
  @keyframes tremble { from { transform: translate(0, 0); } to { transform: translate(.6px, -.5px); } }
  @keyframes finalout { 30% { opacity: 1; filter: blur(0); } to { opacity: 0; filter: blur(16px); transform: translateY(36px) scale(1.06); color: #000; text-shadow: none; } }
  .rw.gopo { left: 0; right: 0; bottom: 18%; text-align: center; font-size: 13px; color: #6d6a66; letter-spacing: .3em; animation: rwin 1.5s ease both; }
  .rw-list { position: absolute; inset: 10% 8%; overflow: auto; color: #d9d2c6; }
  @keyframes rwfall { from { transform: translateY(0); } to { transform: translateY(85vh); } }
  @keyframes rwin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .roof-fx.late { background: rgba(0, 0, 0, .55); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 16px; pointer-events: none; }
  .lw { margin: 0; color: #cfc8bd; font-size: 14px; text-align: center; animation: rwin 1s ease both; transition: opacity 1.2s ease; }
  .lw.dim { opacity: .35; }
  .roof-fx.crack { pointer-events: none; background:
      linear-gradient(115deg, transparent 47%, rgba(255,255,255,.85) 48%, transparent 49%),
      linear-gradient(62deg, transparent 58%, rgba(255,255,255,.7) 59%, transparent 60%),
      linear-gradient(160deg, transparent 33%, rgba(255,255,255,.6) 34%, transparent 35%),
      rgba(120, 170, 200, .25); animation: crackin 1.4s ease both; }
  @keyframes crackin { 0% { opacity: 0; transform: none; } 30% { opacity: 1; transform: translate(-4px, 2px); } 45% { transform: translate(3px, -2px); }
                       100% { opacity: 1; transform: translateY(14px); filter: blur(3px); } }
  .roof-fx.ripple { pointer-events: none; display: grid; place-items: center; }
  .roof-fx.ripple i { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(220, 240, 248, .8); animation: rip 2.2s ease-out both; }
  @keyframes rip { from { transform: scale(.2); opacity: 1; } to { transform: scale(14); opacity: 0; } }
  #scene.roof-dark #bgImg { filter: brightness(.35) saturate(.6); transition: filter 1.2s ease; }
  #scene.roof-wind #bgImg { filter: brightness(.5) saturate(.5) hue-rotate(-10deg); transition: filter 1.2s ease; }
  #scene.tint-warm #bgImg { filter: brightness(1.08) saturate(1.1) sepia(.15); transition: filter 1.6s ease; }
  #scene.tint-pale #bgImg { filter: saturate(.4) brightness(1.1); transition: filter 1.6s ease; }
  .roof-tint { position: absolute; inset: 0; background: #a2d7dd; mix-blend-mode: soft-light; opacity: 0; pointer-events: none; border-radius: inherit; transition: opacity 1.6s ease; }
  .roof-tint.on { opacity: .9; }
  .void .ov-card { background: transparent; border: 0; box-shadow: none; text-align: center; }
  .void .void-text { display: flex; flex-direction: column; gap: 18px; margin: 24px 0 8px; }
  .void .void-text p { color: #d8d2c8; letter-spacing: .08em; }
  .void .row { justify-content: center; }
  .void .btn, .void .btn.primary { background: transparent; border: 0; color: #8f887c; font-size: 18px; padding: 10px 18px; animation: rise .8s ease both; animation-delay: var(--void-delay, 1.2s); }
  .void .btn.primary:focus-visible { outline: 1px solid rgba(255,255,255,.3); }
  .dawn .ov-card { background: rgba(255, 255, 255, .55); border-color: #c9c2ba; color: #2a2530; }
  .dawn .ov-card p { color: #2a2530; }
  .dawn .ov-card .cg.recall { filter: blur(2px) saturate(.55) brightness(1.08); opacity: .7; }
  .dawn .ov-card .recall-text p { color: #4a4058; }
  .dawn .eyebrow { color: #a4502c; }
  .dawn .note { color: #5b5462; border-color: #c9c2ba; }
  .dawn .btn { background: #fff; border-color: #c9c2ba; color: #2a2530; }
  .dawn .btn.primary { background: #3b5f9a; border-color: #3b5f9a; color: #fff; }
  .fade p { animation: rise .9s ease both; }
  .fade p:nth-child(2) { animation-delay: .8s; } .fade p:nth-child(3) { animation-delay: 1.6s; }
  .fade p:nth-child(4) { animation-delay: 2.4s; } .fade p:nth-child(5) { animation-delay: 3.2s; }
  .fade p:nth-child(6) { animation-delay: 4s; } .fade p:nth-child(7) { animation-delay: 4.8s; } .fade p:nth-child(8) { animation-delay: 5.6s; }
  .fade p:nth-child(9) { animation-delay: 6.4s; } .fade p:nth-child(10) { animation-delay: 7.2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .log { list-style: none; margin: 0; padding: 0 4px 0 0; max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .log li { line-height: 1.75; font-size: 14.5px; color: #d9d2c4; }
  .log-who { display: block; font-family: var(--serif); font-weight: 800; font-size: 12px; letter-spacing: .1em; color: var(--akane); }
  .log-t { white-space: pre-wrap; }
  .log-choice { color: var(--gold) !important; font-size: 13.5px !important; padding-left: 4px; }
  .log-empty { color: var(--muted) !important; }

  /* 音楽室：楽譜・鍵盤・スマホ */
  .staff { width: 100%; display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .fboard { position: relative; width: 100%; aspect-ratio: 1520 / 388; border: 1px dashed var(--line); border-radius: 4px; background: #120f17; }
  .fboard img { position: absolute; top: 0; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .frags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 70px; }
  .frag { padding: 4px; background: none; border: none; cursor: pointer; }
  .frag img { height: clamp(84px, 22vw, 118px); width: auto; display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .frag:hover img { transform: translateY(-2px); }
  .progress { display: flex; gap: 6px; justify-content: center; }
  .progress i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold); display: block; }
  .progress i.on { background: var(--gold); }
  .kb { position: relative; display: flex; height: 150px; user-select: none; touch-action: manipulation; }
  .wk { flex: 1; position: relative; background: linear-gradient(#fbf7ee, #e8e0d0); border: 1px solid #6b5e52; border-radius: 0 0 5px 5px; margin: 0 1px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .wk span { font-size: 11px; color: #9a8e80; }
  .wk.down, .wk:active { background: linear-gradient(#e6dccb, #d6ccb8); }
  .bk { position: absolute; top: 0; width: 7.2%; height: 60%; background: linear-gradient(#2a2420, #0f0c0a); border: 1px solid #000; border-radius: 0 0 4px 4px; z-index: 2; cursor: pointer; padding: 0; }
  .bk.down, .bk:active { background: #3a322c; }
  .phone-wrap { position: relative; }
  .phone-wrap .phone { scrollbar-width: none; }
  .phone-wrap .phone::-webkit-scrollbar { display: none; }
  .phone-bar { position: absolute; right: 4px; top: 42px; bottom: 12px; width: 4px; border-radius: 2px; background: rgba(255,255,255,.12); pointer-events: none; }
  .phone-thumb { position: absolute; left: 0; right: 0; border-radius: 2px; background: rgba(255,255,255,.55); }
  .phone { background: #0f0d12; border: 1px solid #3b3248; border-radius: 16px; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
  .phone-head { text-align: center; font-size: 13px; color: var(--muted); border-bottom: 1px solid #2a2334; padding-bottom: 8px; letter-spacing: .1em; }
  .bub { max-width: 78%; display: flex; flex-direction: column; gap: 2px; }
  .bub p { margin: 0 !important; padding: 7px 11px; border-radius: 14px; font-size: 14px; line-height: 1.5 !important; }
  .bub span { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bub.them { align-self: flex-start; } .bub.them p { background: #2a2334; color: var(--ink); }
  .bub.me { align-self: flex-end; align-items: flex-end; } .bub.me p { background: #3b5f4a; color: #eef3ea; }
  .loading { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 5; font-family: var(--serif); font-size: 14px; letter-spacing: .18em; color: #cfc6b6; pointer-events: none; }
  .loading span { animation: ld 1.2s infinite; opacity: .2; }
  .loading span:nth-child(2) { animation-delay: .2s; } .loading span:nth-child(3) { animation-delay: .4s; }
  @keyframes ld { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
  .dm { opacity: 0; animation: dmIn 1.4s ease-out forwards; }
  @keyframes dmIn { 0% { opacity: 0; filter: drop-shadow(0 0 0 #f3c77a); } 40% { opacity: 1; filter: drop-shadow(0 0 10px #f3c77a) brightness(1.8); } 100% { opacity: .95; filter: none; } }
  .flash { position: fixed; inset: 0; background: #f2d2b0; opacity: 0; pointer-events: none; z-index: 20; }
  .flash.go { animation: flash 1.6s ease; }
  @keyframes flash { 10% { opacity: .55; } 100% { opacity: 0; } }

  .scene.reset, .scene.reset * { transition: none !important; }
  @media (max-width: 480px) {
    #clock { font-size: 19px; }
    .bar-actions button { padding: 5px 8px; font-size: 12px; }
    .title-card { gap: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fade p, .more, .flash.go, .tap-hint, .title-side.later { animation: none; }
    .sit, .painting .grey, .portrait, .scene .chime-cg, .cutin, .get-item, .get-in { transition: none; }
    .hs::after { animation: none; }
  }


  /* ===== 見た目の方針：暗い画面に橙の印、という「生成物らしい」配色をやめ、夕方の教室に置かれた紙のノートにする =====
     ・地は生成りの紙。字は鉛筆とボールペンの色。押せるものは青（ボールペン）、印は朱（判子）だけ
     ・角丸・光る縁・ガラス風の板はなし。区切りは罫線と下線だけ
     ・場面の絵はノートに貼った写真。文章の欄はノートの罫線の上 */
  :root {
    --ground: #e7dcc6; --panel: #f4eddd; --panel2: #e9dfca; --line: #c3b296; --ink: #2a2420; --muted: #78695a;
    --akane: #b8402a; --gold: #8f6d22; --blue: #2d4f8a; color-scheme: light;
  }
  body { background: var(--ground); color: var(--ink); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .16; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  0 0 0 .6 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
  .bar-actions button, .menu-panel, .seg button, .bar-actions .menu-panel .seg button, .title-redo, .btn-sub, .scene, .hs, .chip, .msg, .choice, .ov-card, .btn, .cg, .btn-reset, .btn-tab, .shelf-bar, .btn-quiet, .slot, .shelf .slot, .album .slot { border-radius: 0; }
  /* 上の欄 */
  #clock { color: var(--ink); }
  .bells i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--akane); transform: rotate(-8deg); }
  .bells i.on { background: var(--akane); box-shadow: none; }
  .bar-actions button { border: 0; border-bottom: 1px solid var(--line); padding: 5px 6px; letter-spacing: .06em; background: none; color: var(--blue); }
  .bar-actions button:hover { border-bottom-color: var(--blue); border-bottom-width: 2px; padding-bottom: 4px; }
  .bar-actions button:disabled { opacity: .35; color: var(--muted); border-bottom-color: transparent; }
  .menu-panel { border: 1px solid var(--line); box-shadow: 2px 4px 0 rgba(60, 45, 30, .18); background: var(--panel); padding: 8px; }
  .bar-actions .menu-panel button { border: 0; border-bottom: 1px dashed transparent; color: var(--ink); }
  .bar-actions .menu-panel button:hover { border-bottom-color: var(--blue); border-bottom-width: 1px; padding-bottom: 8px; }
  .seg button, .bar-actions .menu-panel .seg button { background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); }
  .seg button[aria-pressed="true"], .bar-actions .menu-panel .seg button[aria-pressed="true"] { background: none; border-bottom: 2px solid var(--blue); color: var(--blue); }
  .menu-panel .vol input, .settings .vol input { accent-color: var(--blue); }
  /* 場面の絵：ノートに貼った写真（白い縁と、少しの影） */
  .scene { border: 4px solid #fbf7ee; background: #cfc3ab; box-shadow: 0 0 0 1px #b5a689, 2px 5px 0 rgba(60, 45, 30, .18); }
  .hs::after { width: 6px; height: 6px; margin: -3px 0 0 -3px; box-shadow: 0 0 4px 1px rgba(255, 220, 170, .5); }
  .hs span { border-radius: 0; background: rgba(250, 245, 234, .94); color: var(--ink); border-bottom: 1px solid var(--blue); padding: 1px 6px; }
  /* タッチ（スマホ）では、ホバーで枠を確かめられないので、押せる範囲の全体を枠で見せる。
     明るい背景でも暗い背景でも見えるよう、白い点線の外側に細い影の線を重ねる */
  @media (pointer: coarse) {
    .hs { border: 1.5px dashed rgba(255, 250, 238, .92); background: rgba(255, 244, 226, .10); border-radius: 6px;
          box-shadow: 0 0 0 1px rgba(40, 28, 20, .45), inset 0 0 0 1px rgba(40, 28, 20, .30); }
    /* 印も名札も出さず、枠だけで見せる（名札を出すと、調べる場所が多い部屋で枠と名札が入りまじって見づらいため） */
    .hs::after { display: none; }
    /* 枠は、白い点と同じ間隔（2.8秒）でゆっくり明滅させる。消えきらないよう、いちばん薄いときも少し残す */
    .hs { animation: hsGlint 2.8s ease-in-out infinite; }
  }
  /* 持ち物：ノートに貼ったメモ */
  .inv .label { color: var(--muted); }
  .chip { border: 0; background: var(--panel2); border-bottom: 1px solid var(--line); padding: 4px 10px; color: var(--ink); }
  .chip:hover { border-bottom-color: var(--blue); background: #e3d7bd; }
  .chip.act { color: var(--blue); border-bottom-color: var(--blue); }
  /* 文章の欄：ノートの1ページ。罫線の上に字が乗り、左に綴じの線 */
  .msg { background: var(--panel) repeating-linear-gradient(to bottom, transparent 0, transparent 28.6px, rgba(45, 79, 138, .16) 28.6px, rgba(45, 79, 138, .16) 29.6px); background-position: 0 11px;
         border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 18px 20px 24px; box-shadow: 2px 5px 0 rgba(60, 45, 30, .12); }
  .msg::before { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 1px; background: rgba(184, 64, 42, .45); }
  .text.narr { color: #3a322b; }
  .speaker { letter-spacing: .14em; color: var(--akane); }
  .speaker::before { content: "─ "; color: rgba(184, 64, 42, .55); font-weight: 400; }
  .more { bottom: 8px; right: 16px; color: var(--akane); }
  /* 選択肢：ノートの行。重ねるとボールペンで線を引いたように */
  .choice { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 10px 9px 26px; position: relative; color: var(--ink); }
  .choice::before { content: "・"; position: absolute; left: 8px; top: 9px; color: var(--muted); }
  .choice:hover { border-bottom: 2px solid var(--blue); padding-bottom: 8px; color: var(--blue); }
  .choice:hover::before { content: "▶"; color: var(--blue); font-size: 11px; top: 12px; }
  .choices { gap: 2px; margin-top: 10px; margin-left: -24px; padding-left: 24px; margin-right: -18px; padding-right: 18px; background: var(--panel); }   /* 選択肢の部分は罫線を消し、選択肢の下線だけにする（線が重なって見づらいので） */
  /* 重ねて出す画面：机の上に置いた紙 */
  .overlay { background: rgba(58, 46, 34, .55); }
  .ov-card { background: var(--panel); border: 1px solid var(--line); padding: 24px 22px; box-shadow: 3px 6px 0 rgba(60, 45, 30, .2); color: var(--ink); }
  .ov-card h2 { letter-spacing: .06em; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .eyebrow { letter-spacing: .2em; color: var(--akane); }
  .note { color: var(--muted); }
  .btn { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; letter-spacing: .06em; color: var(--ink); }
  .btn:hover { border-bottom-color: var(--blue); color: var(--blue); }
  .btn.primary { background: none; color: var(--blue); border-bottom: 2px solid var(--blue); font-weight: 600; }
  .btn.primary:hover { background: rgba(45, 79, 138, .07); }
  .btn-sub { border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); }
  .btn-sub:hover { border-bottom-color: var(--blue); color: var(--blue); }
  .title-redo { border: 0; border-left: 1px solid var(--line); background: none; padding-left: 14px; }
  .btn-reset { border: 0; border-bottom: 1px solid var(--akane); padding: 6px 4px; background: none; color: var(--akane); }
  .btn-reset:hover { background: none; color: var(--akane); border-bottom-width: 2px; }
  .btn-tab { border: 0; border-bottom: 1px solid var(--line); padding: 3px 8px; color: var(--muted); }
  .btn-tab.on { border-bottom: 2px solid var(--gold); color: var(--ink); }
  .btn-quiet { color: var(--muted); }
  .slot { background: #efe7d6; }
  .shelf-bar { height: 4px; background: #e2d7c1; border-bottom: 1px solid var(--line); }
  .shelf-bar i { background: #8d8273; }
  .settings .set-row { border-bottom: 1px dashed var(--line); }
  .log-who { color: var(--akane); }
  .log-t { color: var(--ink); }
  button:focus-visible, .btn:focus-visible, .choice:focus-visible { outline: 0; box-shadow: 0 2px 0 0 var(--blue); }
  .ov-card .btn.primary:focus:not(:hover) { box-shadow: none; }
  /* タイトル：タップするまでは絵を全部見せる。題は左下に、写真に貼った白いラベルで。タップしたら左から紙がかぶさってメニュー */
  .title-screen { background: var(--title-img) center / cover no-repeat, var(--ground); padding-left: max(16px, 6vw); transition: background .5s ease; }
  .title-screen.menu { background: linear-gradient(90deg, rgba(244, 237, 221, .97) 0%, rgba(244, 237, 221, .93) 40%, rgba(244, 237, 221, .3) 78%, rgba(244, 237, 221, 0) 100%), var(--title-img) center / cover no-repeat, var(--ground); }
  .title-screen:not(.menu) .vtitle { position: fixed; left: 6vw; bottom: 24vh; writing-mode: horizontal-tb; font-size: clamp(20px, 3.6vw, 30px); letter-spacing: .16em; line-height: 1.3;
    background: rgba(250, 245, 234, .92); color: var(--ink); padding: 10px 18px; border-bottom: 2px solid var(--akane); box-shadow: 2px 4px 0 rgba(0, 0, 0, .25); transform: rotate(-1.2deg); }
  .title-screen:not(.menu) .vtitle span { color: var(--akane); }
  .title-screen.menu .vtitle { color: var(--ink); }
  .title-screen.menu .vtitle span { color: var(--akane); }
  .title-card { background: none; border: 0; box-shadow: none; padding: 0; }
  .tap-hint { color: var(--ink); letter-spacing: .3em; text-shadow: none; background: rgba(250, 245, 234, .85); width: max-content; margin: 0 auto; padding: 4px 14px; bottom: 10vh; }
  .title-side .btn { color: var(--ink); }
  .title-side .btn.primary { color: var(--blue); }
  .title-side .note { color: var(--muted); }

  /* ===== 紙の見た目：残っていた暗い板（セーブ・棚・実績・曲目・謎解き）も紙に =====
     一覧の行は、薄い紙を重ねた札。選べる行は重ねると青い線。印は朱・金 */
  .save-slot, .pair-side, .ach-row, .slot, .ost-row { background: #efe7d6; border: 1px solid var(--line); border-left: 3px solid var(--line); color: var(--ink); }
  .save-slot .info { color: var(--ink); }
  .save-slot .no, .save-slot .when, .slot .who, .ost-row .no, .ost-row .desc, .ost-row .st, .ach-row .cond, .ach-row .when, .ach-row .ach-mark { color: var(--muted); }
  .save-slot .btn { border-bottom: 1px solid var(--blue); color: var(--blue); }
  .save-slot .btn:hover { border-bottom-width: 2px; padding-bottom: 6px; }
  .save-slot .btn:disabled { opacity: .3; color: var(--muted); border-bottom-color: var(--line); }
  button.pair-side:hover, .album .slot.got:hover, .ost-row:hover { border-left-color: var(--blue); background: #ebe2cd; }
  .pair-side.saved, .album .slot.saved, .shelf .slot.got.saved { border-left-color: var(--gold); box-shadow: none; }
  .shelf .slot.got { border-left-color: var(--blue); box-shadow: none; }

  /* ===== エンドロール（NORMAL以上の結末で、結末の名前を出す前に流す） ===== */

  .title-screen.rainy::after { content: ""; position: fixed; inset: -30% 0 0 0; pointer-events: none; z-index: 0; opacity: .28;
    background-image: repeating-linear-gradient(104deg, transparent 0 16px, rgba(220, 230, 245, .35) 16px 17px, transparent 17px 34px),
                      repeating-linear-gradient(102deg, transparent 0 11px, rgba(200, 215, 235, .22) 11px 12px, transparent 12px 27px);
    background-size: 100% 80px, 100% 52px; animation: titleRain .55s linear infinite; }
  @keyframes titleRain { to { background-position: -22px 80px, -14px 52px; } }

  /* 雨のタイトルでメニューを開いたら、暗さと雨の筋は絵の側（右）だけに。紙の側は読めるように */
  .title-screen.rainy.menu::after { -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 38%, #000 72%); mask-image: linear-gradient(90deg, transparent 0%, transparent 38%, #000 72%); }
  /* タイトルのメニュー：絵の上でも読めるよう、メニューの列の後ろに紙を一枚敷く（夕方の暗い絵・スマホの幅でも） */
  .title-screen.menu .title-side { background: rgba(246, 240, 226, .94); padding: 16px 18px; box-shadow: 2px 4px 0 rgba(60, 45, 30, .18); border: 1px solid rgba(195, 178, 150, .6); }

  .recall-row:hover { color: var(--blue); border-bottom-color: var(--blue); }

  /* 読んでいるあいだ、枠の大きさを変えない（絵のあるページも、文の長さが違うページも同じ大きさ。長いときは文だけ動かせる） */

<script>
(() => {
  const KEY = 'houkago-wasuremono-v1';
  const CHIME_AT = 10;
  const SPAN = 30;                       // 1章の長さ（分）
  const MIN_PER_TICK = SPAN / CHIME_AT;  // 調べるたびに進む分
  // 16:00 からの分 → 「16:30」のような表示
  const hm = m => `${16 + Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  const chStart = () => (C && C.startMin) || 0;
  const chEnd = () => chStart() + SPAN;
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const P = (() => {
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) return d; } catch (e) {}
    return { shelf: {}, runs: 0, endings: {}, sound: true };
  })();
  P.shelf = P.shelf || {}; P.endings = P.endings || {}; P.saved = P.saved || {};
  // cleared：今回のプレイで朝を迎えた子（章の開放に使う。周回の終わり・「放課後を思い返す」で消える）／saved：実績（それでも残る）
  P.cleared = P.cleared || { ...P.saved };
  // shut：今回のプレイで部屋から閉め出された子。最後の放課後のエンディングを迎えるまで、その章には戻れない
  P.shut = P.shut || {};
  // 周回数は「最後の放課後のノーマル／トゥルーエンドを見た回数」。以前の数え方（章を始めるたび）の値は消す
  if (!P.runsV2) { P.runs = 0; P.runsV2 = true; }
  // 新しい仕様：runNo＝今の周回の番号。cur.results＝この周回で終えた章の結果（saved / shut / vanished）
  // shelfRun＝そのわすれものを手に入れた周回。わすれものが効くのは、前の周回以前に手に入れたものだけ
  P.runNo = P.runNo || 1; P.shelfRun = P.shelfRun || {};
  // mem：章ごとの「調べた・話した」記憶（R.know）。BAD・閉め出し・周回の終わりのあとも、次にその章を始めるとき引き継ぐ
  P.mem = P.mem || {};
  // touchMem：ほどけなくても心に触れたときに受け取った、主人公の記憶のかけら（章ごとに一度だけ出す）
  P.touchMem = P.touchMem || {};
  // said：章の対話で選んだ言葉（周回をまたいで残す）。wrong＝正論・慰める・追い詰める、yori＝寄り添う・わすれものの言葉。屋上の言葉の雨ともう一人の自分の台詞に混ぜる
  P.said = P.said && P.said.wrong ? P.said : { wrong: [], yori: [] };
  // 謎解きの難しさ：normal（普通）／easy（やさしい）。やさしいは、3〜5章の手順だけの謎（本の並べ替え・マグネット・方向の錠・照らし合わせ）を自動で解く。
  // 物語や背景がわかる手がかり（貸出記録・部誌・来室カード・窓の跡など）は、どちらでも自分で調べる
  P.diff = P.diff === 'easy' ? 'easy' : 'normal';
  // diffSet：難しさを一度でも選んだ（初回の選択・設定での変更）。選ぶ画面は、まだ選んでいない初回プレイのときだけ出す。前に遊んだ人は選んだことがある
  if (P.played) P.diffSet = true;
  // heard：一度でも流れた曲（サウンドトラックで「？？？」を外すのに使う）。記録を始める前に遊んだ分は、見た結末などから推し量る
  P.heard = P.heard || {};
  if (!P.heardV1) {
    P.heardV1 = true;
    const E = P.endings || {}, h = P.heard;
    if (P.played || P.runs) { h.title = h.explore = true; }
    if (Object.keys(P.saved || {}).length) { h.core = h.musicbox = h.unravel = true; }
    if ((P.saved || {}).sota) h.sota = true;
    if (Object.keys(P.shelf || {}).length || E.BAD5 || E.BAD6) h.vanish = true;
    if (E.shut || E.BAD1 || E.BAD4) h.shut = true;
    if (E.BAD2) h.coreHeavy = true;
    if (E.BAD3) h.codep = true;
  }
  if (!P.cur) P.cur = { results: {} };
  const saveP = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

  /* 周回の途中経過（つづきから用）。操作待ちになるたびに自動で保存し、周回が終わったら消す */
  const SAVE_KEY = 'houkago-wasuremono-save-v1';
  // 手動セーブと同じ形 { run, prog, resume? } で保存する。会話の途中なら、その会話の始まりの状態と答えの記録（resume）も入れる
  function saveRun() {
    if (!R || R.over || replay) return;
    const d = scr && !onRoof()
      ? { at: Date.now(), mid: true, run: scr.start, prog: scr.prog, resume: { key: scr.key, lines: scr.lines, inputs: scr.inputs } }
      : { at: Date.now(), run: serR(R), prog: progSnap() };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) {}
  }
  function loadRun() {
    try {
      let d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!d) return null;
      if (!d.run) d = { run: d };   // 古い形（周回の状態だけ）
      const r = d.run;
      r.items = new Set(r.items); r.know = new Set(r.know); r.seen = new Set(r.seen || []); r.log = r.log || []; r.over = false;
      r.ch = r.ch || 'art'; r.st = r.st || r.hina || 'here';
      return d;
    } catch (e) { return null; }
  }
  function clearRun() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  /* 屋上の途中経過（つづきから用）。文章を待つたびに、手動セーブと同じ形で自動保存し、屋上が終わったら消す */
  const ROOF_KEY = 'houkago-wasuremono-roof-v1';
  // 屋上のはじまり（その周回で屋上に着いたときの状態）。屋上の結末のあとも残し、「放課後を思い返す」で屋上に戻るときに使う
  const ROOF_START_KEY = 'houkago-wasuremono-roofstart-v1';
  function saveRoofStart() {
    try {
      const o = JSON.parse(localStorage.getItem(ROOF_START_KEY) || 'null');
      if (o && o.runNo === P.runNo) return;
      localStorage.setItem(ROOF_START_KEY, JSON.stringify({ runNo: P.runNo, label: '屋上・18:30', run: scr.start, prog: scr.prog, resume: { key: scr.key, lines: 0, inputs: [] } }));
    } catch (e) {}
  }
  function loadRoofStart() {
    try {
      const d = JSON.parse(localStorage.getItem(ROOF_START_KEY) || 'null');
      if (!d || !d.run) return null;
      const r = d.run; r.items = new Set(r.items); r.know = new Set(r.know); r.seen = new Set(r.seen || []); r.log = r.log || []; r.over = false;
      return d;
    } catch (e) { return null; }
  }
  function saveRoof() {
    if (!onRoof() || replay) return;
    saveRoofStart();
    try { localStorage.setItem(ROOF_KEY, JSON.stringify({ at: Date.now(), label: '屋上・18:30', mid: true, rain: !!rainNodes, wind: !!windNodes, run: scr.start, prog: scr.prog, resume: { key: scr.key, lines: scr.lines, inputs: scr.inputs } })); } catch (e) {}
  }

  /* 選択肢：[文, 種類] の並び。種類＝yori（寄り添う）/ seiron（正論）/ nagu（慰める）/ oitsu（追い詰める）/ key（わすれもので出る最後の言葉）
     慰めるは2ループ目以降かつ2つ目以降の選択肢にだけ出す */
  let askCount = 0;  // 選択肢を出した回数（対話が始まったかどうかの判定に使う）
  // 選択肢の並び：種類ごとの位置が段や章で固まると、位置で答えがわかってしまうので、章と段ごとに並びを決めておく。
  // 毎回ランダムにすると、セーブから再開したときに選んだ答えがずれるため、固定の並びにする（慰めるは2ループ目以降だけ出る）
  const ASK_ORDER = {
    art:       { 1: ['seiron', 'oitsu', 'yori'], 2: ['yori', 'oitsu', 'nagu', 'seiron'], 3: ['oitsu', 'key', 'nagu', 'seiron'] },
    music:     { 1: ['seiron', 'oitsu', 'yori'], 2: ['yori', 'nagu', 'seiron', 'oitsu'], 3: ['key', 'oitsu', 'nagu', 'seiron'] },
    library:   { 1: ['yori', 'oitsu', 'seiron'], 2: ['oitsu', 'seiron', 'nagu', 'yori'], 3: ['oitsu', 'nagu', 'seiron', 'key'] },
    gym:       { 1: ['oitsu', 'seiron', 'yori'], 2: ['seiron', 'nagu', 'yori', 'oitsu'], 3: ['seiron', 'oitsu', 'key', 'nagu'] },
    infirmary: { 1: ['seiron', 'yori', 'oitsu'], 2: ['nagu', 'yori', 'oitsu', 'seiron'], 3: ['nagu', 'key', 'seiron', 'oitsu'] }
  };
  async function ask(opts, stage) {
    askCount++;
    const ord = (ASK_ORDER[C.id] || {})[stage];
    const pos = k => { const n = ord ? ord.indexOf(k) : -1; return n < 0 ? 99 : n; };
    const list = opts.filter(([, k]) => k !== 'nagu' || (R.loop >= 1 && stage >= 2))
      .map((o, n) => [o, n]).sort((x, y) => pos(x[0][1]) - pos(y[0][1]) || x[1] - y[1]).map(([o]) => o);
    const i = await choose(list.map(([t]) => t));
    const kind = list[i][1];
    saidNote(list[i][0], kind, stage);
    if (stage === 1 && kind === 'yori') { R.touched = true; bgm(null); pendingCore = C.coreAt || 2; }   // coreAt：選択のあと何文目で核心の曲を始めるか（章ごと）
    if (stage >= 2 && (kind === 'yori' || kind === 'nagu' || kind === 'key')) R.touched = true;
    if (kind !== 'yori' && kind !== 'key') nmMark('miss');
    return kind;
  }
  // 選んだ言葉を覚えておく（同じ文は一度だけ。新しいものを後ろに、多すぎたら古いものから捨てる）
  function saidNote(t, kind, stage) {
    if (typeof t !== 'string' || !C || !CHAPTERS[C.id]) return;
    const box = (kind === 'yori' || kind === 'key') ? P.said.yori : ['seiron', 'nagu', 'oitsu'].includes(kind) ? P.said.wrong : null;
    if (!box) return;
    const n = box.findIndex(e => e.t === t); if (n >= 0) box.splice(n, 1);
    box.push({ t, k: kind, s: stage, c: C.id }); if (box.length > 30) box.shift();
    saveP();
  }
  // 屋上で返す言葉：言葉の雨（短いもの。横に流れるので20字まで）／遅れて混ざる言葉（正論・慰める）／もう一人の自分が引く「寄り添う」の言葉（2つ。違う章から）
  function saidForRoof() {
    const mix = a => a.slice().sort(() => Math.random() - .5), cls = { seiron: 'sei', nagu: 'nag', oitsu: 'neg' };
    const bare = t => t.replace(/^「|」$/g, '');   // 選択肢の文に「」がついていても、二重にしない
    const wrong = mix(P.said.wrong).map(e => [bare(e.t).replace(/^……/, ''), cls[e.k]]);
    const rain = wrong.filter(([t]) => t.length <= 20).slice(0, 3);
    const late = wrong.filter(w => !rain.includes(w) && w[1] !== 'neg').slice(0, 3);
    const yori = [], seen = new Set();
    for (const e of mix(P.said.yori).sort((a, b) => (b.s >= 2) - (a.s >= 2))) { if (yori.length < 2 && !seen.has(e.c)) { seen.add(e.c); yori.push(bare(e.t)); } }
    return { rain, late, yori };
  }
  // 最後の選択肢で「正論」「慰める」を選んだあと：わすれものがなければ心を閉ざしてループ、あれば3択
  // わすれものがないまま最後の段で行き詰まったとき：一度だけ、仕組みを伝える
  async function keyNote() {
    if (P.keyTold) return;
    P.keyTold = true; saveP();
    await overlayWait(`<p class="eyebrow">しくみ</p><h2>まだ、届かない言葉がある</h2>

      <p class="note">この放課後でほどけなくても、物語は先へ進みます。調べたこと・話したことは覚えています。</p>`, '', ['続ける']);

  // 依存の結末へ入る直前：安心させるたびに、相手がこちらにしか寄りかかれなくなっていったこと
  // 共感の言葉に聞こえても、どこで境界を誤ったのかがわかるように、章ごとに「何を代わりに引き受けてしまったか」を言う
  const DEP_NOTE = {
    art: '（……痛みをわかってあげたかった。でも、ここでうなずいたら、ヒナの痛みの行き先が手首からこちらに変わるだけだった）',

  const depNote = () => `（……さっきも同じように安心させた。そのたびに、${C.name}はこちらにしか寄りかかれなくなっていった）`;
  async function lastWrong() {

  async function closeHeart(after) {
    // 心を閉ざしたら、その場でチャイムの時間まで飛ばす

  /* 追い詰める言葉（2段目・3段目）を言ったあと：相手は深く傷つく。黙ったままなら消える道へ。
     一度だけ「……ごめん。今のは、ちがった」と言い直せる（チャイムが鳴るまでに一度。二度目はそのまま消える道へ）。
     言い直すと「ためらいの段」が挟まる。言い訳や重ねた謝罪では心を閉ざし、受け止める・黙って待つで、話の続きに戻れる。
     戻り値 true：この会話は終わった（消える道か、心を閉ざした） */
  const HESITATE = {
    art: { lines: [['ヒナ', '……さっきの、まだ痛いんだけど', 'sad'], ['ヒナ', '……で？', 'angry']],
           ok: ['ヒナはしばらく窓の外を見ていた。', ['', 'それから袖を握っていた手を、ほんの少しだけゆるめた。', 'down']] },
    music: { lines: [['ソウタ', '……今日会ったばっかりで、よくそういうこと言えるな', 'angry']],
             ok: ['ソウタは蓋の上の自分の手を、しばらく見ていた。', ['', '……それから、小さく息を吐いた。', 'down']] },
    library: { lines: [['ミオ', '……さっきの言葉、たぶん、ずっと残ると思う', 'sad']],
               ok: ['ミオは胸に抱えた本の角を、指でなぞっていた。', ['', '……それから、少しだけ顔を上げた。', 'down']] },

           ok: ['ケイはテーピングの指を、ゆっくり握ったり開いたりしていた。', ['', '……それから、笑顔をやめてこっちを見た。', 'down']] },
    infirmary: { lines: [['ツムギ', '……いいよ、べつに。慣れてるから', 'smile']],

  async function hurt(lines) {

    R.repaired = true;

    const opts = [['「……うん。傷つける言い方だった」', 'ok'], ['「そういうつもりじゃ、なかったんだ」', 'excuse'], ['（何も言わずに、待つ）', 'ok'], ['「ごめん。本当に、ごめん」', 'again']];

  async function doom(lines) {

  // 消失とは別のBAD：相手に完全に拒まれ、部屋から閉め出される。わすれものは残らない

  const ROOMS = [['hina', '美術室'], ['sota', '音楽室'], ['mio', '図書室'], ['kei', '体育館'], ['tsumugi', '保健室']];
  // 部屋の名前は、その章を開放したあとだけ出す（まだ行ったことのない部屋は「ほかの教室」）
  function windowLine() {
    const named = ORDER.filter(id => id !== C.id && unlocked(id)).map(id => CHAPTERS[id].room);
    return named.length ? `${named.join('からも、')}からも、ほかの教室からも、物音ひとつしない。` : 'ほかの教室からも、物音ひとつしない。';
  }
  // ほどけたら開くのは、その部屋の扉。一枚絵はその子の行き先（下校する子は校門、ミオは保健室へ続く渡り廊下）
  // stop：主人公が足を止める場所（主人公は、まだ放課後の外へは出られない）
  function ending({ lines, img, alt, stop = '門の手前で、足が止まる。まだここは通れない。', album = img, music = null }) {
    talkHold = false;
    if (album) albumSee(album);
    R.standing = true;  // 見送りの場面では立っている
    const now = chStart() + R.ticks * MIN_PER_TICK;
    R.over = true; clearRun(); P.saved[C.key] = true; saveP(); albumSync(); render(); idle(); if (music) keepBgm(music, [music]); else keepBgm('unravel', WARM);
    const next = recordResult('saved');

  }

  function dial(n = 3, eyebrow = '画材棚の引き出し', title = '3桁のダイヤル錠', chars = '0123456789') {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      const d = Array(n).fill(0);
      openOverlay(`<p class="eyebrow">${eyebrow}</p><h2>${title}</h2>
        <div class="dial">${d.map((_, i) => `<div class="wheel">
          <button type="button" data-i="${i}" data-d="1" aria-label="${i + 1}桁目を上げる">▲</button>
          <output id="dg${i}">${chars[0]}</output>
          <button type="button" data-i="${i}" data-d="-1" aria-label="${i + 1}桁目を下げる">▼</button></div>`).join('')}</div>
        <div class="row"><button type="button" class="btn primary" id="dOpen">開ける</button><button type="button" class="btn" id="dCancel">やめる</button></div>`);
      // ピアノの鍵盤と同じく、指が触れた瞬間に1つ動かす（クリックを待たないので、速く押してもダブルタップの拡大にならない）
      const step = b => { const i = +b.dataset.i; d[i] = (d[i] + +b.dataset.d + chars.length) % chars.length; $('#dg' + i).textContent = chars[d[i]]; };
      card.querySelectorAll('.wheel button').forEach(b => {
        b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); step(b); });
        b.onclick = e => { if (e.detail === 0) step(b); };  // キーボードで押したときだけ
      });
      $('#dOpen').onclick = () => { closeOverlay(); res(d.map(k => chars[k]).join('')); };
      $('#dCancel').onclick = () => { closeOverlay(); res(null); };
    });
  }

  function wireFlip(mustSeeBack) {
    const close = card.querySelector('[data-v="0"]');
    if (mustSeeBack) close.hidden = true;
    $('#flipBtn').onclick = async () => {
      const fl = $('#flip');
      fl.classList.add('turn'); await new Promise(r => setTimeout(r, reduce ? 0 : 220));
      const on = fl.classList.toggle('on');
      fl.classList.remove('turn');
      $('#flipBtn').textContent = on ? '表に戻す' : '裏返す';
      $('#signZoom').hidden = true;
      $('#zoomBtn').hidden = on;
      if (on) close.hidden = false;
    };
    $('#zoomBtn').onclick = () => { $('#signZoom').hidden = !$('#signZoom').hidden; };
    $('#signZoom').onclick = () => { $('#signZoom').hidden = true; };
    $('#flipBtn').focus({ preventScroll: true });
  }

  // 切れ端を破れ目の形で並べる（番号はない）。置いた順に左からつながり、隣どうしは破れ目の幅だけ重なる
  function arrangeFrags() {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      const order = [3, 1, 4, 2], tilt = { 1: -3, 2: 2.5, 3: -1.5, 4: 3.5 };
      const placed = [];
      const pct = v => `${(v / SCORE.w * 100).toFixed(3)}%`;
      const draw = () => {
        let x = 0;
        const onBoard = placed.map(n => {
          const w = SCORE.pieces[n - 1].w, h = `<img src="img/m_frag${n}.webp" alt="五線譜の切れ端" style="left:${pct(x)};width:${pct(w)}">`;
          x += w - SCORE.overlap; return h;
        }).join('');
        openOverlay(`<p class="eyebrow">4枚の切れ端</p><h2>つなぎ合わせる</h2>
          <p class="note">【操作】切れ端を押すと、左から順につながります。4枚つなぐと、合っているか確かめます。</p>
          <div class="fboard">${onBoard}</div>
          <div class="frags">${order.filter(n => !placed.includes(n)).map(n => `<button type="button" class="frag" data-n="${n}" style="transform:rotate(${tilt[n]}deg)"><img src="img/m_frag${n}.webp" alt="五線譜の切れ端"></button>`).join('')}</div>
          <p class="note" id="fragMsg"></p>
          <div class="row"><button type="button" class="btn" id="fReset">はじめからやり直す</button><button type="button" class="btn" id="fCancel">やめる</button></div>`);
        card.querySelectorAll('.frag').forEach(b => b.onclick = () => {
          placed.push(+b.dataset.n);
          if (placed.length < 4) return draw();
          if (placed.join('') === '1234') { draw(); card.querySelector('#fReset').closest('.row').hidden = true; $('#fragMsg').textContent = '……破れ目が、ぴたりと重なった。'; setTimeout(() => { closeOverlay(); res(true); }, 1100); return; }
          draw(); nmMark('puz'); $('#fragMsg').textContent = '……破れ目が、かみ合わない。';
        });
        $('#fReset').onclick = () => { placed.length = 0; draw(); };
        $('#fCancel').onclick = () => { closeOverlay(); res(false); };
      };
      draw();
    });
  }

  // ソウタのパート（Primo）。10年以上弾いてきた子のパートなので、16分音符の分散和音と左手のベースで動く。
  // ハルの音を1つ弾くたびに、その拍（16分音符4つ＋左手8分音符2つ）が重なる
  const noteF = n => { const m = /^([A-G])([#b]?)(\d)$/.exec(n); if (!m) return 0;
    const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (k + (+m[3] + 1) * 12 - 69) / 12); };
  // 連弾版の4本の手の帯（上から ソウタ右手 G5〜／ソウタ左手 G4〜F#5／ハル右手 C3〜F#4／ハル左手 〜C3）に合わせ、
  // ソウタの右手は G5 から上の16分音符、左手はハルの旋律（E4〜A4）の上の G4〜F#5 で8分音符を刻む。低音はハルの左手の受け持ち
  const PRIMO = [  // [右手16分×4, 左手8分×2]
    [['C6', 'E6', 'G6', 'C7'], ['C5', 'G4']], [['B6', 'G6', 'E6', 'G6'], ['E5', 'G4']],
    [['A6', 'F6', 'C7', 'A6'], ['F5', 'C5']], [['G6', 'E6', 'C6', 'E6'], ['C5', 'G4']],
    [['F6', 'D6', 'A6', 'F6'], ['D5', 'A4']], [['E6', 'C6', 'A5', 'C6'], ['A4', 'E5']],
    [['D6', 'F6', 'B6', 'D7'], ['G4', 'F5']], [['C7', 'G6', 'E6', 'C6'], ['C5', 'G4']]];
  const S16 = 0.14;
  function sotaBeat(i) {
    const [rh, lh] = PRIMO[i];
    rh.forEach((n, k) => pianoNote(noteF(n), k ? 0.07 : 0.09, 0.02 + k * S16));
    lh.forEach((n, k) => pianoNote(noteF(n), 0.16, 0.02 + k * S16 * 2));   // 中低音は2倍
  }
  // フレーズのあと、ソウタがひとりで弾く続き（2/4拍子で4小節＋終止）。2オクターブにわたる分散和音と駆け下りるパッセージ
  const SOLO_RH = ['E5', 'G5', 'C6', 'E6', 'D6', 'C6', 'B5', 'A5',
                   'G5', 'B5', 'D6', 'G6', 'F6', 'D6', 'B5', 'G5',
                   'A5', 'C6', 'E6', 'A6', 'G6', 'F6', 'E6', 'D6',
                   'C6', 'B5', 'A5', 'G5', 'F5', 'E5', 'D5', 'B4'];
  const SOLO_LH = [['C3', 'G3'], ['C3', 'G3'], ['G2', 'D3'], ['G2', 'D3'], ['A2', 'E3'], ['F2', 'C3'], ['D3', 'A3'], ['G2', 'F3']];
  function sotaSolo() {
    const t0 = 0.3;
    SOLO_RH.forEach((n, k) => pianoNote(noteF(n), 0.075, t0 + k * S16));
    SOLO_LH.forEach((pair, beat) => pair.forEach((n, k) => pianoNote(noteF(n), 0.14, t0 + beat * S16 * 4 + k * S16 * 2)));
    const end = t0 + SOLO_RH.length * S16;
    ['C2', 'C3', 'G3', 'C4', 'E4', 'G4', 'C5', 'E5', 'G5', 'C6'].forEach((n, k) => pianoNote(noteF(n), k < 2 ? 0.2 : k === 2 ? 0.14 : 0.07, end + k * 0.045));
    return (end + 2.2) * 1000;
  }
  // 鍵盤：ハルのパートを弾く。duet のときはソウタのパートも重ねて鳴らす
  function keyboard(duet) {
    const r = replayed();
    if (r) {
      const o = r.v || {};
      R.pianoMiss = o.miss || 0;
      if (o.dm && !R.know.has('doremi')) { R.know.add('doremi'); addLog({ who: '', t: '……音符の下に、鉛筆の字がにじむように浮かび上がってきた。ド、レ、ミ。読めるか怪しいくらいのハルの字だ。' }); }
      return Promise.resolve(!!o.v);
    }
    return new Promise(res0 => {
      const res = v => { rec({ v, miss: R.pianoMiss, dm: R.know.has('doremi') }); res0(v); };
      const whites = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
      const blacks = [['C#4', 1], ['D#4', 2], ['F#4', 4], ['G#4', 5], ['A#4', 6]];
      let pos = 0, done = false;
      if (R.pianoMiss === undefined) R.pianoMiss = 0;
      openOverlay(`<p class="eyebrow">${duet ? '連弾' : 'ピアノ'}</p><h2>${duet ? 'ソウタと、はじめのフレーズを' : 'ハルのパートを弾く'}</h2>
        <div id="kbScore">${fullScoreSVG()}</div>
        <div class="progress" id="kbProg">${MELODY.map(() => '<i></i>').join('')}</div>
        <div class="kb">
          ${whites.map(n => `<button type="button" class="wk" data-n="${n}"><span>${KANA[n]}</span></button>`).join('')}
          ${blacks.map(([n, i]) => `<button type="button" class="bk" data-n="${n}" style="left:calc(${i} * 12.5% - 3.6%)" aria-label="黒鍵"></button>`).join('')}
        </div>
        <p class="note" id="kbMsg">${duet ? 'ソウタが自分のパートを弾き始めた。ハルのパートを重ねよう。' : '楽譜のとおりに、左から順に弾いてみよう。'}</p>
        <div class="row"><button type="button" class="btn" id="kbCancel">やめる</button></div>`);
      const prog = () => card.querySelectorAll('#kbProg i').forEach((el, i) => el.classList.toggle('on', i < pos));
      const sleep = keepAudioAwake();
      const press = b => {
        const n = b.dataset.n;
        if (done) return;
        pianoNote(FREQ[n], 0.22);
        b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 160);
        if (n === MELODY[pos]) {
          if (duet) sotaBeat(pos);
          pos++; prog();
          if (pos === MELODY.length) {
            done = true;
            // 弾き終えたら鍵盤は押せない（ソウタの音だけが続くあいだも）
            card.querySelectorAll('.kb button').forEach(k => { k.disabled = true; });
            const kbEl = card.querySelector('.kb'); if (kbEl) kbEl.classList.add('locked');
            if (duet) {
              $('#kbMsg').textContent = 'ソウタの音だけが、そのまま続いていく。';
              $('#kbCancel').closest('.row').hidden = true;
              const wait = P.sound ? sotaSolo() + 600 : 1600;
              setTimeout(() => { sleep(); closeOverlay(); res(true); }, wait);
            } else setTimeout(() => { sleep(); closeOverlay(); res(true); }, 700);
          }
        } else {
          pos = 0; prog();
          $('#kbMsg').textContent = '……音が違う。最初から。'; nmMark('puz');
          if (!R.know.has('doremi') && ++R.pianoMiss >= 3) {
            R.know.add('doremi'); saveRun();
            $('#kbScore').innerHTML = fullScoreSVG(true);
            $('#kbMsg').textContent = '……音符の下に、鉛筆の字がにじむように浮かび上がってきた。ド、レ、ミ。読めるか怪しいくらいのハルの字だ。';
            addLog({ who: '', t: '……音符の下に、鉛筆の字がにじむように浮かび上がってきた。ド、レ、ミ。読めるか怪しいくらいのハルの字だ。' });
          }
        }
      };
      card.querySelectorAll('.wk, .bk').forEach(b => {
        b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); press(b); });
        b.addEventListener('click', e => { if (e.detail === 0) press(b); });  // キーボード操作（Enter/Space）
      });
      const opened = performance.now();
      $('#kbCancel').onclick = () => { if (performance.now() - opened < 700) return; sleep(); closeOverlay(); res(false); };
    });
  }

  function wirePhoneBar(root) {
    const ph = root.querySelector('.phone'), bar = root.querySelector('.phone-bar');
    if (!ph || !bar) return;
    const thumb = bar.firstElementChild;
    const upd = () => {
      const r = ph.clientHeight / ph.scrollHeight;
      bar.hidden = r >= 1;
      const bh = bar.clientHeight, th = Math.max(24, bh * r);
      thumb.style.height = th + 'px';
      thumb.style.top = ((bh - th) * (ph.scrollTop / Math.max(1, ph.scrollHeight - ph.clientHeight))) + 'px';
    };
    ph.addEventListener('scroll', upd, { passive: true });
    requestAnimationFrame(upd);
  }

  // 図書だより「今月のおすすめ」。マス目に書いた紹介文で、下書きの赤い丸のマスを重ねると「つむぎへ　ごめんね」になる
  // 掲示板の紹介文だけでも、字の消された下書きだけでも読めない
  const POEM = ['椅子がひとつだけの、つめたい部屋。', 'ある日、むかいに椅子が置かれる。', '最初はぎこちない、二人の会話。',
                '読んだら、大切な人へ貸したくなる。', '昼休みのごはんのお供にも。', 'ためいきが出るほど、やさしい結末。', 'みなさんも、ぜひ読んでみてね。'];
  const POEM_MARKS = [[0, 10], [1, 4], [2, 3], [3, 9], [4, 4], [5, 1], [6, 3], [6, 13]];
  const POEM_COLS = 17;
  // mode: 'post'＝貼り出された紹介文、'draft'＝下書き（字は消され、丸だけ残る）、'overlay'＝丸の位置に紹介文を重ねたもの
  // mode：'base'＝重ね合わせの下（紹介文。丸のマスに目印だけ）、'top'＝重ね合わせの上（字のない下書き。赤い丸だけ）
  function poemGrid(mode) {
    const isMark = (r, c) => POEM_MARKS.some(([a, b]) => a === r && b === c);
    return `<div class="gr">${POEM.map((t, r) => `<div class="pc">${Array.from({ length: POEM_COLS }, (_, c) =>
      `<span class="${isMark(r, c) ? (mode === 'top' ? 'm' : 'mk') : ''}"><i>${mode === 'top' ? '' : (t[c] || '')}</i></span>`).join('')}</div>`).join('')}</div>`;
  }
  function poemHTML(mode) {
    const marked = (r, c) => mode !== 'post' && POEM_MARKS.some(([a, b]) => a === r && b === c);
    // 縦書き：右の列から1行目
    const rows = POEM.map((t, r) => `<div class="pc">${Array.from({ length: POEM_COLS }, (_, c) =>
      `<span class="${marked(r, c) ? 'm' : ''}"><i>${t[c] || ''}</i></span>`).join('')}</div>`).join('');
    const head = mode === 'draft' ? '図書だより7月号　「今月のおすすめ」下書き' : '図書だより7月号　今月のおすすめ『ひとりぶんの椅子』　紹介：図書委員 2年 水野';
    return `<div class="poem p-${mode}"><p class="t">${head}</p><div class="gr">${rows}</div>
      ${mode === 'draft' ? '<p class="t"><s>気づかれませんように</s>　<s>気づいてほしい</s></p>' : ''}</div>`;
  }
  async function viewDraft() {
    await overlayWait(`<p class="eyebrow">持ち物</p><h2>図書だよりの下書き</h2>${poemHTML('draft')}
      <p>清書したあとに消しゴムをかけたのか、鉛筆の字はほとんど読めない。マス目のところどころに、赤ペンの丸だけが残っている。</p>
      <p class="note">${R.know.has('dayori') ? '……掲示板の図書だよりと、マス目の数がまったく同じだ。' : '……このマス目と同じ形の紙が、どこかに貼り出されているのかもしれない。'}</p>`, '', ['閉じる']);
    closeOverlay();
  }
  // 掲示板の図書だよりを見る画面。下書きを持っていれば、画面の下に持ち物を出す。押すと「重ね合わせる」かを選ぶ
  // 返り値：'use'＝重ね合わせる、'close'＝閉じる
  function noticeView(canUse) {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      openOverlay(`<p class="eyebrow">掲示板</p><h2>図書だより7月号</h2>${poemHTML('post')}
        ${canUse ? `<div class="ov-inv"><span class="label">持ち物</span><button type="button" class="chip" id="useDraft"><img src="img/l_item_draft.webp" alt=""><span>図書だよりの下書き</span></button></div>
        <div class="row" id="useAsk" hidden><button type="button" class="btn primary" id="useYes">図書だよりに重ね合わせる</button><button type="button" class="btn" id="useNo">やめる</button></div>` : ''}
        <div class="row"><button type="button" class="btn primary" id="nClose">閉じる</button></div>`);
      $('#nClose').onclick = () => { closeOverlay(); res('close'); };
      if (canUse) {
        $('#useDraft').onclick = () => { $('#useAsk').hidden = false; $('#useDraft').classList.add('on'); };
        $('#useNo').onclick = () => { $('#useAsk').hidden = true; $('#useDraft').classList.remove('on'); };
        $('#useYes').onclick = () => { closeOverlay(); res('use'); };
      }
    });
  }
  // 重ね合わせ：掲示板の図書だよりの上に下書きを置き、プレイヤーが自分で動かしてマス目をぴったり合わせる
  // 合うと、赤い丸の下に紹介文の字が透けて見える。読むのも、プレイヤー自身
  function alignDraft() {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      let dx = 3, dy = 2;
      openOverlay(`<p class="eyebrow">持ち物を使う</p><h2>図書だよりに、下書きを重ねる</h2>
        <p class="note">下書きを動かして、マス目をぴったり合わせよう。</p>
        <div class="align-wrap" id="alWrap"><div class="poem p-post align-base">${poemGrid('base')}</div><div class="align-top" id="alTop">${poemGrid('top')}</div></div>
        <div class="align-pad">
          <button type="button" data-d="0,-1" aria-label="上へ">▲</button>
          <div><button type="button" data-d="-1,0" aria-label="左へ">◀</button><button type="button" data-d="1,0" aria-label="右へ">▶</button></div>
          <button type="button" data-d="0,1" aria-label="下へ">▼</button>
        </div>
        <p class="note" id="alMsg" aria-live="polite">　</p>
        <div class="row"><button type="button" class="btn primary" id="alOk" disabled>重ねたまま、じっと見る</button><button type="button" class="btn" id="alNo">やめる</button></div>`);
      const top = $('#alTop'), wrap = $('#alWrap');
      const place = () => {
        const cell = wrap.querySelector('.align-base .gr span'), base = wrap.querySelector('.align-base .gr');
        const w = cell.offsetWidth, h = cell.offsetHeight;
        const wr = wrap.getBoundingClientRect(), br = base.getBoundingClientRect();
        top.style.left = (br.left - wr.left) + 'px'; top.style.top = (br.top - wr.top) + 'px';
        top.style.transform = `translate(${dx * w}px, ${dy * h}px)`;
        const ok = dx === 0 && dy === 0;
        wrap.classList.toggle('ok', ok); $('#alOk').disabled = !ok;
        $('#alMsg').textContent = ok ? 'ぴったり重なった。赤い丸の中に、字が透けて見える。' : '　';
      };
      card.querySelectorAll('.align-pad button').forEach(b => {
        const go = () => { const [x, y] = b.dataset.d.split(',').map(Number); dx = Math.max(-5, Math.min(5, dx + x)); dy = Math.max(-5, Math.min(5, dy + y)); place(); };
        b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); go(); });
        b.onclick = e => { if (e.detail === 0) go(); };
      });
      requestAnimationFrame(place);
      $('#alOk').onclick = () => { closeOverlay(); res(true); };
      $('#alNo').onclick = () => { closeOverlay(); res(false); };
    });
  }
  // ツムギは昨日、保健室から（養護の先生を通して）この本を予約していた。ミオが借りたままでは、ツムギに届かない

      async board() {

          if (placed) { await say(['作戦ボード。ケイが組みたかった並びのまま、マグネットが置かれている。', 'スモールフォワードに「ケイ」。ベンチに「ハヤト」。']); return; }
          // チャイムで時間が戻ると、マグネットは顧問の並びに戻っている。並べ方は覚えているので、すぐに並べ直せる
          await say(['作戦ボード。マグネットは顧問の並びに戻っていた。', '……ケイが本当に組みたかった並びは、もう覚えている。']);
          if (R.over) return;
          if (await choose(['ケイの並びに直す', 'やめる']) !== 0) return;
          R.taken.board = { ...LINEUP_ANSWER }; R.seen.add('lineup');

                     `5つの位置の横には、それぞれの役目が小さな字で書き添えてある。${ROLE_LINE}`, '……ケイの字だ。一年が覚えられるように書いてあげたのかもしれない。',
                     'マグネットのまわりに、何度も動かしては戻したような跡がある。']);
          R.know.add('board'); await tick();

          R.know.add('self');

        // 調べたことでチャイムが鳴ったら、ボードには触れない
        if (R.over || R.loop !== lp) return;
        const c = await choose(['マグネットを動かす', 'やめる']);
        if (c !== 0) return;
        if (EASY() && !(R.know.has('logbook') && R.know.has('bag'))) { await say(['（部員のことがまだよくわからない。顧問の机の部誌と、ケイの荷物を見てから並べよう）']); return; }
        const v = EASY() ? { go: true, b: { ...LINEUP_ANSWER } } : await lineupBoard();
        if (EASY()) await say(['部誌の部員名簿と荷物のメモを思い出しながら、マグネットを動かした。', 'けがをしたハヤトはベンチ。アシストの多いユウマがポイントガード。外から決めたミナトがシューティングガード。背の高いダイチがセンター。足の速いシュンは、速攻で先頭を走るパワーフォワード。']);
        R.taken.board = v.b;
        if (!v.go) return;
        const ok = Object.keys(LINEUP_ANSWER).every(k => v.b[k] === LINEUP_ANSWER[k]);
        if (!ok) {
          R.taken.miss = (R.taken.miss || 0) + 1; nmMark('puz');
          await say(['マグネットを並べ終えて、ボードを眺めた。', '……何かが違う気がする。']);
          await tick(); return;

        await say(['最後に、「ケイ」のマグネットをスモールフォワードの位置に置いた。', '並べ終えたボードを、少し離れて眺めた。']);

    hint() {
      if (R.st === 'unraveled') return 'ケイのそばのボールを、調べてみましょう。';
      if (!R.know.has('board')) return ['部屋の中で、気になる場所を調べてみましょう。', '体育館の奥の作戦ボードが、気になります。'];
      if (!R.know.has('lineup')) {
        const miss = [[!R.know.has('logbook'), '顧問の机'], [!R.know.has('shooters'), '得点板'], [!R.know.has('bag'), 'パイプ椅子のそばの荷物'],
                      [!R.know.has('basket'), 'ボールかご'], [!R.know.has('self'), '作戦ボード（もう一度）']].filter(([m]) => m).map(([, n]) => n);
        const t = ['ケイは、作戦ボードのマグネットを何度も動かしては戻していたようです。ケイが本当に組みたかった並びを考えてみましょう。',
                   '手がかりが多いので、覚えきれないときは、紙やスマホのメモに書き出しながら考えるのがおすすめです。部員の名前・背番号・得意なこと・ボードの役目を、表にしてみましょう。読んだ文章は「ログ」で、部誌は「持ち物」から、もう一度見られます。',
                   miss.length ? `並べ方の手がかりは、部屋のあちこちにあります。まだ見ていない場所：${miss.join('、')}。` : 'メモには名前が書いていないものがあります。「誰のことか」は、部誌の部員名簿で確かめられます（持ち物から読み返せます）。',
                   '練習試合の記録は背番号だけです。部員名簿の背番号と見くらべると、誰の記録かわかります。けがでベンチになるのは誰か、から決めていきましょう。',
                   'ボードの役目の「最後まで走り続ける」は、試合の終わりまで走る力のこと。「速攻では先頭を走る」は、足の速さのことです。'];
        // 答えに近いヒントは、2回並べ間違えてから出す
        if (!miss.length && (R.taken.miss || 0) >= 2) t.push('ハヤトはけがでベンチ。外から決めた7番と11番のうち、残るのは11番のミナトでシューティングガード。アシスト最多の5番ユウマがポイントガード。いちばん背の高いダイチがセンター。いちばん足の速いシュンは、最後まで走りきれないのでパワーフォワード。ケイの場所は、最後に残ったところです。');
        return t;
      }
      if (!R.know.has('logbook') || !R.know.has('bag')) return 'まだ調べていない場所がありそうです。';
      return 'ケイに話しかけてみましょう。言葉を選ぶときは、正しさよりも、気持ちに寄り添うことを。';
    },

  const FONTS_READY = (() => {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const link = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    const sheet = new Promise(r => {
      if (!link || link.sheet) return r();
      link.addEventListener('load', r, { once: true }); link.addEventListener('error', r, { once: true });
    });
    const chars = [...new Set(document.documentElement.innerHTML.replace(/[\x00-\x7f\s]/g, ''))].join('') + 'ABCabc0123456789!?';
    const FACES = ['400 16px "Klee One"', '600 16px "Klee One"', '600 16px "Shippori Mincho B1"', '800 16px "Shippori Mincho B1"'];
    const load = async () => {
      await Promise.race([sheet, wait(8000)]);
      await Promise.all(FACES.map(f => document.fonts.load(f, chars).catch(() => {})));
      if (document.fonts.ready) await document.fonts.ready;
    };
    // 通信が遅くても、いつまでも待たせない
    return Promise.race([load(), wait(12000)]);
  })();

        <p class="note">あとから、タイトルの「設定」で変えられます。</p>`, '', ['やさしい', '普通']);
      const name = v === 0 ? 'やさしい' : '普通';
      const ok = await uiWait(`<p class="eyebrow">放課後をはじめる前に</p><h2>謎解きの難しさ</h2>

  async function startRun(ch, opt = {}) {

    if (ch === ORDER[0] && !opt.skipPuzzle && !opt.recall && (P.runNo || 1) > 1 && !Object.keys(P.cur.results).length && !P.cur.resolved) { P.cur.resolved = true; saveP(); await voidWait(resolveLines()); }
    if (opt.recall) await voidWait(opt.recall);
    closeOverlay(); clearRoof();
    busy = true; P.played = true; if (ch === 'infirmary') P.metTsumugi = true; saveP(); bgm(null); guest = null; guestRender();
    if (R && R.ch) keepMem();
    clearRun(); await setChapter(ch); newRun(ch); if (opt.skipPuzzle) R.skipPuzzle = true;
    if (P.diff === 'easy') nmMark('easy');   // 章を「やさしい」で遊んだら、この周回は隠しの演出の対象から外す

    render(); bgm('explore');
    busy = false;
    act(scriptFn('intro'), 'intro');
