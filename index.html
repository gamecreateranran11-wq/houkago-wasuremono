<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放課後のわすれもの</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
  [hidden] { display: none !important; }
  body { margin: 0; }
  :root {
    --ground: #15121c;
    --panel: #1f1a28;
    --panel2: #2a2334;
    --line: #3b3248;
    --ink: #ece6d6;
    --muted: #a69cb2;
    --akane: #e3875c;
    --gold: #d8b26a;
    --blue: #4f8ad8;
    --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--hand); font-size: 16px; }
  button { font: inherit; color: inherit; }
  button:focus-visible, .hs:focus-visible { outline: 2px solid var(--akane); outline-offset: 2px; }

  #app { height: 100%; max-width: 760px; margin: 0 auto; padding: 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .clock { display: flex; align-items: baseline; gap: 12px; }
  #clock { font-family: var(--serif); font-weight: 800; font-size: 22px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .bells { display: flex; gap: 5px; align-items: center; }
  .bells i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--akane); display: block; }
  .bells i.on { background: var(--akane); }
  .bells-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .bar-actions { display: flex; gap: 6px; }
  .bar-actions button { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .bar-actions button:hover { border-color: var(--akane); }
  .bar-actions button:disabled { opacity: .35; cursor: default; }
  .menu-wrap { position: relative; }
  .menu-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 170px; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .bar-actions .menu-panel button { text-align: left; border-color: transparent; padding: 8px 10px; }
  .bar-actions .menu-panel button:hover { border-color: var(--akane); }
  .menu-panel .vol { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; font-size: 13px; }
  .menu-panel .vol input { width: 110px; accent-color: var(--akane); }
  /* 文字の速さ：4つのボタンから1つを選ぶ */
  .speed { display: flex; flex-direction: column; gap: 5px; padding: 6px 10px; font-size: 13px; }
  .seg { display: flex; gap: 4px; }
  .seg button, .bar-actions .menu-panel .seg button { flex: 1; text-align: center; padding: 5px 6px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"], .bar-actions .menu-panel .seg button[aria-pressed="true"] { border-color: var(--akane); background: #3a2a2e; }
  .settings { display: flex; flex-direction: column; }
  .settings .set-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .settings .set-row:first-child { padding-top: 4px; }
  .settings .set-label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .settings .vol { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .settings .vol input { flex: 1; max-width: 240px; accent-color: var(--akane); }
  .title-redo { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(31, 26, 40, .6); }
  .title-redo .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .btn-sub { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; text-align: left; font-size: 13px; color: var(--ink); cursor: pointer; }
  .btn-sub:hover { border-color: var(--akane); }
  .btn-sub .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

  .scene-wrap { flex: 0 0 auto; min-height: 160px; display: flex; align-items: flex-start; justify-content: center; }
  .scene { position: relative; width: 100%; max-width: calc(58vh * 1.5); aspect-ratio: 3 / 2; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: #1c1620; }
  .scene img { position: absolute; display: block; max-width: none; }
  .stage { position: absolute; inset: 0; }
  .cutin { position: absolute; inset: 4%; z-index: 1; opacity: 0; transform: translateX(6%) rotate(.6deg); transition: opacity .35s ease, transform .35s ease; pointer-events: none; background: #1c1620; border: 3px solid #efe6d6; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); overflow: hidden; }
  .cutin.show { opacity: 1; transform: none; }
  .cutin img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
  .cutin .clock-hands { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene.cut .hs, .scene.story .hs { visibility: hidden; }
  .get-item { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(12, 9, 16, .55); opacity: 0; transition: opacity .25s ease; cursor: pointer; }
  .get-item.show { opacity: 1; }
  .get-in { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: scale(.85); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
  .get-item.show .get-in { transform: none; }
  .get-in img { position: static; max-width: 70%; height: auto; width: auto; max-height: min(30vh, calc((min(100vw, 760px) - 32px) / 3.4)); min-height: 0; filter: drop-shadow(0 8px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(255, 226, 180, .35)); }
  .get-label { margin: 0; font-size: 12px; letter-spacing: .3em; color: var(--gold); }
  .get-name { margin: 0; font-family: var(--serif); font-weight: 800; font-size: clamp(16px, 2.6vw, 22px); color: #f4ecdd; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .scene .bg { inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .5s ease, opacity .7s ease; }
  .scene.talk .bg, .scene.talk .sit { filter: brightness(.55) saturate(.8); }
  .scene .bg-clock { position: absolute; pointer-events: none; }
  .sit { position: absolute; width: auto; transition: filter .5s ease; pointer-events: none; }
  .sit.gone { display: none; }
  .scene .chime-cg { inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; pointer-events: none; z-index: 2; }
  .scene.cg .chime-cg { opacity: 1; }
  .scene.cg .hs { visibility: hidden; }
  .leftover { position: absolute; background: #efe8da; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .portrait { right: 1%; bottom: 0; height: 97%; width: auto; opacity: 0; transform: translateX(12px); transition: opacity .4s ease, transform .4s ease; pointer-events: none; }
  .portrait.show { opacity: 1; transform: none; }
  /* 章の子とは別に、その場にいる子（第五章のミオ）。左寄りに立つ。far は少し離れた所（二回り小さく、奥に） */
  .guest { position: absolute; left: 4%; bottom: 0; height: 94%; width: auto; opacity: 0; transition: opacity .45s ease, height .45s ease, bottom .45s ease, left .45s ease; pointer-events: none; z-index: 3; }
  .guest.show { opacity: 1; }
  .guest.far { height: 64%; bottom: 14%; left: 14%; filter: brightness(.9); }
  .scene.talk .guest.show { filter: none; }
  .hs { position: absolute; background: transparent; border: 1px dashed transparent; border-radius: 4px; padding: 0; cursor: pointer; }
  .hs::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff4de; box-shadow: 0 0 8px 2px rgba(255, 220, 170, .7); opacity: .55; animation: glint 2.8s ease-in-out infinite; }
  .hs span { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(15, 12, 20, .78); color: var(--ink); opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .hs span { pointer-events: none; }  /* 名札は押せない（隣の探索ポイントに重なっても、タップを横取りしない） */
  /* ホバーの枠と名札は、マウスのときだけ（タッチではタップ後に表示が残り、隣と重なって見えるため） */
  @media (hover: hover) {
    .hs:hover { border-color: rgba(236, 230, 214, .7); background: rgba(255, 240, 220, .07); }
    .hs:hover span { opacity: 1; }
  }
  .hs:focus-visible { border-color: rgba(236, 230, 214, .7); background: rgba(255, 240, 220, .07); outline: none; }
  .hs:focus-visible span { opacity: 1; }
  .hs:focus:not(:focus-visible) { outline: none; }
  /* タッチでは、小さな探索ポイントでも指で押しやすいよう、見た目はそのままで判定を少し広げる */
  @media (pointer: coarse) { .hs::before { content: ""; position: absolute; inset: -5px; } }
  .scene.talk .hs { visibility: hidden; }
  @keyframes glint { 50% { opacity: .15; transform: scale(.7); } }

  .inv { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
  .inv .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-right: 4px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--akane); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .chip img { height: 20px; width: auto; display: block; }
  .chip.act { border-color: var(--akane); color: var(--akane); }
  .chip.blue { border-color: var(--blue); }


  .msg { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 18px; min-height: 124px; max-height: 46vh; overflow-y: auto; box-sizing: border-box; cursor: pointer; }
  .speaker { font-family: var(--serif); font-weight: 800; color: var(--akane); font-size: 14px; letter-spacing: .1em; margin-bottom: 4px; }
  .text { line-height: 1.85; white-space: pre-wrap; }
  .text.narr { color: #d9d2c4; }
  .more { position: absolute; right: 14px; bottom: 6px; font-size: 11px; color: var(--akane); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .choice { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; line-height: 1.6; cursor: pointer; }
  .choice:hover { border-color: var(--akane); }

  .overlay { position: fixed; inset: 0; background: rgba(12, 10, 16, .9); display: grid; place-items: center; padding: 16px; overflow-y: auto; z-index: 10; }
  .ov-card > * { flex-shrink: 0; }
  .ov-card { width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .ov-card h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; margin: 0; text-wrap: balance; }
  .ov-card p { margin: 0; line-height: 1.85; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--akane); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 18px; cursor: pointer; }
  .btn:hover { border-color: var(--akane); }
  .btn.primary { background: var(--akane); border-color: var(--akane); color: #1a1218; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .sketch { width: 100%; max-width: 360px; align-self: center; display: block; }
  .painting { position: relative; width: 100%; max-width: 420px; align-self: center; border: 8px solid #e9e3d6; box-sizing: border-box; background: #999; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .painting::before { content: ''; display: block; padding-top: 66.667%; }
  .painting img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .painting .grey { filter: grayscale(.92) brightness(.82) contrast(.9); transition: opacity 3.6s ease; }
  .painting .grey.off { opacity: 0; }
  .painting .tears { position: absolute; inset: 0; width: 100%; height: 100%; }
  .painting .sign { position: absolute; right: 8px; bottom: 5px; font-size: 12px; color: #f7f2e8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .flip { position: relative; margin-bottom: 36px; width: 100%; max-width: 420px; align-self: center; }
  .flip::before { content: ''; display: block; padding-top: 66.667%; }
  .flip-in { position: absolute; inset: 0; transition: transform .22s ease-in; }
  .flip.turn .flip-in { transform: scaleX(0); }
  .flip .face { position: absolute; inset: 0; }
  .flip .face.back, .flip.on .face:not(.back) { display: none; }
  .flip.on .face.back { display: block; }
  .flip .face img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #flipBtn { align-self: center; }
  .zoom-btn { position: absolute; right: 0; bottom: -40px; width: 30px; height: 30px; padding: 5px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: rgba(20, 16, 26, .65); color: #f4ecdd; cursor: pointer; z-index: 2; }
  .zoom-btn:hover { background: rgba(20, 16, 26, .85); }
  .zoom-btn svg { width: 100%; height: 100%; display: block; }
  .sign-zoom { position: absolute; right: 6px; bottom: 6px; width: 58%; z-index: 3; cursor: zoom-out; border: 2px solid #efe6d6; box-shadow: 0 6px 16px rgba(0,0,0,.55); }
  .sign-zoom img, .flip .face .sign-zoom img { width: 100%; height: auto; object-fit: contain; display: block; box-shadow: none; }
  .sketch { border-radius: 4px; }
  .cg { width: 100%; display: block; border-radius: 4px; }
  .quote { font-family: var(--serif); font-size: 17px; border-left: 2px solid var(--akane); padding-left: 12px; }

  .dial { display: flex; gap: 14px; justify-content: center; }
  .poem { font-family: var(--serif); font-size: 17px; line-height: 2.1; background: #f1ebdf; color: #2a2327; padding: 14px 18px; border-radius: 3px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .poem .t { font-size: 13px; color: #6b5f58; margin-bottom: 4px; }
  .poem .gr { font-size: min(15px, 3.9vw); line-height: 1; display: flex; flex-direction: row-reverse; border-top: 1px solid #cdbca5; border-right: 1px solid #cdbca5; width: max-content; margin: 8px auto; }
  .poem .gr .pc { display: flex; flex-direction: column; }
  .poem .gr span { position: relative; width: 1.6em; height: 1.42em; display: flex; align-items: center; justify-content: center; border-left: 1px solid #cdbca5; border-bottom: 1px solid #cdbca5; }
  .poem .gr i { font-style: normal; writing-mode: vertical-rl; }
  .poem.p-draft .gr i { opacity: .1; filter: blur(1.7px); }
  .poem .gr span.m::after { content: ''; position: absolute; inset: 1px; border: 1.6px solid #b8423c; border-radius: 50%; }
  .poem.p-overlay .gr span:not(.m) i { opacity: .35; }
  .poem.p-overlay .gr span.m i { font-weight: 700; color: #8f2f2a; }
  .poem.p-draft { background: #e9e4da; transform: rotate(-.6deg); }
  /* 重ね合わせ：下に紹介文、上に字のない下書き（半透明の紙と赤い丸）。合うと丸の中の字が濃く見える */
  .row[hidden] { display: none; }
  .ov-inv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ov-inv .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .ov-inv .chip { display: inline-flex; align-items: center; gap: 6px; }
  .ov-inv .chip img { height: 20px; width: auto; }
  .ov-inv .chip.on { border-color: var(--akane); }
  .align-wrap { position: relative; overflow: hidden; border-radius: 3px; touch-action: manipulation; }
  .align-wrap .align-base { padding: 10px 14px; }
  .align-top { position: absolute; left: 0; top: 0; pointer-events: none; transition: transform .12s ease-out; }
  .align-top .gr { font-size: min(15px, 3.9vw); line-height: 1; display: flex; flex-direction: row-reverse; border-top: 1px solid rgba(160, 120, 100, .7); border-right: 1px solid rgba(160, 120, 100, .7); width: max-content; background: rgba(240, 236, 228, .5); box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
  .align-top .gr .pc { display: flex; flex-direction: column; }
  .align-top .gr span { position: relative; width: 1.6em; height: 1.42em; border-left: 1px solid rgba(160, 120, 100, .7); border-bottom: 1px solid rgba(160, 120, 100, .7); }
  .align-top .gr span.m::after { content: ''; position: absolute; inset: 1px; border: 1.6px solid #b8423c; border-radius: 50%; }
  .align-wrap.ok .align-top .gr { background: rgba(240, 236, 228, .18); }
  .align-wrap.ok .align-base span.mk i { font-weight: 700; color: #8f2f2a; }
  .align-wrap.ok .align-base span:not(.mk) i { opacity: .45; }
  .align-pad { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* 保健室：方向錠・視力検査表・来室カード・当番表 */
  .dl-show { display: flex; justify-content: center; gap: 8px; min-height: 40px; margin: 6px 0 10px; font-size: 26px; color: var(--gold); }
  .dl-show span { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .dl-pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center; margin-bottom: 10px; }
  .dl-pad button { font-size: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: #3a3446; color: #f3ead8; touch-action: manipulation; }
  .dl-pad .knob { border-radius: 50%; background: #6b6478; pointer-events: none; }
  .eye-chart { background: #fbfaf6; border-radius: 4px; padding: 10px 8px 6px; color: #222; }
  .eye-chart svg { display: block; width: 100%; height: auto; }
  .card-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fbf8f0; color: #2a2a2a; }
  .card-table th, .card-table td { border: 1px solid #b9b2a2; padding: 2px 4px; text-align: center; }
  #scene.room-dark #portrait, #scene.room-dark #sitFig, #scene.room-dark #guestFig { filter: url(#fRoomDark); }
  .card-scroll { max-height: 46vh; overflow-y: auto; border-radius: 4px; scrollbar-width: none; }
  .card-scroll::-webkit-scrollbar { display: none; }
  .sc-wrap { position: relative; padding-right: 12px; }
  .sc-track { position: absolute; top: 0; right: 2px; bottom: 0; width: 5px; border-radius: 3px; background: rgba(255,255,255,.14); pointer-events: none; }
  .sc-thumb { position: absolute; left: 0; width: 100%; border-radius: 3px; background: rgba(232,220,198,.75); }
  .roster-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fbf8f0; color: #2a2a2a; margin-bottom: 8px; }
  .roster-table th, .roster-table td { border: 1px solid #b9b2a2; padding: 4px 6px; }
  .roster-table s { color: #8a8478; }
  .wd-row { display: flex; justify-content: center; gap: 6px; margin: 6px 0 10px; }
  .wd-row button { width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: #3a3446; color: #f3ead8; font-size: 16px; touch-action: manipulation; }
  .wd-row button.on { background: #c9473c; border-color: #c9473c; }
  .trace-note { font-size: 14px; line-height: 1.8; }
  /* 913の棚：本の背を押して入れ替え、請求記号の順に並べ直す */
  .sh-row { display: flex; justify-content: center; align-items: flex-end; gap: 3px; padding: 10px 6px 0; background: linear-gradient(#5a3b24, #4a301d); border-radius: 4px 4px 0 0; box-shadow: inset 0 -6px 0 #3a2414; touch-action: manipulation; }
  .sh-book { width: 34px; height: 184px; border: 0; border-radius: 3px 3px 0 0; padding: 6px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; cursor: pointer; color: #f6efe2; box-shadow: inset -3px 0 0 rgba(0,0,0,.18); touch-action: manipulation; }
  .sh-book .t { writing-mode: vertical-rl; font-size: 12px; letter-spacing: .05em; line-height: 1; }
  .sh-book .lb { width: 28px; margin-bottom: 6px; background: #fbf8f0; color: #2a2a2a; border-radius: 2px; font-size: 9.5px; line-height: 1.25; text-align: center; padding: 2px 0; }
  .sh-book.gap { background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .sh-book.gap .t { color: rgba(255,255,255,.55); }
  .sh-book.sel { outline: 3px solid var(--gold); outline-offset: 1px; }
  .sh-sign { font-size: 12px; color: #e8dcc6; text-align: center; margin: 2px 0 6px; }
  @media (max-width: 400px) { .sh-book { width: 30px; height: 168px; } .sh-book .lb { width: 26px; font-size: 9px; } .sh-row { gap: 2px; } }

          <label class="vol">BGM<input id="volBgm" type="range" min="0" max="100" step="5" aria-label="BGMの音量"></label>
          <label class="vol">効果音<input id="volSe" type="range" min="0" max="100" step="5" aria-label="効果音の音量"></label>
          <button id="btnMenu" type="button">タイトルへ</button>
        </div>
      </div>
    </div>
  </header>

  <div id="inv" class="inv" aria-label="持ち物"></div>
  <div class="scene-wrap">
    <div id="loading" class="loading" hidden aria-live="polite">Now Loading<span>.</span><span>.</span><span>.</span></div>
    <div id="scene" class="scene" role="group" aria-label="">
      <div id="stage" class="stage">
        <img id="bgImg" class="bg" src="" alt="">
        <svg id="bgClock" class="bg bg-clock" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:none"></svg>
        <img id="sitFig" class="sit" src="" alt="">
        <div id="leftover" class="leftover" style="display:none"></div>
      </div>
      <div id="hsLayer"></div>
      <div id="cutin" class="cutin" aria-live="polite"></div>
      <div id="getItem" class="get-item" role="status" hidden></div>
      <img id="guestFig" class="guest" alt="">
      <img id="portrait" class="portrait" alt="">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="fRoomDark" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".64 0 0 0 0  0 .54 0 0 0  0 0 .56 0 0  0 0 0 1 0"/></filter></svg>
      <img class="chime-cg" src="img/chime_sky.webp" alt="17:00の夕焼け空。チャイムが響いている">
    </div>
  </div>

  <section id="msg" class="msg" aria-live="polite">
    <div id="speaker" class="speaker" hidden></div>
    <div id="text" class="text narr"></div>
    <div id="choices" class="choices"></div>
    <span id="more" class="more" hidden>▼</span>
  </section>
</div>

<div id="overlay" class="overlay" hidden><div id="ovCard" class="ov-card"></div></div>
<div id="flash" class="flash"></div>

<script>
(() => {
  const KEY = 'houkago-wasuremono-v1';
  const CHIME_AT = 10;
  const SPAN = 30;                       // 1章の長さ（分）
  const MIN_PER_TICK = SPAN / CHIME_AT;  // 調べるたびに進む分
  // 16:00 からの分 → 「16:30」のような表示
  const hm = m => `${16 + Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  const chStart = () => (C && C.startMin) || 0;
  const chEnd = () => chStart() + SPAN;
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const P = (() => {
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) return d; } catch (e) {}
    return { shelf: {}, runs: 0, endings: {}, sound: true };
  })();
  P.shelf = P.shelf || {}; P.endings = P.endings || {}; P.saved = P.saved || {};
  // cleared：今回のプレイで朝を迎えた子（章の開放に使う。「美術室からやり直す」で消える）／saved：実績（それでも残る）
  P.cleared = P.cleared || { ...P.saved };
  // shut：今回のプレイで部屋から閉め出された子。最後の放課後のエンディングを迎えるまで、その章には戻れない
  P.shut = P.shut || {};
  // 周回数は「最後の放課後のノーマル／トゥルーエンドを見た回数」。以前の数え方（章を始めるたび）の値は消す
  if (!P.runsV2) { P.runs = 0; P.runsV2 = true; }
  // 新しい仕様：runNo＝今の周回の番号。cur.results＝この周回で終えた章の結果（saved / shut / vanished）
  // shelfRun＝そのわすれものを手に入れた周回。わすれものが効くのは、前の周回以前に手に入れたものだけ
  P.runNo = P.runNo || 1; P.shelfRun = P.shelfRun || {};
  // heard：一度でも流れた曲（サウンドトラックで「？？？」を外すのに使う）。記録を始める前に遊んだ分は、見た結末などから推し量る
  P.heard = P.heard || {};
  if (!P.heardV1) {
    P.heardV1 = true;
    const E = P.endings || {}, h = P.heard;
    if (P.played || P.runs) { h.title = h.explore = true; }
    if (Object.keys(P.saved || {}).length) { h.core = h.musicbox = h.unravel = true; }
    if ((P.saved || {}).sota) h.sota = true;
    if (Object.keys(P.shelf || {}).length || E.BAD5 || E.BAD6) h.vanish = true;
    if (E.shut || E.BAD1 || E.BAD4) h.shut = true;
    if (E.BAD2) h.coreHeavy = true;
    if (E.BAD3) h.codep = true;
  }
  if (!P.cur) P.cur = { results: {} };
  const saveP = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

  /* 周回の途中経過（つづきから用）。操作待ちになるたびに自動で保存し、周回が終わったら消す */
  const SAVE_KEY = 'houkago-wasuremono-save-v1';
  function saveRun() {
    if (!R || R.over) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...R, items: [...R.items], know: [...R.know], seen: [...R.seen] })); } catch (e) {}
  }
  function loadRun() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!d) return null;
      d.items = new Set(d.items); d.know = new Set(d.know); d.seen = new Set(d.seen || []); d.log = d.log || []; d.over = false;
      d.ch = d.ch || 'art'; d.st = d.st || d.hina || 'here';
      return d;
    } catch (e) { return null; }
  }
  function clearRun() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  /* 手動セーブ：3つのファイル。放課後の途中経過と、そのときの進み具合（わすれもの棚・開放した章・閉ざされた扉）をまとめて記録する。
     実績（朝を迎えた記録・見たエンディング・周回数）と既読はファイルに含めず、ロードしても変わらない */
  const SLOT_KEY = n => `houkago-wasuremono-slot-v1-${n}`;
  const SLOTS = [1, 2, 3];
  function readSlot(n) {
    try {
      const d = JSON.parse(localStorage.getItem(SLOT_KEY(n)) || 'null');
      if (!d || !d.run) return null;
      const r = d.run;
      r.items = new Set(r.items); r.know = new Set(r.know); r.seen = new Set(r.seen || []); r.log = r.log || []; r.over = false;
      return d;
    } catch (e) { return null; }
  }
  function writeSlot(n) {
    const d = scr
      ? { at: Date.now(), label: saveLabel(R), mid: true, run: scr.start, prog: scr.prog,
          resume: { key: scr.key, lines: scr.lines, inputs: scr.inputs } }
      : { at: Date.now(), label: saveLabel(R), run: serR(R), prog: progSnap() };
    try { localStorage.setItem(SLOT_KEY(n), JSON.stringify(d)); return true; } catch (e) { return false; }
  }
  const slotLabel = d => (d.label || saveLabel(d.run)) + (d.mid ? '・会話の途中' : '');
  const slotDate = t => { const d = new Date(t), z = v => String(v).padStart(2, '0'); return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };

  /* 既読テキスト：周回をまたいで記録し、既読スキップがONなら早送りする。
     既読は章ごとに分ける（チャイムなど章をまたいで同じ文章でも、別の章で初めて読むときは飛ばさない） */
  const READ_KEY = 'houkago-wasuremono-read-v3';
  try { localStorage.removeItem('houkago-wasuremono-read-v1'); localStorage.removeItem('houkago-wasuremono-read-v2'); } catch (e) {}
  let prevLine = '';  // 直前に出した文章（既読の見分けに使う）
  const readKey = (who, t) => { const k = (C ? C.id : '') + '|' + who + '|' + t + '|' + prevLine; prevLine = who + '|' + t; return k; };
  const READ = (() => { try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch (e) { return new Set(); } })();
  let readTimer = null;
  function markRead(k) {
    if (READ.has(k)) return;
    READ.add(k);
    clearTimeout(readTimer);
    readTimer = setTimeout(() => { try { localStorage.setItem(READ_KEY, JSON.stringify([...READ])); } catch (e) {} }, 400);
  }
  if (P.skip === undefined) P.skip = true;
  // 文字の速さ：[値, 名前, 1文字あたりのミリ秒]。一括は、文章をすぐに全部出す
  const SPEEDS = [['instant', '一括', 0], ['fast', '早い', 16], ['normal', '普通', 32], ['slow', '遅い', 55]];
  if (!SPEEDS.some(([k]) => k === P.textSpeed)) P.textSpeed = 'normal';
  const charMs = () => (SPEEDS.find(([k]) => k === P.textSpeed) || SPEEDS[2])[2];
  const speedButtons = () => SPEEDS.map(([k, label]) => `<button type="button" data-sp="${k}" aria-pressed="${P.textSpeed === k}">${label}</button>`).join('');
  // 画面にあるすべての「文字の速さ」ボタンを、今の設定に合わせる
  function syncSpeed() { document.querySelectorAll('.seg [data-sp]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sp === P.textSpeed ? 'true' : 'false')); }
  function wireSpeed(root) {
    root.innerHTML = speedButtons();
    root.querySelectorAll('[data-sp]').forEach(b => b.onclick = e => { e.stopPropagation(); P.textSpeed = b.dataset.sp; saveP(); syncSpeed(); });
  }

  /* 組み合わせアイテム：素材を集めて「組み合わせる」まで、それに依存するストーリーは一切進まない。
     判定は「組み合わせた完成品を今の放課後で持っているか」。チャイムで持ち物が消えたら、組み直すまで再び止まる。 */
  const COMBOS = {
    painting: { parts: ['pieceA', 'pieceB', 'pieceC'], block: '（ヒナについて、まだ知らないことがある気がする）' },
    secondo: { parts: ['frag1', 'frag2', 'frag3', 'frag4'], block: '（ソウタについて、まだ知らないことがある気がする）' },
  };
  const combined = id => R.items.has(id);
  const partsHeld = id => COMBOS[id].parts.filter(p => R.items.has(p)).length;
  function comboBlock(id) {
    if (combined(id)) return null;
    return partsHeld(id) ? [COMBOS[id].block] : null;
  }

  // その子のわすれものが棚にある＝前の周回の記憶を引き継いでいる。この場合は、その子の手がかり集めと組み合わせを飛ばして対話に入れる
  const hasKey = who => !!P.shelf[who] && (P.shelfRun[who] || 0) < P.runNo;
  // 手がかり集めを飛ばせるか：わすれものを持っている周回か、BAD1からのやり直し
  const remembered = who => hasKey(who) || !!(R && R.skipPuzzle);

  let R;
  let C;  // 今遊んでいる章
  function newRun(ch) {
    R = { ch, loop: 0, ticks: 0, items: new Set(), taken: {}, know: new Set(), seen: new Set(), log: [], stage: 0,
          st: 'here', doom: false, over: false, drawerOpen: false, touched: false, cons: 0 };
  }

  /* ---------- message engine ---------- */
  const msg = $('#msg'), spk = $('#speaker'), txt = $('#text'), chs = $('#choices'), more = $('#more');
  let advance = null;
  /* 会話の途中セーブ：ストーリー（調べる・持ち物・ヒント・導入など）を始めた時点の状態と、
     そこから出した文章の数・選んだ答えを記録しておく。ロードすると、始めた時点から同じ答えで
     画面に出さずに早送りし、セーブしたときの文章から表示を再開する */
  let scr = null;     // 進行中のストーリーの記録 { key, start, prog, lines, inputs }
  let replay = null;  // ロード直後の早送り { skip: 画面に出さずに進める文章の数, inputs: 記録した答え }
  const serR = r => JSON.parse(JSON.stringify({ ...r, items: [...r.items], know: [...r.know], seen: [...r.seen] }));
  const progSnap = () => JSON.parse(JSON.stringify({ shelf: P.shelf, shelfRun: P.shelfRun, runNo: P.runNo, cur: P.cur }));
  function beginScript(key) { scr = key ? { key, start: serR(R), prog: progSnap(), lines: 0, inputs: [] } : null; }
  const rec = v => { if (scr) scr.inputs.push(v); return v; };
  // 早送り中なら、記録した答えを返す（画面は出さない）
  const replayed = () => (replay && replay.inputs.length ? { v: rec(replay.inputs.shift()) } : null);
  let gen = 0;  // タイトルに戻るたびに増やす。古い放課後の文章送りタイマーが、新しい放課後に割り込まないように
  let lastSkipped = false;  // 直前の文章を既読スキップで飛ばしたか
  // noSkip：既読でも早送りしない（チャイムの夕焼けなど、必ず見せたい演出）
  function line(l, wait = true, noSkip = false) {
    const g = gen;
    { const [w0, t0] = Array.isArray(l) ? l : ['', l];
      if (R && !w0 && typeof t0 === 'string' && STAND_RE.test(t0) && !STAND_NOT.test(t0) && !R.standing) { R.standing = true; render(); } }
    if (scr) scr.lines++;
    if (replay) {
      if (replay.skip > 0) {
        // 早送り：表示と記録だけ整えて、すぐ次へ
        replay.skip--;
        const [who, t, face] = Array.isArray(l) ? l : ['', l];
        const full = who ? `「${t}」` : t;
        spk.textContent = who; spk.hidden = !who;
        setTalk(!!C && (who === C.name || (!who && !!face)), face);
        txt.classList.toggle('narr', !who); txt.textContent = full;
        addLog({ who, t: full }); markRead(readKey(who, t));
        lastSkipped = true; advance = null;
        // 核心の曲を待っているあいだの文も数える（早送りした文で曲が始まる番になったら、その曲を覚えておく）
        if (pendingCore && --pendingCore === 0) bgm('core', 2.2);
        return Promise.resolve();
      }
      // 早送りが終わったら、その時点で流れているはずの曲をかけ直す。核心の曲を待っている途中なら、その待ちは消さない
      const rb = replay.bgm, pc = pendingCore; replay = null; syncSave();
      bgm(rb !== undefined ? rb : moodNow());
      if (pc) pendingCore = pc;
      noSkip = true;  // セーブしたときの文章は、既読でも止めて見せる
    }
    if (pendingCore && --pendingCore === 0) bgm('core', 2.2);
    return new Promise(res => {
      const [who, t, face] = Array.isArray(l) ? l : ['', l];
      $('#scene').classList.add('story');  // 文章を読んでいる間は探索用の目印を隠す
      spk.textContent = who; spk.hidden = !who;
      if (guest && who === guest.who && face && C && C.faces[face]) { guest.f = face; guestRender(); }
      setTalk(!!C && (who === C.name || (!who && !!face && !(guest && face.startsWith('mio')))), face);
      txt.classList.toggle('narr', !who);
      chs.innerHTML = ''; more.hidden = true;
      const full = who ? `「${t}」` : t;
      addLog({ who, t: full });
      const rk = readKey(who, t), known = READ.has(rk);
      markRead(rk);
      lastSkipped = !!(P.skip && known && !noSkip);
      if (lastSkipped) {
        // 既読：その場で全文を出し、少しだけ見せて次へ（未読・選択肢・画面表示で止まる）
        txt.textContent = full; advance = null;
        setTimeout(() => { if (g === gen) res(); }, wait ? 70 : 0);
        return;
      }
      let i = 0, done = false, timer = null;
      const finish = () => {
        clearInterval(timer); txt.textContent = full; done = true;
        if (!wait) { advance = null; res(); return; }
        more.hidden = false;
      };
      advance = () => {
        if (!done) { finish(); return; }
        advance = null; more.hidden = true; res();
      };
      if (reduce || !charMs()) finish();
      else { txt.textContent = ''; timer = setInterval(() => { if (g !== gen) { clearInterval(timer); return; } i++; txt.textContent = full.slice(0, i); if (i >= full.length) finish(); }, charMs()); }
    });
  }
  // 立ち絵の表情差分：normal（警戒）/ angry / surprise / sad / down / smile
  let face = 'normal';
  const FACE_CACHE = {};
  // 立ち絵は「座った絵（_s）」と「立った絵（_p）」の2組。部屋では座っていて、立ち上がる場面から立った絵に切り替える（R.standing）
  // 立った絵は表情の数が少ないので、ない表情は近いものを使う
  const STAND_SET = { hina: 'angry despair down grief sad smile surprise pout', sota: 'angry crysmile despair down grief sad smile surprise',
                      mio: 'angry crysmile despair down grief sad smile surprise stroke', kei: 'angry crysmile despair down grief sad smile surprise',
                      tsumugi: 'angry crysmile despair down grief sad surprise' };
  const STAND_NEAR = { reject: 'angry', shadow: 'despair', blank: 'down', pale: 'sad', breath: 'sad', teary: 'sad', angrysad: 'angry',
                       blame: 'angry', stroke: 'despair', strokedown: 'stroke', wrap: 'down', softsmile: 'smile', angrycry: 'grief', wrist: 'sad', chest: 'sad', chest_cry: 'grief', crysmile: 'grief', serious: 'down', lookup: 'down', surpriseup: 'surprise', angryup: 'angry', sadgrip: 'sad', grip: 'sad', confused: 'sad', pout: 'down', bookhide: 'down', nbleave: 'down', nbleavewonder: 'surprise' };
  // 座り絵が無い表情は、近い座り絵で代える（ミオの表紙を撫でる→撫でてうつむく。ヒナのむくれ顔は立って描いたあとの一言だけで、
  // 座ってむくれる場面はないが、先読みで無い絵を探しに行かないように、うつむきにしておく）
  const SIT_NEAR = { hina: { pout: 'down' }, mio: { stroke: 'strokedown' } };
  function faceFile(f) {
    const v = C.faces[f], key = v.slice(0, v.indexOf('_')), suf = v.slice(key.length + 1);
    if ((!R || !R.standing) && key === C.key) { const t = (SIT_NEAR[key] || {})[suf] || suf; return t === 'bust' ? `${key}_s` : `${key}_s_${t}`; }
    return standFile(key, suf);
  }
  // 立った絵のファイル名（ない表情は近いものに代える）。表示と先読みで同じものを使う
  function standFile(key, suf) {
    const set = (STAND_SET[key] || '').split(' ');
    let s = suf;
    if (s !== 'bust' && !set.includes(s)) s = STAND_NEAR[s] && set.includes(STAND_NEAR[s]) ? STAND_NEAR[s] : 'bust';
    return s === 'bust' ? `${key}_p` : `${key}_p_${s}`;
  }
  // 地の文で子どもが立ち上がったら、そこから立った絵にする（「立ち上がりかけて」「立ち上がろうと」は座ったまま）
  const STAND_RE = /立ち上がっ|立ち上がると/, STAND_NOT = /立ち上がりかけ|立ち上がろう/;  // 表情の絵を読み込んで持っておく（切り替えの瞬間に前の絵が残らないように）
  let talkHold = false;
  function setTalk(on, f) {
    const faces = C ? C.faces : {};
    const pt = $('#portrait'), wasShown = pt.classList.contains('show');
    if (on) {
      // 表情の指定がなければ、話し続けている間は今の表情のまま。出し直すときは「ふつう」から
      const want = f && faces[f] ? f : (wasShown ? face : 'normal');
      const url = `img/${faceFile(want)}.webp`;
      if (want !== face || pt.getAttribute('src') !== url) {
        face = want;
        const pre = FACE_CACHE[url];
        if (pre && pre.complete && pre.naturalWidth) pt.src = url;
        else {
          pt.style.visibility = 'hidden'; pt.src = url;
          (pt.decode ? pt.decode() : Promise.resolve()).catch(() => {}).then(() => { if (pt.getAttribute('src') === url) pt.style.visibility = ''; });
        }
      }
    }
    // 三人で話している場面（ミオとツムギ）では、地の文や心の声のあいだも、その子の絵を出したままにする
    if (!on && talkHold && wasShown) return;
    // 消えるときは表情を変えない（フェードアウト中に「ふつう」に戻らないように）
    pt.classList.toggle('show', on);
    $('#scene').classList.toggle('talk', on);
  }
  // その場にいる子（ゲスト）の立ち絵：guestShow('mioDown') で出し、その子が話すと表情が変わる。guestHide() で消す
  let guest = null;
  function guestRender() {
    const g = $('#guestFig');
    if (!guest || !C || !C.faces[guest.f]) { g.classList.remove('show'); return; }
    const url = `img/${faceFile(guest.f)}.webp`;
    if (g.getAttribute('src') !== url) g.src = url;
    g.classList.toggle('far', !!guest.far); g.classList.add('show');
  }
  const guestShow = (f, far = false, who = 'ミオ') => () => { guest = { f, far, who }; guestRender(); };
  const guestHide = () => () => { guest = null; guestRender(); };
  // 既読の文でも、前の文と次の文がどちらも未読なら飛ばさない（1文だけ飛ぶと、不具合に見えるため）
  async function say(lines) {
    for (let j = 0; j < lines.length; j++) {
      if (typeof lines[j] === 'function') { await lines[j](); continue; }
      const l = lines[j], [who, t] = Array.isArray(l) ? l : ['', l];
      let nextNew = true;
      if (j + 1 < lines.length) {
        const nl = typeof lines[j + 1] === 'function' ? (lines[j + 2] || '') : lines[j + 1], [nw, nt] = Array.isArray(nl) ? nl : ['', nl];
        nextNew = !READ.has((C ? C.id : '') + '|' + nw + '|' + nt + '|' + who + '|' + t);
      }
      await line(l, true, !lastSkipped && nextNew);
    }
  }
  // 文章送りは画面のどこを押しても進む（ボタン・選択肢・開いている画面の操作は除く）
  document.addEventListener('click', e => {

  // 時計のカットイン：針のない時計の絵に、今の時刻の針を重ねる（座標は ci_clock 画像 1536×1024 基準）
  function clockSVG() {
    const min = chStart() + (R.st === 'unraveled' ? SPAN + 1 : R.ticks * MIN_PER_TICK);

      const tipX = cx + sx * len, tipY = cy + sy * len, bX = cx - sx * tail, bY = cy - sy * tail;
      return `${bX + px},${bY + py} ${tipX + px * 0.25},${tipY + py * 0.25} ${tipX - px * 0.25},${tipY - py * 0.25} ${bX - px},${bY - py}`;

  /* ---------- sound ---------- */
  let actx = null;
  const PIANO_VOL = 0.65;  // チャイムと聞こえ方をそろえる
  // 音量（0〜1）。音のオン・オフの代わりにバーで調整する
  P.sound = true;
  if (P.bgmVol === undefined) P.bgmVol = 0.7;
  if (P.seVol === undefined) P.seVol = 0.8;
  // 効果音（チャイム・ピアノ・足音など）はBGMより大きく聞こえるので、全体を0.6倍に抑える（バーの位置はそのまま）
  const SE_TRIM = 0.6;
  const seMul = () => P.seVol / 0.8 * SE_TRIM;
  // 音を作る前から、スマホの消音スイッチ（マナーモード）に従う設定にしておく
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
  const audio = () => {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    if (actx.state !== 'running') { try { actx.resume(); } catch (e) {} }
    return actx;
  };
  // 音の出口：全体を持ち上げ、割れないように圧縮してから鳴らす
  let master = null;
  const MASTER_GAIN = 1.9;
  function out() {
    const a = audio();
    if (!master) {
      const comp = a.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
      master = a.createGain(); master.gain.value = MASTER_GAIN;
      master.connect(comp); comp.connect(a.destination);
    }
    return master;
  }
  // スマホは「タップを離した瞬間」などでないと音を出せないので、最初の操作で音の準備をしておく
  let audioReady = false;
  function unlockAudio() {
    if (!P.sound) return;
    // スマホの消音スイッチ（マナーモード）に従う。'ambient' はマナーモード中は鳴らず、ほかのアプリの音楽も止めない
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
    try {
      const a = audio();
      if (!audioReady) {
        const b = a.createBuffer(1, 1, 22050), src = a.createBufferSource();
        src.buffer = b; src.connect(a.destination); src.start(0);
        audioReady = true;
      }
    } catch (e) {}
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
  // 鍵盤を開いているあいだ、無音を流して音の出口を起こしておく（最初の音が遅れないように）
  function keepAudioAwake() {
    if (!P.sound) return () => {};
    try {
      const a = audio(), o = a.createOscillator(), g = a.createGain();
      g.gain.value = 0.00001; o.connect(g).connect(a.destination); o.start();
      return () => { try { o.stop(); } catch (e) {} };
    } catch (e) { return () => {}; }
  }
  function bell() {
    if (!P.sound || replay) return;
    try {
      const a = audio();
      // 学校のチャイム（1オクターブ上げて、スマホでも聞こえるように倍音を足す）
      const notes = [329.63, 261.63, 293.66, 196.0, 196.0, 293.66, 329.63, 261.63].map(f => f * 2);
      notes.forEach((f, i) => {
        const t = a.currentTime + i * 0.55;
        [[1, 0.3 * seMul()], [2, 0.12 * seMul()], [3, 0.05 * seMul()]].forEach(([m, v]) => {
          const o = a.createOscillator(), g = a.createGain();
          o.type = 'sine'; o.frequency.value = f * m;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.4 / Math.sqrt(m));
          o.connect(g).connect(out()); o.start(t); o.stop(t + 1.5);
        });
      });
    } catch (e) {}
  }
  // ピアノらしい減衰音
  function pianoNote(freq, gain = 0.2, delay = 0) {
    if (!P.sound) return;
    try {
      const a = audio(), t = a.currentTime + delay;
      gain *= PIANO_VOL * seMul();
      if (gain <= 0) return;
      [[1, 'triangle', 1], [2, 'sine', 0.5], [3, 'sine', 0.18], [4, 'sine', 0.08]].forEach(([m, type, v]) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.value = freq * m;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain * v, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 1.8 / Math.sqrt(m));
        o.connect(g).connect(out()); o.start(t); o.stop(t + 1.9);
      });
    } catch (e) {}
  }
  /* ---------- BGM：その場で音を組み立てて鳴らす ---------- */
  let bgmName = null, bgmGain = null, bgmTimer = null, bgmNext = 0, bgmStep = 0;
  let bgmPaused = false;  // 別のアプリに切り替えて、曲を止めているあいだ true
  const bgmLevel = () => 0.8 * P.bgmVol;
  const nf = n => 440 * Math.pow(2, (n - 69) / 12);  // MIDI番号→周波数
  // 1音：立ち上がり attack、持続、release で消える。lp＝こもらせる周波数、vib＝ビブラート
  // 雑音（息・弦の擦れ・鍵の音に使う）
  let noiseBuf = null;
  function getNoise() {
    const a = audio();
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return noiseBuf;
  }
  // 残響：BGMだけを、広い教室で鳴っているように響かせる
  let revIn = null, revOut = null, revBuf = null;
  function reverb() {
    const a = audio();
    if (!revIn) {
      if (!revBuf || revBuf.sampleRate !== a.sampleRate) {
        const len = Math.floor(a.sampleRate * 2.6); revBuf = a.createBuffer(2, len, a.sampleRate);
        for (let c = 0; c < 2; c++) { const d = revBuf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
      }
      const cv = a.createConvolver(); cv.buffer = revBuf;
      const wet = a.createGain(); wet.gain.value = 0.42;
      revIn = a.createGain(); revIn.connect(cv); cv.connect(wet); wet.connect(out()); revOut = wet;
    }
    return revIn;
  }
  // 1音：立ち上がり attack、持続、release で消える。lp＝こもらせる周波数、vib＝ビブラート（vibDelay 秒かけて深くなる）、det＝重ねる音のずれ（セント）
  function voice(freq, t, dur, vol, { type = 'sine', attack = 0.02, release = null, lp = 0, q = 0.5, vib = 0, vibRate = 5, vibDelay = 0, det = null, glide = 0 } = {}) {
    if (vol <= 0 || !bgmGain) return;
    const a = audio(), g = a.createGain();
    let dest = g;
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; f.Q.value = q; f.connect(g); dest = f; }
    const oscs = (det || [0]).map(d => { const o = a.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = d; o.connect(dest); return o; });
    // glide：半音 glide 個ぶん下からずり上がって目的の音に入る（弦楽器の、すすり泣くようなポルタメント）
    if (glide) oscs.forEach(o => { o.frequency.setValueAtTime(freq * Math.pow(2, -glide / 12), t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.16); });
    if (vib) {
      const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = vibRate;
      lg.gain.setValueAtTime(vibDelay ? 0 : freq * vib, t); if (vibDelay) lg.gain.linearRampToValueAtTime(freq * vib, t + vibDelay);
      l.connect(lg); oscs.forEach(o => lg.connect(o.frequency)); l.start(t); l.stop(t + dur + 0.1);
    }
    const v = vol / Math.sqrt(oscs.length);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + attack);
    if (release) { g.gain.linearRampToValueAtTime(v * 0.85, Math.max(t + attack + 0.01, t + dur - release)); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
    else g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    g.connect(bgmGain); oscs.forEach(o => { o.start(t); o.stop(t + dur + 0.05); });
  }
  // 息の音（管楽器の吹きはじめ）
  function breath(t, dur, vol, center) {
    if (vol <= 0 || !bgmGain) return;
    const a = audio(), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = getNoise(); s.loop = true; f.type = 'bandpass'; f.frequency.value = Math.min(center, 9000); f.Q.value = 1.4;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.04); g.gain.linearRampToValueAtTime(vol * 0.2, t + 0.22); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(bgmGain); s.start(t); s.stop(t + dur + 0.05);
  }
  const tone = (freq, t, dur, vol, type = 'sine', attack = 0.02) => voice(freq, t, dur, vol, { type, attack });
  const pad = (notes, t, dur, vol) => notes.forEach(n => { tone(nf(n), t, dur, vol, 'sine', dur * 0.3); tone(nf(n) * 1.003, t, dur, vol * 0.5, 'triangle', dur * 0.3); });
  const pluck = (n, t, vol, dur = 2.4) => { tone(nf(n), t, dur, vol, 'triangle', 0.01); tone(nf(n) * 2, t, dur * 0.6, vol * 0.35, 'sine', 0.01); };
  // 楽器
  // 弦楽器：少しずつずらした3本の弦を重ね、弓で弾くように立ち上げ、あとからビブラートをかける
  const bowed = (n, t, dur, vol, lp, vibRate) => {
    const at = Math.min(0.35, dur * 0.3), rl = Math.min(0.7, dur * 0.4);
    voice(nf(n), t, dur, vol, { type: 'sawtooth', attack: at, release: rl, lp, det: [-7, 0, 6], vib: 0.0045, vibRate, vibDelay: 0.35 });
    voice(nf(n), t, dur, vol * 0.35, { type: 'triangle', attack: at, release: rl });
  };
  const violin = (n, t, dur, vol) => bowed(n, t, dur, vol, 2600, 5.8);
  const viola = (n, t, dur, vol) => bowed(n, t, dur, vol, 1600, 5.4);
  const cello = (n, t, dur, vol) => bowed(n, t, dur, vol, 1000, 5);
  const contrabass = (n, t, dur, vol) => bowed(n, t, dur, vol, 480, 4.4);
  // 歌うチェロ（『胸の奥の声』の主旋律）：高い音ほど明るく鳴らし、深いビブラートと、弓をふくらませる長い立ち上がり。
  // cry＝下からすべりこむポルタメント（泣く・叫ぶ）。C2 から C6 まで、チェロの全音域で使う
  const celloSing = (n, t, dur, vol, cry = 0) => {
    const at = Math.min(0.55, dur * 0.4), rl = Math.min(0.8, dur * 0.4), lp = Math.min(4200, nf(n) * 7 + 500);
    const v = vol * (n >= 72 ? 0.8 : 1);

    voice(nf(n), t, dur, v * 0.4, { type: 'triangle', attack: at, release: rl, glide: cry });

  /* 選択肢：[文, 種類] の並び。種類＝yori（寄り添う）/ seiron（正論）/ nagu（慰める）/ oitsu（追い詰める）/ key（わすれもので出る最後の言葉）
     慰めるは2ループ目以降かつ2つ目以降の選択肢にだけ出す */
  let askCount = 0;  // 選択肢を出した回数（対話が始まったかどうかの判定に使う）
  // 選択肢の並び：種類ごとの位置が段や章で固まると、位置で答えがわかってしまうので、章と段ごとに並びを決めておく。
  // 毎回ランダムにすると、セーブから再開したときに選んだ答えがずれるため、固定の並びにする（慰めるは2ループ目以降だけ出る）
  const ASK_ORDER = {
    art:       { 1: ['seiron', 'oitsu', 'yori'], 2: ['yori', 'oitsu', 'nagu', 'seiron'], 3: ['oitsu', 'key', 'nagu', 'seiron'] },
    music:     { 1: ['seiron', 'oitsu', 'yori'], 2: ['yori', 'nagu', 'seiron', 'oitsu'], 3: ['key', 'oitsu', 'nagu', 'seiron'] },
    library:   { 1: ['yori', 'oitsu', 'seiron'], 2: ['oitsu', 'seiron', 'nagu', 'yori'], 3: ['oitsu', 'nagu', 'seiron', 'key'] },
    gym:       { 1: ['oitsu', 'seiron', 'yori'], 2: ['seiron', 'nagu', 'yori', 'oitsu'], 3: ['seiron', 'oitsu', 'key', 'nagu'] },
    infirmary: { 1: ['seiron', 'yori', 'oitsu'], 2: ['nagu', 'yori', 'oitsu', 'seiron'], 3: ['nagu', 'key', 'seiron', 'oitsu'] }
  };
  async function ask(opts, stage) {
    askCount++;
    const ord = (ASK_ORDER[C.id] || {})[stage];
    const pos = k => { const n = ord ? ord.indexOf(k) : -1; return n < 0 ? 99 : n; };
    const list = opts.filter(([, k]) => k !== 'nagu' || (R.loop >= 1 && stage >= 2))
      .map((o, n) => [o, n]).sort((x, y) => pos(x[0][1]) - pos(y[0][1]) || x[1] - y[1]).map(([o]) => o);
    const i = await choose(list.map(([t]) => t));
    const kind = list[i][1];
    if (stage === 1 && kind === 'yori') { R.touched = true; bgm(null); pendingCore = C.coreAt || 2; }   // coreAt：選択のあと何文目で核心の曲を始めるか（章ごと）
    if (stage >= 2 && (kind === 'yori' || kind === 'nagu' || kind === 'key')) R.touched = true;
    if (kind !== 'yori' && kind !== 'key') nmMark('miss');
    return kind;
  }
  // 最後の選択肢で「正論」「慰める」を選んだあと：わすれものがなければ心を閉ざしてループ、あれば3択
  async function lastWrong() {
    if (!hasKey(C.key)) return closeHeart();
    await say(['（……駄目だ。これ以上、かける言葉が見つからない）', `（それに、自分には、${C.who}の痛みを取り除くこともできない）`]);
    await line('（……こんな時、どうすれば……）', false);
    const t = await choose([`わからない……。けど、${C.who}を放っておけない`, '……ごめん。今の自分じゃ、何もしてあげられない', '辛いなら、ずっとそばにいるよ']);
    if (t === 0) { bgm('coreHeavy'); await say(C.badSubTalk); return chapterBad('BAD2', '身代わり', C.badSub, 'coreHeavy'); }
    if (t === 1) { await say(typeof C.giveUp === 'function' ? C.giveUp() : C.giveUp); return bad1(); }
    bgm('codep'); await say(C.badDepTalk);
    return chapterBad('BAD3', 'ふたりきりの放課後', C.badDep, 'codep');
  }

  function dial(n = 3, eyebrow = '画材棚の引き出し', title = '3桁のダイヤル錠', chars = '0123456789') {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      const d = Array(n).fill(0);
      openOverlay(`<p class="eyebrow">${eyebrow}</p><h2>${title}</h2>
        <div class="dial">${d.map((_, i) => `<div class="wheel">
          <button type="button" data-i="${i}" data-d="1" aria-label="${i + 1}桁目を上げる">▲</button>
          <output id="dg${i}">${chars[0]}</output>
          <button type="button" data-i="${i}" data-d="-1" aria-label="${i + 1}桁目を下げる">▼</button></div>`).join('')}</div>
        <div class="row"><button type="button" class="btn primary" id="dOpen">開ける</button><button type="button" class="btn" id="dCancel">やめる</button></div>`);
      // ピアノの鍵盤と同じく、指が触れた瞬間に1つ動かす（クリックを待たないので、速く押してもダブルタップの拡大にならない）
      const step = b => { const i = +b.dataset.i; d[i] = (d[i] + +b.dataset.d + chars.length) % chars.length; $('#dg' + i).textContent = chars[d[i]]; };
      card.querySelectorAll('.wheel button').forEach(b => {
        b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); step(b); });
        b.onclick = e => { if (e.detail === 0) step(b); };  // キーボードで押したときだけ
      });
      $('#dOpen').onclick = () => { closeOverlay(); res(d.map(k => chars[k]).join('')); };
      $('#dCancel').onclick = () => { closeOverlay(); res(null); };
    });
  }

  // 切れ端を破れ目の形で並べる（番号はない）。置いた順に左からつながり、隣どうしは破れ目の幅だけ重なる
  function arrangeFrags() {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      const order = [3, 1, 4, 2], tilt = { 1: -3, 2: 2.5, 3: -1.5, 4: 3.5 };
      const placed = [];
      const pct = v => `${(v / SCORE.w * 100).toFixed(3)}%`;
      const draw = () => {
        let x = 0;
        const onBoard = placed.map(n => {
          const w = SCORE.pieces[n - 1].w, h = `<img src="img/m_frag${n}.webp" alt="五線譜の切れ端" style="left:${pct(x)};width:${pct(w)}">`;
          x += w - SCORE.overlap; return h;
        }).join('');
        openOverlay(`<p class="eyebrow">4枚の切れ端</p><h2>つなぎ合わせる</h2>
          <p class="note">【操作】切れ端を押すと、左から順につながります。</p>
          <div class="fboard">${onBoard}</div>
          <div class="frags">${order.filter(n => !placed.includes(n)).map(n => `<button type="button" class="frag" data-n="${n}" style="transform:rotate(${tilt[n]}deg)"><img src="img/m_frag${n}.webp" alt="五線譜の切れ端"></button>`).join('')}</div>
          <p class="note" id="fragMsg"></p>
          <div class="row"><button type="button" class="btn" id="fReset">並べ直す</button><button type="button" class="btn" id="fCancel">やめる</button></div>`);
        card.querySelectorAll('.frag').forEach(b => b.onclick = () => {
          placed.push(+b.dataset.n);
          if (placed.length < 4) return draw();
          if (placed.join('') === '1234') { draw(); card.querySelector('#fReset').closest('.row').hidden = true; $('#fragMsg').textContent = '……破れ目が、ぴたりと重なった。'; setTimeout(() => { closeOverlay(); res(true); }, 1100); return; }
          draw(); nmMark('puz'); $('#fragMsg').textContent = '……破れ目が、かみ合わない。';
        });
        $('#fReset').onclick = () => { placed.length = 0; draw(); };
        $('#fCancel').onclick = () => { closeOverlay(); res(false); };
      };
      draw();
    });
  }

  // ソウタのパート（Primo）。10年以上弾いてきた子のパートなので、16分音符の分散和音と左手のベースで動く。
  // ハルの音を1つ弾くたびに、その拍（16分音符4つ＋左手8分音符2つ）が重なる
  const noteF = n => { const m = /^([A-G])([#b]?)(\d)$/.exec(n); if (!m) return 0;
    const k = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (k + (+m[3] + 1) * 12 - 69) / 12); };
  const PRIMO = [  // [右手16分×4, 左手8分×2]
    [['C5', 'E5', 'G5', 'C6'], ['C3', 'G3']], [['B5', 'G5', 'E5', 'G5'], ['E3', 'G3']],
    [['A5', 'F5', 'C6', 'A5'], ['F2', 'C3']], [['G5', 'E5', 'C5', 'E5'], ['C3', 'G3']],
    [['F5', 'D5', 'A5', 'F5'], ['D3', 'A3']], [['E5', 'C5', 'A4', 'C5'], ['A2', 'E3']],
    [['D5', 'F5', 'B5', 'D6'], ['G2', 'F3']], [['C6', 'G5', 'E5', 'C5'], ['C3', 'G2']]];
  const S16 = 0.14;
  function sotaBeat(i) {
    const [rh, lh] = PRIMO[i];
    rh.forEach((n, k) => pianoNote(noteF(n), k ? 0.07 : 0.09, 0.02 + k * S16));
    lh.forEach((n, k) => pianoNote(noteF(n), 0.16, 0.02 + k * S16 * 2));   // 中低音は2倍
  }
  // フレーズのあと、ソウタがひとりで弾く続き（2/4拍子で4小節＋終止）。2オクターブにわたる分散和音と駆け下りるパッセージ
  const SOLO_RH = ['E5', 'G5', 'C6', 'E6', 'D6', 'C6', 'B5', 'A5',
                   'G5', 'B5', 'D6', 'G6', 'F6', 'D6', 'B5', 'G5',
                   'A5', 'C6', 'E6', 'A6', 'G6', 'F6', 'E6', 'D6',
                   'C6', 'B5', 'A5', 'G5', 'F5', 'E5', 'D5', 'B4'];
  const SOLO_LH = [['C3', 'G3'], ['C3', 'G3'], ['G2', 'D3'], ['G2', 'D3'], ['A2', 'E3'], ['F2', 'C3'], ['D3', 'A3'], ['G2', 'F3']];
  function sotaSolo() {
    const t0 = 0.3;
    SOLO_RH.forEach((n, k) => pianoNote(noteF(n), 0.075, t0 + k * S16));
    SOLO_LH.forEach((pair, beat) => pair.forEach((n, k) => pianoNote(noteF(n), 0.14, t0 + beat * S16 * 4 + k * S16 * 2)));
    const end = t0 + SOLO_RH.length * S16;
    ['C2', 'C3', 'G3', 'C4', 'E4', 'G4', 'C5', 'E5', 'G5', 'C6'].forEach((n, k) => pianoNote(noteF(n), k < 2 ? 0.2 : k === 2 ? 0.14 : 0.07, end + k * 0.045));
    return (end + 2.2) * 1000;
  }
  // 鍵盤：ハルのパートを弾く。duet のときはソウタのパートも重ねて鳴らす
  function keyboard(duet) {
    const r = replayed();
    if (r) {
      const o = r.v || {};
      R.pianoMiss = o.miss || 0;
      if (o.dm && !R.know.has('doremi')) { R.know.add('doremi'); addLog({ who: '', t: '……音符の下に、鉛筆の字がにじむように浮かび上がってきた。ド、レ、ミ。読めるか怪しいくらいの、ハルの字だ。' }); }
      return Promise.resolve(!!o.v);
    }
    return new Promise(res0 => {
      const res = v => { rec({ v, miss: R.pianoMiss, dm: R.know.has('doremi') }); res0(v); };
      const whites = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];
      const blacks = [['C#4', 1], ['D#4', 2], ['F#4', 4], ['G#4', 5], ['A#4', 6]];
      let pos = 0, done = false;
      if (R.pianoMiss === undefined) R.pianoMiss = 0;
      openOverlay(`<p class="eyebrow">${duet ? '連弾' : 'ピアノ'}</p><h2>${duet ? 'ソウタと、はじめのフレーズを' : 'ハルのパートを弾く'}</h2>
        <div id="kbScore">${fullScoreSVG()}</div>
        <div class="progress" id="kbProg">${MELODY.map(() => '<i></i>').join('')}</div>
        <div class="kb">
          ${whites.map(n => `<button type="button" class="wk" data-n="${n}"><span>${KANA[n]}</span></button>`).join('')}
          ${blacks.map(([n, i]) => `<button type="button" class="bk" data-n="${n}" style="left:calc(${i} * 12.5% - 3.6%)" aria-label="黒鍵"></button>`).join('')}
        </div>
        <p class="note" id="kbMsg">${duet ? 'ソウタが自分のパートを弾き始めた。ハルのパートを重ねよう。' : '楽譜のとおりに、左から順に弾いてみよう。'}</p>
        <div class="row"><button type="button" class="btn" id="kbCancel">やめる</button></div>`);
      const prog = () => card.querySelectorAll('#kbProg i').forEach((el, i) => el.classList.toggle('on', i < pos));
      const sleep = keepAudioAwake();
      const press = b => {
        const n = b.dataset.n;
        if (done) return;
        pianoNote(FREQ[n], 0.22);
        b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 160);
        if (n === MELODY[pos]) {
          if (duet) sotaBeat(pos);
          pos++; prog();
          if (pos === MELODY.length) {
            done = true;
            if (duet) {
              $('#kbMsg').textContent = 'ソウタの音だけが、そのまま続いていく。';
              $('#kbCancel').closest('.row').hidden = true;
              const wait = P.sound ? sotaSolo() + 600 : 1600;
              setTimeout(() => { sleep(); closeOverlay(); res(true); }, wait);
            } else setTimeout(() => { sleep(); closeOverlay(); res(true); }, 700);
          }
        } else {
          pos = 0; prog();
          $('#kbMsg').textContent = '……音が違う。最初から。'; nmMark('puz');
          if (!R.know.has('doremi') && ++R.pianoMiss >= 3) {
            R.know.add('doremi'); saveRun();
            $('#kbScore').innerHTML = fullScoreSVG(true);
            $('#kbMsg').textContent = '……音符の下に、鉛筆の字がにじむように浮かび上がってきた。ド、レ、ミ。読めるか怪しいくらいの、ハルの字だ。';
            addLog({ who: '', t: '……音符の下に、鉛筆の字がにじむように浮かび上がってきた。ド、レ、ミ。読めるか怪しいくらいの、ハルの字だ。' });
          }
        }
      };
      card.querySelectorAll('.wk, .bk').forEach(b => {
        b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); press(b); });
        b.addEventListener('click', e => { if (e.detail === 0) press(b); });  // キーボード操作（Enter/Space）
      });
      const opened = performance.now();
      $('#kbCancel').onclick = () => { if (performance.now() - opened < 700) return; sleep(); closeOverlay(); res(false); };
    });
  }
  function phoneView() {

  function wirePhoneBar(root) {
    const ph = root.querySelector('.phone'), bar = root.querySelector('.phone-bar');
    if (!ph || !bar) return;
    const thumb = bar.firstElementChild;
    const upd = () => {
      const r = ph.clientHeight / ph.scrollHeight;
      bar.hidden = r >= 1;
      const bh = bar.clientHeight, th = Math.max(24, bh * r);
      thumb.style.height = th + 'px';
      thumb.style.top = ((bh - th) * (ph.scrollTop / Math.max(1, ph.scrollHeight - ph.clientHeight))) + 'px';
    };
    ph.addEventListener('scroll', upd, { passive: true });
    requestAnimationFrame(upd);
  }

  // 図書だより「今月のおすすめ」。マス目に書いた紹介文で、下書きの赤い丸のマスを重ねると「つむぎへ　ごめんね」になる
  // 掲示板の紹介文だけでも、字の消された下書きだけでも読めない
  const POEM = ['椅子がひとつだけの、つめたい部屋。', 'ある日、むかいに椅子が置かれる。', '最初はぎこちない、二人の会話。',
                '読んだら、大切な人へ貸したくなる。', '昼休みのごはんのお供にも。', 'ためいきが出るほど、やさしい結末。', 'みなさんも、ぜひ読んでみてね。'];
  const POEM_MARKS = [[0, 10], [1, 4], [2, 3], [3, 9], [4, 4], [5, 1], [6, 3], [6, 13]];
  const POEM_COLS = 17;
  // mode: 'post'＝貼り出された紹介文、'draft'＝下書き（字は消され、丸だけ残る）、'overlay'＝丸の位置に紹介文を重ねたもの
  // mode：'base'＝重ね合わせの下（紹介文。丸のマスに目印だけ）、'top'＝重ね合わせの上（字のない下書き。赤い丸だけ）
  function poemGrid(mode) {
    const isMark = (r, c) => POEM_MARKS.some(([a, b]) => a === r && b === c);
    return `<div class="gr">${POEM.map((t, r) => `<div class="pc">${Array.from({ length: POEM_COLS }, (_, c) =>
      `<span class="${isMark(r, c) ? (mode === 'top' ? 'm' : 'mk') : ''}"><i>${mode === 'top' ? '' : (t[c] || '')}</i></span>`).join('')}</div>`).join('')}</div>`;
  }
  function poemHTML(mode) {
    const marked = (r, c) => mode !== 'post' && POEM_MARKS.some(([a, b]) => a === r && b === c);
    // 縦書き：右の列から1行目
    const rows = POEM.map((t, r) => `<div class="pc">${Array.from({ length: POEM_COLS }, (_, c) =>
      `<span class="${marked(r, c) ? 'm' : ''}"><i>${t[c] || ''}</i></span>`).join('')}</div>`).join('');
    const head = mode === 'draft' ? '図書だより7月号　「今月のおすすめ」下書き' : '図書だより7月号　今月のおすすめ『ひとりぶんの椅子』　紹介：図書委員 2年 水野';
    return `<div class="poem p-${mode}"><p class="t">${head}</p><div class="gr">${rows}</div>
      ${mode === 'draft' ? '<p class="t"><s>気づかれませんように</s>　<s>気づいてほしい</s></p>' : ''}</div>`;
  }
  async function viewDraft() {
    await overlayWait(`<p class="eyebrow">持ち物</p><h2>図書だよりの下書き</h2>${poemHTML('draft')}
      <p>清書したあとに消しゴムをかけたのか、鉛筆の字はほとんど読めない。マス目のところどころに、赤ペンの丸だけが残っている。</p>
      <p class="note">${R.know.has('dayori') ? '……掲示板の図書だよりと、マス目の数がまったく同じだ。' : '……このマス目と同じ形の紙が、どこかに貼り出されているのかもしれない。'}</p>`, '', ['閉じる']);
    closeOverlay();
  }
  // 掲示板の図書だよりを見る画面。下書きを持っていれば、画面の下に持ち物を出す。押すと「重ね合わせる」かを選ぶ
  // 返り値：'use'＝重ね合わせる、'close'＝閉じる
  function noticeView(canUse) {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      openOverlay(`<p class="eyebrow">掲示板</p><h2>図書だより7月号</h2>${poemHTML('post')}
        ${canUse ? `<div class="ov-inv"><span class="label">持ち物</span><button type="button" class="chip" id="useDraft"><img src="img/l_item_draft.webp" alt=""><span>図書だよりの下書き</span></button></div>
        <div class="row" id="useAsk" hidden><button type="button" class="btn primary" id="useYes">図書だよりに重ね合わせる</button><button type="button" class="btn" id="useNo">やめる</button></div>` : ''}
        <div class="row"><button type="button" class="btn primary" id="nClose">閉じる</button></div>`);
      $('#nClose').onclick = () => { closeOverlay(); res('close'); };
      if (canUse) {
        $('#useDraft').onclick = () => { $('#useAsk').hidden = false; $('#useDraft').classList.add('on'); };
        $('#useNo').onclick = () => { $('#useAsk').hidden = true; $('#useDraft').classList.remove('on'); };
        $('#useYes').onclick = () => { closeOverlay(); res('use'); };
      }
    });
  }
  // 重ね合わせ：掲示板の図書だよりの上に下書きを置き、プレイヤーが自分で動かしてマス目をぴったり合わせる
  // 合うと、赤い丸の下に紹介文の字が透けて見える。読むのも、プレイヤー自身
  function alignDraft() {
    const r = replayed(); if (r) return Promise.resolve(r.v);
    return new Promise(res0 => {
      const res = v => res0(rec(v));
      let dx = 3, dy = 2;
      openOverlay(`<p class="eyebrow">持ち物を使う</p><h2>図書だよりに、下書きを重ねる</h2>
        <p class="note">下書きを動かして、マス目をぴったり合わせよう。</p>
        <div class="align-wrap" id="alWrap"><div class="poem p-post align-base">${poemGrid('base')}</div><div class="align-top" id="alTop">${poemGrid('top')}</div></div>
        <div class="align-pad">
          <button type="button" data-d="0,-1" aria-label="上へ">▲</button>
          <div><button type="button" data-d="-1,0" aria-label="左へ">◀</button><button type="button" data-d="1,0" aria-label="右へ">▶</button></div>
          <button type="button" data-d="0,1" aria-label="下へ">▼</button>
        </div>
        <p class="note" id="alMsg" aria-live="polite">　</p>
        <div class="row"><button type="button" class="btn primary" id="alOk" disabled>重ねたまま、じっと見る</button><button type="button" class="btn" id="alNo">やめる</button></div>`);
      const top = $('#alTop'), wrap = $('#alWrap');
      const place = () => {
        const cell = wrap.querySelector('.align-base .gr span'), base = wrap.querySelector('.align-base .gr');
        const w = cell.offsetWidth, h = cell.offsetHeight;
        const wr = wrap.getBoundingClientRect(), br = base.getBoundingClientRect();
        top.style.left = (br.left - wr.left) + 'px'; top.style.top = (br.top - wr.top) + 'px';
        top.style.transform = `translate(${dx * w}px, ${dy * h}px)`;
        const ok = dx === 0 && dy === 0;
        wrap.classList.toggle('ok', ok); $('#alOk').disabled = !ok;
        $('#alMsg').textContent = ok ? 'ぴったり重なった。赤い丸の中に、字が透けて見える。' : '　';
      };
      card.querySelectorAll('.align-pad button').forEach(b => {
        const go = () => { const [x, y] = b.dataset.d.split(',').map(Number); dx = Math.max(-5, Math.min(5, dx + x)); dy = Math.max(-5, Math.min(5, dy + y)); place(); };
        b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); go(); });
        b.onclick = e => { if (e.detail === 0) go(); };
      });
      requestAnimationFrame(place);
      $('#alOk').onclick = () => { closeOverlay(); res(true); };
      $('#alNo').onclick = () => { closeOverlay(); res(false); };
    });
  }

    async onTick() {
      if (R.st !== 'here' || R.seen.has('buzz') || R.ticks < (R.loop ? 2 : 4)) return;
      R.seen.add('buzz'); hideCut();
      await say([R.know.has('phone') ? ['……ミオのスマホが、また震えた。', 'ミオは画面を見ないまま、スマホをもっと奥へ押しやった。']
                                       : ['……閲覧机の上で、置きっぱなしのスマホが震えた。', 'ミオは画面を見ないまま、スマホを机の奥へ押しやった。'],
                 ['スマホが、続けざまに震えている。止まらない。', 'ミオは両手で本を抱きしめて、じっと耐えていた。'],
                 ['震え続けるスマホの画面が、一瞬だけ明るくなった。名前のない通知が、また一件増えている。', 'ミオの肩が、小さく跳ねた。']][Math.min(R.loop, 2)]);

                                        '書架の913の棚を、請求記号の順に並べ直しましょう。数字の小さい順に、同じ数字なら頭文字の五十音順に。913.6と913.68では、913.6が先です。',

  // ページの読み込み途中に始めても書体が崩れないよう、書体のスタイルシートが届いてから、使う字の書体を読みこむ
  // （スタイルシートより先に document.fonts.load を呼ぶと、まだ書体が登録されていないので、何も待たずに終わってしまう）
  const FONTS_READY = (() => {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const link = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    const sheet = new Promise(r => {
      if (!link || link.sheet) return r();
      link.addEventListener('load', r, { once: true }); link.addEventListener('error', r, { once: true });
    });
    const chars = [...new Set(document.documentElement.innerHTML.replace(/[\x00-\x7f\s]/g, ''))].join('') + 'ABCabc0123456789!?';
    const FACES = ['400 16px "Klee One"', '600 16px "Klee One"', '600 16px "Shippori Mincho B1"', '800 16px "Shippori Mincho B1"'];
    const load = async () => {
      await Promise.race([sheet, wait(8000)]);
      await Promise.all(FACES.map(f => document.fonts.load(f, chars).catch(() => {})));
      if (document.fonts.ready) await document.fonts.ready;
    };
    // 通信が遅くても、いつまでも待たせない
    return Promise.race([load(), wait(12000)]);
  })();

  function eyeChartSVG() {
    let y = 26, out = '';
    CHART.forEach(([lab, dirs], i) => {
      const r = [16, 13, 11, 9, 7.5, 6, 4.6][i], gap = r * 0.42, sw = r * 0.38;
      const w = dirs.length * r * 3.2, x0 = 160 - w / 2 + r * 1.6;
      out += `<text x="16" y="${y + 4}" font-size="11" fill="#444">${lab}</text>`;
      dirs.forEach((d, k) => {
        const cx = x0 + k * r * 3.2, rot = { R: 0, D: 90, L: 180, U: 270 }[d];
        const a = Math.asin(gap / 2 / r), x1 = cx + r * Math.cos(a), y1 = y - r * Math.sin(a), x2 = cx + r * Math.cos(a), y2 = y + r * Math.sin(a);
        out += `<path d="M${x1} ${y1} A${r} ${r} 0 1 0 ${x2} ${y2}" fill="none" stroke="#111" stroke-width="${sw}" transform="rotate(${rot} ${cx} ${y})"/>`;
      });
      if (lab === '0.7') out += `<line x1="${x0 - r * 2}" y1="${y + r + 5}" x2="${x0 + (dirs.length - 1) * r * 3.2 + r * 2}" y2="${y + r + 6}" stroke="#9a948a" stroke-width="0.9" opacity=".7"/>`;
      y += r * 2 + 16;
    });
    return `<svg viewBox="0 0 300 ${y}" role="img" aria-label="視力検査表。大きさの違う輪が段ごとに並んでいる">${out}</svg>`;
  }

  /* ---------- 第五章：ミオとツムギの会話（3段の選択） ----------
     間違えると「危うさ」が1つたまる。2つで静かな決別。「また逃げるの？」は即、静かな決別。
     「許してあげようよ」は危うさに関係なく、ツムギが爆発して決別。
     仲直りは、危うさ0でまっすぐな仲直り（一から友だちをやり直す・椅子を運ぶ）、1でぎこちない仲直り。

    // 外れは4つの型の言い方（慰める・正論・追い詰める）。分岐（risk・slips・決別の種類）は前と同じ
    // 1段目：ツムギの「怒ってないよ、ほんとに」
    await say(['（……二人のことに、自分が口をはさんでいいのかは、わからない）', '（でも、ツムギのあの笑い方は、さっき一人で話していたときと、同じだった）']);
    let c = [1, 2, 0][await choose(['ミオも、この本をずっと持ってたんだよ', '……ほんとに、怒ってない？', '……よかった、と、ほっとして言う'])];   // 0：慰める 1：代弁 2：正解
    if (c === 0) {
      wrong('smile');

                 'ツムギは笑ったまま、うなずいた。……ミオは、その笑顔を見て、うつむいた。', ['ミオ', '……いつもの顔だ', 'mioDown'],
                 ['ミオ', 'ツムギ、それ、つらいときの笑い方だよ。……やっぱり、無理させてる', 'mioGrief']]);
    } else if (c === 1) {
      wrong('side');
      await say(['「ミオも、この本をずっと持ってたんだよ」', 'ミオが、驚いたようにこちらを見た。',
                 ['ツムギ', '……そう、だよね。ミオも、苦しかったよね', 'smile'],
                 ['ミオ', '……ちがう。いちばん苦しかったのは、私じゃない', 'mioGrief'],

    } else {

                 ['ツムギ', 'でも、あの字を見たとき。……ミオの字だって、すぐわかって', 'down'], ['ツムギ', '……痛かった', 'sad'],
                 'ツムギは、自分で言ったことに驚いたように、口を押さえた。', ['ミオ', '……うん', 'mioGrief']]);

  // 周回を一度でも終えたか（5章を終えてエンディングを迎えた、または章の途中のBADで放課後が終わった）。BAD1は章のやり直しなので数えない

  // [id, 画像, 章, 題]（章の順。ミオとツムギの校門・仲直り・TRUEなどは、絵ができたらここに足す）

  ];
  P.album = P.album || {};
  // この仕組みより前に心をほどいていた子の絵は、見たものとして記録しておく
  { const was = { hina: ['sakura', 'gate'], sota: ['m_photo', 'm_gate'], mio: ['l_bridge'], kei: ['g_gate'] };
    Object.keys(was).forEach(k => { if (P.saved[k]) was[k].forEach(id => { P.album[id] = true; }); }); saveP(); }
  delete P.album.g_letter;  // ハヤトの手紙は、わすれもの（ケイの姿を変えたもの）の段にだけ出す
  function albumSee(id) { if (!P.album[id]) { P.album[id] = true; saveP(); } }
  // わすれもの：棚に並んだ姿（w_〇〇_v）と、姿を変えたあと（w_〇〇_s）。棚を空にしても、アルバムには残す
  // 主人公のわすれもの（生徒手帳）。GOOD で夕焼けの屋上に落ちている。TRUE で姿を変える（朝の屋上の手帳）。TRUE は未実装なので P.saved.me はまだ立たない
  const ME = { name: '自分',

    return `${(CHAPTERS[d.ch] || ART).room}・${time}・チャイム${d.loop}回`;
  }
  // この周回で次に入る教室（章は順番に進む。終えた章には戻れない）
  const nextCh = () => CHAPTERS[ORDER.find(id => selectable(id)) || ORDER[0]];
  // タイトルに出す、この周回の記録（終えた教室と結果）
  function runRecord() {
    const RES = { saved: 'ほどけた', shut: '閉ざされた扉', vanished: '消えた', died: '明かりが消えた' };
    return ORDER.map(id => CHAPTERS[id]).filter(ch => P.cur.results[ch.key]).map(ch => `${ch.room}：${RES[P.cur.results[ch.key]]}`).join('　');
  }
  // 「〇〇へ向かう」／「〇〇の放課後をやり直す」：わすれもの棚や記録は引き継いだまま、次の教室を17:00（その章のはじめ）から始める
  async function goRoom() {
    const ch = nextCh();
    if (loadRun()) {
      const v = await overlayWait(`<p class="eyebrow">${ch.label}</p><h2>${ch.room}の放課後を、${hm(ch.startMin || 0)}からやり直しますか？</h2>
        <p>今の放課後の続きは消えます。わすれもの棚と、この周回で終えた教室の記録はそのまま残ります。</p>`, '', ['やり直す', 'やめる']);
      if (v !== 0) return showTitle();
    }
    startRun(ch.id);
  }
  // 美術室からやり直す：わすれもの棚と途中の放課後を消して、最初の教室から始める（朝を迎えた記録などの実績は残す）
  async function resetAll() {
    const room = CHAPTERS[ORDER[0]].room;

    // わすれものを持っていないとき・まだ一度も周回を終えていないときは、引き継ぐかどうかの選択は出さない（棚も空にする）
    const v = has && runEnded()
      ? await uiWait(`<p class="eyebrow">${room}からやり直す</p><h2>わすれものを、持っていきますか？</h2>
      <p>途中の放課後と、この周回で終えた教室の記録は消えます。${room}から順番に始まります。</p>

      <p class="note">救えた実績・見たエンディング・周回数は残ります。</p>`, '', ['持っていく', '置いていく（棚を空にする）', 'やめる'])
      : await uiWait(`<p class="eyebrow">${room}からやり直す</p><h2>${room}から、もう一度始めますか？</h2>

      <p class="note">救えた実績・見たエンディング・周回数は残ります。</p>`, '', ['やり直す', 'やめる']).then(i => i === 0 ? 1 : 2);

  // プレイデータをリセット：実績も含めたすべてのプレイデータを消す

  // セーブ／ロード画面。mode='save'（プレイ中）なら保存と読み込みの両方、'load'（タイトル）なら読み込みだけ
  function showSlots(mode) {

    }).join('');

      <div class="save-slots">${rows}</div>

      }

      await uiWait(`<p class="eyebrow">セーブ</p><h2>${ok ? `ファイル ${n} に記録しました` : '記録できませんでした'}</h2>
        ${ok ? `<p>${saveLabel(R)}${scr ? '・会話の途中' : ''}</p>` : '<p class="note">ブラウザの保存領域が使えない状態です。</p>'}`, '', ['ゲームに戻る', 'セーブ画面へ', 'タイトルへ'])
        .then(v => v === 0 ? closeOverlay() : v === 1 ? showSlots(mode) : (closeOverlay(), advance = null, busy = false, showTitle(true)));
    });

      if (v !== 0) return showSlots(mode);

  function loadSlot(d) {
    if (R) R.over = true;
    gen++; advance = null; scr = null; replay = null;
    P.shelf = { ...d.prog.shelf }; P.shelfRun = { ...(d.prog.shelfRun || {}) };
    if (d.prog.runNo) P.runNo = d.prog.runNo;
    P.cur = d.prog.cur ? JSON.parse(JSON.stringify(d.prog.cur)) : { results: {} }; saveP();
    continueRun(d.run, d.resume);
  }
  async function continueRun(d, resume) {
    closeOverlay();
    busy = true;
    await setChapter(d.ch);
    R = d; busy = false;
    if (C.id === 'infirmary' && R.taken && R.taken.dark) setDark(true);  // 明かりを消したまま中断していたら、消したまま再開する
    render();
    const fn = resume && scriptFn(resume.key);
    if (fn) {
      replay = { skip: Math.max(0, resume.lines - 1), inputs: [...(resume.inputs || [])] };
      act(fn, resume.key);
      return;
    }
    idle();
  }
  /* ---------- 設定（タイトルから開く）：既読スキップ・文字の速さ・音量 ---------- */

  /* ---------- サウンドトラック（BAD以外の結末＝NORMAL・GOOD・TRUEのどれかを初めて見ると、タイトルに出る。ボーナストラックはTRUEのあと） ---------- */
  // [曲, 題, 版の印, 説明]。ゲームの中で流れる順に並べる。『放課後』はソウタとハルの連弾曲。ソロなどの版は、題のあとの印でわかるようにする

    ['endless', '終わらない放課後（仮）', '', 'チャイムが一音ずつゆっくり鳴り、時計の秒針だけが進む。ユーフォニアムとホルン、ファゴット'],
    ['tension', '向かい合うふたり（仮）', '', 'ためらうピアノ、悲しみのチェロ、温かい思い出のフルート。ヴァイオリンとチェロが問いかけ合う'],
    ['farewell', '静かな決別（仮）', '', 'ピアノの分散和音に、クラリネットとフルートの悲しい旋律。後半は、ヴァイオリンが前を向いて歌う'],
    ['burst', 'あふれた本心（仮）', '', '静かにあふれ出し、大きくふくらんでいく。チューバとバスドラムの重さ'],
    ['unravelDim', 'また明日', '何人かの朝（仮）', 'ピアノを中心にした、静かな『また明日』。一瞬だけ、和音が翳る'],

  ];
  const ostOpen = () => !!(P.endings && (P.endings.NORMAL || P.endings.NORMAL2 || P.endings.GOOD || P.endings.TRUE));

    const draw = () => card.querySelectorAll('.ost-row[data-k]').forEach(b => {

  function showShelf() {

    P.shelfSeen = P.shelfSeen || {};

  /* ---------- ログ ---------- */
  const LOG_MAX = 400;
  function addLog(e) {

    if (last && last.t === e.t && last.who === e.who && !e.choice) return;
    R.log.push(e); if (R.log.length > LOG_MAX) R.log.splice(0, R.log.length - LOG_MAX);

  }

  /* ---------- wiring ---------- */

  // 音量バー：BGMはすぐに反映、効果音は試しに1音鳴らす。メニューとタイトル画面のバーは同じ設定を共有する

    sEl.addEventListener('change', () => {

  const setMenu = open => { menuPanel.hidden = !open; $('#btnOpenMenu').setAttribute('aria-expanded', open ? 'true' : 'false'); };
  $('#btnOpenMenu').onclick = e => { e.stopPropagation(); setMenu(menuPanel.hidden); };
  document.addEventListener('click', e => { if (!menuPanel.hidden && !e.target.closest('.menu-wrap')) setMenu(false); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuPanel.hidden) setMenu(false); });
  ['btnMenu'].forEach(id => $('#' + id).addEventListener('click', () => setMenu(false)));
  $('#btnMenu').onclick = () => { advance = null; busy = false; showTitle(true); };
  $('#btnSave').onclick = e => { e.stopPropagation(); if (R && !R.over && !replay) showSlots('save'); };

  setChapter('art', false); newRun('art'); R.over = true; render(); idle();
  showTitle(true);
})();

</script>
