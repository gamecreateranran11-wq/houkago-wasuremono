  function showSoundtrack() {
    let playing = bgmName && OST.some(([k]) => k === bgmName) ? bgmName : null;
    const list = ostList(), got = list.filter(([k]) => ostHeard(k)).length;
    openOverlay(`<p class="eyebrow">おまけ</p><h2>サウンドトラック</h2>
      <p class="note">聴いた曲　${got} / ${list.length}　　押すと流れ、もう一度押すと止まります。</p>
      <div class="ost">${list.map(([k, ttl, ver, desc], i) => ostHeard(k)
        ? `<button type="button" class="ost-row${k === 'sotaDuet' ? ' bonus' : ''}" data-k="${k}"><span class="no">${k === 'sotaDuet' ? 'BONUS' : String(i + 1).padStart(2, '0')}</span>
            <span><span class="ttl">『${ttl}』${ver ? `<small>${ver}</small>` : ''}</span><span class="desc">${desc}</span></span><span class="st"></span></button>`
        : `<div class="ost-row locked"><span class="no">${String(i + 1).padStart(2, '0')}</span><span><span class="ttl">？？？</span><span class="desc">まだ聴いていない曲</span></span><span class="st"></span></div>`).join('')}</div>
      <div class="row"><button type="button" class="btn primary" id="oBack">戻る</button></div>`);
    const draw = () => card.querySelectorAll('.ost-row[data-k]').forEach(b => {
      const on = b.dataset.k === playing; b.classList.toggle('on', on); b.querySelector('.st').textContent = on ? '♪ 再生中' : '';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    card.querySelectorAll('.ost-row[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      playing = playing === k ? null : k; bgm(playing, 0.3); draw();
    });
    draw();
    $('#oBack').onclick = () => showExtras();
  }
  function showShelf() {
    const slots = [['ヒナ', 'hina', ART], ['ソウタ', 'sota', MUSIC], ['ミオ', 'mio', LIBRARY], ['ケイ', 'kei', GYM], ['ツムギ', 'tsumugi', INFIRMARY], [P.shelf.me ? '自分' : '？？？', 'me', ME]];
    P.shelfSeen = P.shelfSeen || {};
    const got = slots.filter(([, key]) => key && P.shelf[key]).length;
    const savedN = slots.filter(([, key]) => key && P.shelf[key] && P.saved[key]).length;
    const total = slots.length;
    // わすれものが姿を変えることは、1つ姿を変えるまで伏せておく
    openOverlay(`<p class="eyebrow">わすれもの棚</p><h2>残されたもの</h2>
      <div class="shelf-count"><span>集めたわすれもの <b>${got}</b> / ${total}</span>${savedN ? `<span class="gold">姿を変えたもの <b>${savedN}</b> / ${total}</span>` : ''}</div>
      <div class="shelf-bar" aria-hidden="true"><i style="width:${got / total * 100}%"></i>${savedN ? `<i class="sv" style="width:${savedN / total * 100}%"></i>` : ''}</div>
      <div class="shelf">${slots.map(([who, key, ch]) => {
        if (!(key && P.shelf[key])) return `<div class="slot locked"><span class="thumb-empty" aria-hidden="true">？</span><span class="who">${who}</span><span class="ttl">？？？</span></div>`;
        const it = ch.shelfItem(!!P.saved[key]), state = (P.saved[key] ? 's' : 'v');
        const isNew = P.shelfSeen[key] !== state;
        return `<button type="button" class="slot got${P.saved[key] ? ' saved' : ''}${isNew ? ' new' : ''}" data-k="${key}">
          <img class="thumb" src="${imgSrc(it.thumb)}" alt="">${isNew ? '<span class="tag">NEW</span>' : ''}
          <span class="who">${who}</span><span class="ttl">${it.title}</span>${notYet(key) ? '<span class="not-yet">この放課後では使えない</span>' : ''}</button>`;
      }).join('')}</div>
      <p class="note">誰かが消えたとき、その子のわすれものがここに並びます。${savedN || albumKnowSaved() ? 'その子を救えたら、わすれものも姿を変えます。' : ''}</p>
      <div class="row"><button type="button" class="btn primary" id="sBack">戻る</button></div>`);
    // 一度見たら NEW を外す（救って姿が変わったら、もう一度 NEW になる）
    slots.forEach(([, key]) => { if (key && P.shelf[key]) P.shelfSeen[key] = P.saved[key] ? 's' : 'v'; });
    saveP();
    $('#sBack').onclick = showTitle;
    [['hina', ART], ['sota', MUSIC], ['mio', LIBRARY], ['kei', GYM], ['tsumugi', INFIRMARY], ['me', ME]].forEach(([k, ch]) => {
      const b = card.querySelector(`[data-k="${k}"]`);
      if (b) b.onclick = async () => {
        const it = ch.shelfItem(!!P.saved[k]);
        await overlayWait(`<p class="eyebrow">${ch.name}のわすれもの</p><h2>${it.title}</h2>${it.body}${notYet(k) ? `<p class="note">${NOT_YET_NOTE}</p>` : ''}`, '', ['戻る']);
        showShelf();
      };
    });
  }

  /* ---------- ログ ---------- */
  const LOG_MAX = 400;
  function addLog(e) {
    if (!R || !R.log) return;
    const last = R.log[R.log.length - 1];
    if (last && last.t === e.t && last.who === e.who && !e.choice) return;
    R.log.push(e); if (R.log.length > LOG_MAX) R.log.splice(0, R.log.length - LOG_MAX);
    const b = $('#btnLog'); if (b) b.disabled = false;
  }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function showLog() {
    const items = (R && R.log || []).map(e => e.choice
      ? `<li class="log-choice">▶ ${esc(e.choice)}</li>`
      : `<li>${e.who ? `<span class="log-who">${esc(e.who)}</span>` : ''}<span class="log-t">${esc(e.t)}</span></li>`).join('');
    // 開いていた画面は、ボタンの動きごとそのまま戻す
    const wasOpen = !ov.hidden ? [...card.childNodes] : null, wasCls = ov.className, wasCard = card.className;
    openOverlay(`<p class="eyebrow">ログ</p><h2>これまでの放課後</h2>
      <ol class="log" id="logList">${items || '<li class="log-empty">まだ記録はありません。</li>'}</ol>
      <div class="row"><button type="button" class="btn primary" id="logClose">閉じる</button></div>`);
    const list = $('#logList'); list.scrollTop = list.scrollHeight;
    $('#logClose').onclick = () => {
      if (wasOpen !== null) { ov.className = wasCls; card.className = wasCard; card.replaceChildren(...wasOpen); }
      else closeOverlay();
    };
  }

  /* ---------- wiring ---------- */
  $('#btnLog').onclick = e => { e.stopPropagation(); showLog(); };
  // ヒント：進み具合に合わせて1つだけ出す（時間は進まない）
  $('#btnHint').onclick = () => act(hintScript, 'hint');
  $('#btnWait').onclick = () => act(waitScript, 'wait');
  // 音量バー：BGMはすぐに反映、効果音は試しに1音鳴らす。メニューとタイトル画面のバーは同じ設定を共有する
  function wireVol(bEl, sEl) {
    bEl.value = Math.round(P.bgmVol * 100); sEl.value = Math.round(P.seVol * 100);
    bEl.addEventListener('input', e => {
      P.bgmVol = e.target.value / 100; saveP(); $('#volBgm').value = e.target.value;
      if (bgmGain) { try { bgmGain.gain.setTargetAtTime(bgmLevel(), audio().currentTime, 0.1); } catch (er) {} }
    });
    let seMoved = 0;
    sEl.addEventListener('input', e => { P.seVol = e.target.value / 100; saveP(); $('#volSe').value = e.target.value; seMoved = Date.now();
      try { const t = audio().currentTime; [rainNodes, windNodes].forEach(r => { if (r && r.base) r.g.gain.setTargetAtTime(r.base * seMul(), t, 0.1); }); } catch (er) {} });
    // 動かし終えたら、確かめの音（高いド）を一度だけ鳴らす。
    // スマホでは、選んだままアプリを切り替えると「動かし終えた」の合図だけが出ることがあるので、実際に動かした直後のときだけ鳴らし、鳴らしたら選択を外す
    sEl.addEventListener('change', () => {
      if (document.hidden || Date.now() - seMoved > 1500) return;
      seMoved = 0; pianoNote(523.25, 0.2);
      try { sEl.blur(); } catch (e) {}
    });
  }
  wireVol($('#volBgm'), $('#volSe'));
  $('#btnSkip').onclick = e => { e.stopPropagation(); P.skip = !P.skip; saveP(); render(); };
  wireSpeed($('#spdMenu'));
  // メニュー：ログ・既読スキップ・音・タイトルへ をまとめたパネル
  const menuPanel = $('#menuPanel');
  const setMenu = open => { menuPanel.hidden = !open; $('#btnOpenMenu').setAttribute('aria-expanded', open ? 'true' : 'false'); };
  $('#btnOpenMenu').onclick = e => { e.stopPropagation(); setMenu(menuPanel.hidden); };
  document.addEventListener('click', e => { if (!menuPanel.hidden && !e.target.closest('.menu-wrap')) setMenu(false); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuPanel.hidden) setMenu(false); });
  ['btnMenu', 'btnWait', 'btnHowto'].forEach(id => $('#' + id).addEventListener('click', () => setMenu(false)));
  $('#btnHowto').onclick = () => { if (!busy) showHowto(false); };
  // タイトルへ戻る前に確認する（ほかの画面を開いているときは、そのまま戻る）
  $('#btnMenu').onclick = async () => {
    if (ov.hidden) {
      const v = await uiWait(`<p class="eyebrow">メニュー</p><h2>タイトルに戻りますか？</h2>
        <p class="note">ここまでの進み具合は、自動で記録されています。タイトルの「前回のつづきから」で再開できます。</p>`, '', ['タイトルに戻る', 'ゲームに戻る']);
      closeOverlay();
      if (v !== 0) return;
    }
    advance = null; busy = false; showTitle(true);
  };
  $('#btnSave').onclick = e => { e.stopPropagation(); if (R && (!R.over || onRoof()) && !replay) showSlots('save'); };

  setChapter('art', false); newRun('art'); R.over = true; render(); idle();
  showTitle(true);
})();

</script>
